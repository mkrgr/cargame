const car = { x: 0, y: 0, a: 0, vx: 0, vy: 0, w: 0, steer: 0, vf: 0, vl: 0, type: 0, mode: false, air: 0, boostCd: 0,
  braking: false, reversing: false, bloody: 0, ws: [S_ASPHALT, S_ASPHALT, S_ASPHALT, S_ASPHALT], prevW: [null, null, null, null] };
const WHEELS = [[14, -10], [14, 10], [-14, -10], [-14, 10]]; // vorne links/rechts, hinten links/rechts
const TOP = 560, ACC = 430, REV_TOP = 190, REV_ACC = 300, BRAKE = 950;
const KMH = 0.25;
const CR = 11, COFF = [-13, 0, 13];
const INV_I = 1 / 260;

const keys = { up: false, down: false, left: false, right: false, hand: false };
const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right', Space: 'hand' };
let started = false;
addEventListener('keydown', e => {
  if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = true; e.preventDefault(); }
  if (!started) { started = true; document.getElementById('intro').style.opacity = 0; }
  if (e.repeat) return;
  if (e.code === 'KeyR') newWorld(Math.floor(Math.random() * 999999) + 1);
  if (e.code === 'KeyC') { car.type = (car.type + 1) % CAR_TYPES.length; car.mode = false; }
  if (e.code === 'KeyM') carAction();
  if (e.code === 'KeyE') ejectSeat();
  if (e.code === 'KeyL') assistOn = !assistOn;
  if (e.code === 'KeyH') document.getElementById('help').classList.toggle('hidden');
  if (e.code === 'KeyN') night = !night;
});
addEventListener('keyup', e => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

let nearStatics = [], nearDyn = [];
function gatherNearby() {
  nearStatics = []; nearDyn = [];
  const ccx = Math.floor(car.x / CS), ccy = Math.floor(car.y / CS);
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const c = chunks.get(ckey(ccx + dx, ccy + dy));
    if (!c || !c.done) continue;
    for (const o of c.statics) if (Math.abs(o.x - car.x) < o.r + 80 && Math.abs(o.y - car.y) < o.r + 80) nearStatics.push(o);
    for (const o of c.dyn) if (Math.abs(o.x - car.x) < 120 && Math.abs(o.y - car.y) < 120) nearDyn.push(o);
  }
  for (const t of trains) for (const w of t.laid)                    // Züge sind feste Hindernisse
    if (Math.abs(w.x - car.x) < w.len / 2 + 80 && Math.abs(w.y - car.y) < w.len / 2 + 80)
      nearStatics.push({ t: 'wagon', x: w.x, y: w.y, w: w.len, h: 14, ang: w.a, r: w.len / 2 });
  for (const v of traffic) if (Math.abs(v.x - car.x) < 200 && Math.abs(v.y - car.y) < 200) {   // Verkehr
    nearStatics.push({ t: 'veh', x: v.x, y: v.y, w: v.m.L, h: v.m.W, ang: v.a, r: v.m.L / 2, veh: v });
    if (v.tr) nearStatics.push({ t: 'veh', x: v.tr.x, y: v.tr.y, w: v.m.art, h: v.m.W, ang: v.tr.a, r: v.m.art / 2, veh: v });
  }
  for (const L of nearLevels()) if (L.barrier && L.closed > 0.8)       // geschlossene Schranken
    for (const P of levelPosts(L)) {
      if (Math.abs(P.x - car.x) > 120 || Math.abs(P.y - car.y) > 120) continue;
      nearStatics.push({ t: 'barrier', x: P.x + P.ax * P.len / 2, y: P.y + P.ay * P.len / 2, w: P.len, h: 3,
                         ang: Math.atan2(P.ay, P.ax), r: P.len / 2 });
    }
}



// Oben: Geländer halten das Auto auf der Brückenfahrbahn.
// Unten: die Rampen/Widerlager der oberen Straße sind Wände, frei bleibt nur der Korridor der unteren Straße.

let shake = 0;
let impactAcc = 0;

// Der Turm schwenkt hektisch zu immer neuen Zielwinkeln und feuert Leuchtspur. Die Geschosse
// treffen nichts – am Ende ihrer Flugbahn stieben nur Staub und Funken auf.
function updateTurret(dt) {
  const active = CAR_TYPES[car.type].id === 'van' && car.mode;
  turret.open += ((active ? 1 : 0) - turret.open) * Math.min(1, dt * 4);
  turret.flash = Math.max(0, turret.flash - dt);
  if (active && turret.open > 0.95) {
    turret.retarget -= dt;
    if (turret.retarget <= 0) { turret.retarget = 0.25 + Math.random() * 0.9; turret.target = (Math.random() - .5) * TAU * 1.2; }
    let d = turret.target - turret.ang;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    turret.ang += clamp(d, -dt * 7, dt * 7) + Math.sin(clock * 23) * dt * 1.5;   // ruckelig
    turret.fire -= dt;
    while (turret.fire <= 0) {
      turret.fire += FIRE_INTERVAL;
      const fx = Math.cos(car.a), fy = Math.sin(car.a);
      const bx = car.x + fx * TURRET_X, by = car.y + fy * TURRET_X;
      const a = car.a + turret.ang + (Math.random() - .5) * 0.08, side = bullets.length % 2 ? 2.2 : -2.2;
      const ca = Math.cos(a), sa = Math.sin(a);
      const mx = bx + ca * 16 - sa * side, my = by + sa * 16 + ca * side;
      bullets.push({ x: mx, y: my, vx: ca * BULLET_SPEED + car.vx, vy: sa * BULLET_SPEED + car.vy, life: 0.45 + Math.random() * 0.25 });
      turret.flash = 0.04;
      // leere Hülse seitlich ausgeworfen
      emit(bx - sa * 6, by + ca * 6, -sa * (60 + Math.random() * 60) + car.vx, ca * (60 + Math.random() * 60) + car.vy,
           'rgba(214,170,70,', 1.2, 0.35);
    }
  } else turret.fire = 0;
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.life -= dt;
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.life <= 0) {                                                 // Einschlag: nur Staub und Funken
      for (let k = 0; k < 3; k++) {
        const a = Math.random() * TAU, s = 20 + Math.random() * 60;
        emit(b.x, b.y, Math.cos(a) * s, Math.sin(a) * s, k ? 'rgba(200,190,170,' : 'rgba(255,210,120,', 2 + Math.random() * 2, 0.4);
      }
      bullets.splice(i, 1);
    }
  }
}

function updateBond(dt) {
  const on = CAR_TYPES[car.type].id === 'bond' && car.mode;
  bond.open += ((on ? 1 : 0) - bond.open) * Math.min(1, dt * 4);
  bond.flash = Math.max(0, bond.flash - dt);
  bond.ejectCd = Math.max(0, bond.ejectCd - dt);
  bond.hatch = Math.max(0, bond.hatch - dt);
  if (on && bond.open > 0.9) {
    bond.fire -= dt;
    while (bond.fire <= 0) {
      bond.fire += 0.06;
      const fx = Math.cos(car.a), fy = Math.sin(car.a), side = (bond.shot++ % 2 ? 1 : -1) * 7;
      const mx = car.x + fx * 28 - fy * side, my = car.y + fy * 28 + fx * side;
      const a = car.a + (Math.random() - .5) * 0.05, ca = Math.cos(a), sa = Math.sin(a);
      bullets.push({ x: mx, y: my, vx: ca * BULLET_SPEED + car.vx, vy: sa * BULLET_SPEED + car.vy, life: 0.5 + Math.random() * 0.2 });
      bond.flash = 0.04;
      emit(mx - fx * 6, my - fy * 6, -fy * side * 12 + car.vx, fx * side * 12 + car.vy, 'rgba(214,170,70,', 1.2, 0.3);
    }
  } else bond.fire = 0;
  for (let i = flyers.length - 1; i >= 0; i--) {
    const f = flyers[i];
    f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.a += f.spin * dt;
    if (f.t < EJECT_TIME) continue;
    flyers.splice(i, 1);
    landPassenger(f);
  }
}
// Schleudersitz: Dachluke auf, Beifahrer fliegt samt Sitz im Bogen davon
function ejectSeat() {
  if (CAR_TYPES[car.type].id !== 'bond' || bond.ejectCd > 0 || car.air > 0) return;
  const side = Math.random() < 0.5 ? 1 : -1, fx = Math.cos(car.a), fy = Math.sin(car.a);
  const lat = 70 + Math.random() * 60;
  flyers.push({ x: car.x - fy * 5, y: car.y + fx * 5, t: 0, a: car.a, spin: (Math.random() - .5) * 6,
                vx: car.vx * 0.6 - fy * side * lat, vy: car.vy * 0.6 + fx * side * lat,
                hair: HAIR[Math.floor(Math.random() * HAIR.length)] });
  bond.ejectCd = EJECT_COOLDOWN; bond.hatch = 0.8;
  shake = Math.max(shake, 2.5);
  for (let k = 0; k < 10; k++) {
    const a = Math.random() * TAU, s = 20 + Math.random() * 50;
    emit(car.x, car.y, Math.cos(a) * s + car.vx * 0.5, Math.sin(a) * s + car.vy * 0.5, 'rgba(220,220,220,', 3 + Math.random() * 3, 0.5);
  }
}
// Gelandet: wird ein Fußgänger, der frei herumläuft (an Land, nicht im Wasser oder Wald)
function landPassenger(f) {
  let x = f.x, y = f.y;
  for (let r = 0; r < 120 && !walkable(surfAtFast(x, y)); r += 12) {
    const a = r * 0.7; x = f.x + Math.cos(a) * r; y = f.y + Math.sin(a) * r;
  }
  for (let k = 0; k < 8; k++) {
    const a = Math.random() * TAU, s = 20 + Math.random() * 40;
    emit(x, y, Math.cos(a) * s, Math.sin(a) * s, 'rgba(200,190,170,', 3 + Math.random() * 2, 0.5);
  }
  const c = chunkAt(x, y);
  if (!c || !c.done) return;
  c.dyn.push({ t: 'person', person: true, free: true, x, y, r: DYN.person.r, m: DYN.person.m, vx: 0, vy: 0,
               a: f.a, va: 0, c: '#2b2f36', hair: f.hair, walk: 20, timer: 1, phase: 0, down: 1.2, cross: 0 });
}

function updateRods(dt) {
  if (CAR_TYPES[car.type].id === 'homer' && car.mode && car.air <= 0) {
    rodTimer -= dt;
    if (rodTimer <= 0) {
      rodTimer = 0.55 + Math.random() * 0.4;
      rodSide = -rodSide;                                            // abwechselnd aus beiden Seitenfenstern
      const fx = Math.cos(car.a), fy = Math.sin(car.a), out = 90 + Math.random() * 90;
      rods.push({ x: car.x - fy * 11 * rodSide, y: car.y + fx * 11 * rodSide, a: car.a + Math.random() * 3,
                  vx: car.vx * 0.7 - fy * rodSide * out + fx * (Math.random() - .5) * 60,
                  vy: car.vy * 0.7 + fx * rodSide * out + fy * (Math.random() - .5) * 60,
                  spin: (Math.random() - .5) * 14, t: 0, landed: false, life: ROD_LIFE });
      if (rods.length > ROD_MAX) rods.shift();
    }
  } else rodTimer = 0.2;
  for (let i = rods.length - 1; i >= 0; i--) {
    const r = rods[i];
    r.x += r.vx * dt; r.y += r.vy * dt; r.a += r.spin * dt;
    if (!r.landed) {
      r.t += dt;
      if (r.t >= ROD_FLIGHT) {                                        // Aufschlag mit grünen Funken
        r.landed = true; r.vx *= 0.35; r.vy *= 0.35; r.spin *= 0.3;
        for (let k = 0; k < 8; k++) {
          const a = Math.random() * TAU, s = 30 + Math.random() * 60;
          emit(r.x, r.y, Math.cos(a) * s, Math.sin(a) * s, 'rgba(140,255,90,', 1.5 + Math.random() * 1.5, 0.45);
        }
      }
      continue;
    }
    const f = Math.exp(-4 * dt); r.vx *= f; r.vy *= f; r.spin *= f;
    r.life -= dt;
    if (r.life <= 0) { rods.splice(i, 1); continue; }
    if (Math.random() < dt * 1.5) emit(r.x + (Math.random() - .5) * 10, r.y + (Math.random() - .5) * 10,
                                      (Math.random() - .5) * 10, (Math.random() - .5) * 10, 'rgba(170,255,120,', 1.2, 0.6);
  }
}
// Brennstab trifft Tier oder Mensch (im späten Flug oder am Boden liegend): Zombie
function rodInfections() {
  for (const r of rods) {
    if (!r.landed && r.t < ROD_FLIGHT * 0.6) continue;               // noch zu hoch in der Luft
    const cx0 = Math.floor(r.x / CS), cy0 = Math.floor(r.y / CS);
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const c = chunks.get(ckey(cx0 + dx, cy0 + dy));
      if (!c || !c.done) continue;
      for (const o of c.dyn)
        if ((o.animal || o.person) && !o.zombie && !o.dead && Math.hypot(o.x - r.x, o.y - r.y) < o.r + 7) zombify(o);
    }
  }
}
function zombify(o) {
  o.zombie = true; o.down = 0; o.cross = 0; o.free = true; o.target = null; o.retarget = 0;
  for (let k = 0; k < 10; k++) {
    const a = Math.random() * TAU, s = 20 + Math.random() * 50;
    emit(o.x, o.y, Math.cos(a) * s, Math.sin(a) * s, 'rgba(130,255,90,', 2 + Math.random() * 2, 0.6);
  }
}

function drawRod(r) {
  const lift = r.landed ? 0 : Math.sin(Math.PI * r.t / ROD_FLIGHT), sc = 1 + 0.9 * lift;
  const fade = Math.min(1, r.life / 3), pulse = 0.7 + 0.3 * Math.sin(clock * 6 + r.x * 0.05);
  ctx.save(); ctx.translate(r.x, r.y);
  if (lift > 0) { ctx.fillStyle = `rgba(0,0,0,${(0.25 * (1 - lift)).toFixed(3)})`; ctx.fillRect(4 + 20 * lift, 5 + 26 * lift, 10, 4); }
  ctx.rotate(r.a); ctx.scale(sc, sc); ctx.globalAlpha = fade;
  ctx.fillStyle = `rgba(110,255,70,${(0.22 * pulse).toFixed(3)})`;   // Leuchthof
  ctx.beginPath(); ctx.ellipse(0, 0, 13, 7, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#2f9a2a'; rrect(-7.5, -2.2, 15, 4.4, 2.2);        // Stab
  ctx.fillStyle = `rgba(200,255,150,${(0.85 * pulse).toFixed(3)})`; rrect(-6, -1, 12, 2, 1);
  ctx.fillStyle = '#7d8086'; ctx.fillRect(-8, -2.4, 2, 4.8); ctx.fillRect(6, -2.4, 2, 4.8);  // Metallkappen
  ctx.restore();
}

function carAction() {
  const T = CAR_TYPES[car.type];
  if (T.id === 'kitt') {
    // Turbo-Booster: kräftiger Schub nach vorn und ein Sprung über alles hinweg
    if (car.boostCd > 0 || car.air > 0) return;
    const fx = Math.cos(car.a), fy = Math.sin(car.a), sp = Math.max(car.vf + 320, 560);
    car.vx = fx * sp; car.vy = fy * sp; car.w = 0;
    car.air = AIR_TIME; car.boostCd = BOOST_COOLDOWN;
    shake = Math.max(shake, 3);
    for (let k = 0; k < 16; k++) {
      const a = car.a + Math.PI + (Math.random() - .5) * 0.8, s = 60 + Math.random() * 120;
      emit(car.x - fx * 24, car.y - fy * 24, Math.cos(a) * s, Math.sin(a) * s, 'rgba(255,170,60,', 3 + Math.random() * 3, .5);
    }
  } else if (T.mode) car.mode = !car.mode;
}

function physics(dt) {
  if (car.air > 0) {
    // im Sprung: ballistisch, ohne Lenkung, Bodenhaftung und Kollisionen
    car.air -= dt;
    car.x += car.vx * dt; car.y += car.vy * dt;
    const d = Math.exp(-0.3 * dt); car.vx *= d; car.vy *= d;
    if (car.air <= 0) {                                             // Landung
      car.air = 0; shake = Math.max(shake, 5);
      for (let k = 0; k < 20; k++) {
        const a = Math.random() * TAU, s = 40 + Math.random() * 90;
        emit(car.x, car.y, Math.cos(a) * s, Math.sin(a) * s, 'rgba(200,190,170,', 4 + Math.random() * 4, .6);
      }
    }
    return;
  }
  const fx = Math.cos(car.a), fy = Math.sin(car.a), rx = -fy, ry = fx;

  let G = 0, A = 0, T = 0, Dr = 0, B = 0;
  for (let i = 0; i < 4; i++) {
    const w = WHEELS[i];
    let s = surfAtFast(car.x + fx * w[0] + rx * w[1], car.y + fy * w[0] + ry * w[1]);
    if (SURF[s].solid) s = s === S_DEEP ? S_SHALLOW : S_ROCK;
    car.ws[i] = s;
    const p = SURF[s];
    G += p.grip; A += p.accel; T += p.top; Dr += p.drag; B += p.brake;
  }
  G /= 4; A /= 4; T /= 4; Dr /= 4; B /= 4;

  let vf = car.vx * fx + car.vy * fy;
  let vl = car.vx * rx + car.vy * ry;

  // eigene Lenkung hat Vorrang, sonst lenkt der Spurhalteassistent (falls aktiv)
  const manual = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const steerIn = manual || (car.assistActive ? car.assistSteer : 0);
  car.steer += (steerIn - car.steer) * Math.min(1, dt * 7);

  car.braking = false; car.throttle = 0;
  if (keys.up && car.assistBrake && vf > 0) {                       // Assistent: vor der Kurve abbremsen
    vf = Math.max(0, vf - BRAKE * 0.45 * B * dt);
    car.braking = true;
  } else if (keys.up) {
    if (vf < -10) { brake(); }
    else {
      const lim = TOP * T;
      if (vf < lim) vf = Math.min(lim, vf + ACC * A * dt * Math.max(0.15, 1 - Math.max(0, vf) / lim));
      car.throttle = 1;
    }
  }
  if (keys.down) {
    if (vf > 10) { brake(); }
    else {
      const lim = REV_TOP * T;
      if (-vf < lim) vf = Math.max(-lim, vf - REV_ACC * A * dt * Math.max(0.15, 1 - Math.max(0, -vf) / lim));
      car.throttle = -1;
    }
  }
  function brake() {
    const dec = BRAKE * B * dt;
    vf = Math.abs(vf) <= dec ? 0 : vf - Math.sign(vf) * dec;
    car.braking = true;
  }

  vf -= vf * Dr * dt;
  if (!keys.up && !keys.down) {
    const c = 35 * dt;
    vf = Math.abs(vf) < c ? 0 : vf - Math.sign(vf) * c;
  }

  let grip = G;
  if (keys.hand) {
    grip *= 0.22;
    const c = 170 * B * dt;
    vf = Math.abs(vf) < c ? 0 : vf - Math.sign(vf) * c;
  }
  vl *= Math.exp(-grip * dt);

  const sf = clamp(vf / 90, -1, 1);
  let desired = car.steer * 2.7 * sf / (1 + Math.abs(vf) / 650);
  if (keys.hand) desired *= 1.5;
  car.w += (desired - car.w) * Math.min(1, (2 + G * 1.1) * dt);
  car.a += car.w * dt;

  car.vx = fx * vf + rx * vl;
  car.vy = fy * vf + ry * vl;
  car.x += car.vx * dt;
  car.y += car.vy * dt;

  collide();

  const nfx = Math.cos(car.a), nfy = Math.sin(car.a);
  car.vf = car.vx * nfx + car.vy * nfy;
  car.vl = car.vx * -nfy + car.vy * nfx;
  car.reversing = car.throttle < 0 && car.vf < 0;
}

// Stoß zwischen Auto (Kollisionskreis bei px,py) und unbeweglichem Hindernis; n zeigt vom Hindernis zum Auto
function resolveStatic(px, py, nx, ny, pen, e, fric = 0.08) {
  car.x += nx * pen; car.y += ny * pen;
  const ox = px - car.x, oy = py - car.y;
  const vpx = car.vx - car.w * oy, vpy = car.vy + car.w * ox;
  const vn = vpx * nx + vpy * ny;
  if (vn >= 0) return;
  const rn = ox * ny - oy * nx;
  const j = -(1 + e) * vn / (1 + rn * rn * INV_I);
  car.vx += j * nx; car.vy += j * ny;
  car.w += rn * j * INV_I;
  const tx = -ny, ty = nx, vt = car.vx * tx + car.vy * ty;
  car.vx -= tx * vt * fric; car.vy -= ty * vt * fric;
  impactAcc = Math.max(impactAcc, -vn);
}

function collide() {
  const fx = Math.cos(car.a), fy = Math.sin(car.a);
  for (const off of COFF) {
    const px = car.x + fx * off, py = car.y + fy * off;

    for (const o of nearStatics) {
      if (o.w) { // Gebäude: Rechteck, ggf. gedreht – Rechnung im lokalen System
        const c = Math.cos(o.ang || 0), sn = Math.sin(o.ang || 0);
        const lx = (px - o.x) * c + (py - o.y) * sn, ly = -(px - o.x) * sn + (py - o.y) * c;
        const qx = clamp(lx, -o.w / 2, o.w / 2), qy = clamp(ly, -o.h / 2, o.h / 2);
        let dx = lx - qx, dy = ly - qy, d = Math.hypot(dx, dy), pen = CR - d;
        if (d >= CR) continue;
        if (d < 1e-4) { // Mittelpunkt im Gebäude: über die nächste Kante hinausschieben
          const l = lx + o.w / 2, r = o.w / 2 - lx, t = ly + o.h / 2, b = o.h / 2 - ly, m = Math.min(l, r, t, b);
          [dx, dy] = m === l ? [-1, 0] : m === r ? [1, 0] : m === t ? [0, -1] : [0, 1];
          d = 1; pen = m + CR;
        }
        resolveStatic(px, py, (dx * c - dy * sn) / d, (dx * sn + dy * c) / d, pen, .3);
        if (o.veh) { o.veh.hit = 0.8; o.veh.v *= 0.5; }                // angefahrenes Fahrzeug hält an
      } else {
        const rr = o.t === 'tree' || o.t === 'pine' ? o.r * 0.7 : o.t === 'bush' ? o.r * 0.8 : o.r * 0.9;
        const dx = px - o.x, dy = py - o.y, d = Math.hypot(dx, dy), md = CR + rr;
        if (d < md && d > 1e-4) resolveStatic(px, py, dx / d, dy / d, md - d, o.t === 'bush' ? .1 : .35);
      }
    }

    for (const o of nearDyn) {
      if (o.dead) continue;
      const dx = o.x - px, dy = o.y - py, d = Math.hypot(dx, dy), md = CR + o.r;
      if (d >= md || d < 1e-4) continue;
      // Tier mittig vor (oder hinter) dem Auto und Tempo drauf: überfahren statt wegschieben
      // Überfahren nur mit dem Pursuit Special im Revenge-Modus, sonst wird nur geschoben
      if ((o.animal || o.person) && revenge() && Math.abs(car.vf) > RUNOVER_SPEED) {
        const lat = Math.abs((o.x - car.x) * -fy + (o.y - car.y) * fx);
        if (lat < (o.t === 'cow' ? 8 : o.person ? 12 : 6)) { runOver(o, fx * Math.sign(car.vf), fy * Math.sign(car.vf)); continue; }
      }
      const nx = dx / d, ny = dy / d, pen = md - d, tm = 1 + o.m;
      o.x += nx * pen / tm; o.y += ny * pen / tm;
      car.x -= nx * pen * o.m / tm; car.y -= ny * pen * o.m / tm;
      const ox = px - car.x, oy = py - car.y;
      const vpx = car.vx - car.w * oy, vpy = car.vy + car.w * ox;
      const vrel = (o.vx - vpx) * nx + (o.vy - vpy) * ny;
      if (vrel < 0) {
        const j = -1.5 * vrel / (1 / o.m + 1);
        o.vx += j * nx / o.m; o.vy += j * ny / o.m;
        o.va += (Math.random() - .5) * j / o.m * 0.08;
        car.vx -= j * nx; car.vy -= j * ny;
        if (o.person && -vrel > 30) { o.down = 1.6; o.cross = 0; }
      }
    }

    // tiefes Wasser, dichter Wald und Felswände sind undurchdringlich
    if (SURF[surfAtFast(px, py)].solid) {
      let nx = 0, ny = 0;
      for (let k = 0; k < 8; k++) {
        const a = k / 8 * TAU, ax = Math.cos(a), ay = Math.sin(a);
        if (!SURF[surfAtFast(px + ax * 18, py + ay * 18)].solid) { nx += ax; ny += ay; }
      }
      let l = Math.hypot(nx, ny);
      if (l < 1e-4) { nx = -car.vx; ny = -car.vy; l = Math.hypot(nx, ny) || 1; }
      resolveStatic(px, py, nx / l, ny / l, 2.5, .2);
    }
  }
}

// ---------- Zombies ----------
// Zombies schlurfen zum nächsten Lebenden in Reichweite und stecken ihn beim Biss an;
// Lebende fliehen vor Zombies in ihrer Nähe.
let zombies = [], living = [];
const ZOMBIE_SPEED = { person: 30, sheep: 34, cow: 24 };
function nearestOf(list, o, range) {
  let best = null, bd = range;
  for (const q of list) {
    if (q === o || q.dead) continue;
    const d = Math.hypot(q.x - o.x, q.y - o.y);
    if (d < bd) { bd = d; best = q; }
  }
  return best;
}
function steer(o, tx, ty, dt, k) {
  o.vx += (tx - o.vx) * Math.min(1, dt * k); o.vy += (ty - o.vy) * Math.min(1, dt * k);
  const sp = Math.hypot(o.vx, o.vy);
  if (sp > 4) { let da = Math.atan2(o.vy, o.vx) - o.a; da = Math.atan2(Math.sin(da), Math.cos(da)); o.a += da * Math.min(1, dt * 5); }
  if (o.person) o.phase += sp * dt * 0.45;
}
function zombieAI(o, dt) {
  o.retarget -= dt;
  if (o.retarget <= 0 || !o.target || o.target.dead || o.target.zombie) { o.retarget = 0.5; o.target = nearestOf(living, o, 260); }
  const sp = ZOMBIE_SPEED[o.t] || 30, wob = Math.sin(clock * 3 + o.x * 0.05) * 0.5;   // schlurfender Gang
  if (o.target) {
    const dx = o.target.x - o.x, dy = o.target.y - o.y, d = Math.hypot(dx, dy) || 1;
    if (d < o.r + o.target.r + 2) { zombify(o.target); o.target = null; }               // Biss
    else {
      const lunge = d < 90 ? 2.3 : 1;                                 // auf den letzten Metern ein Satz nach vorn
      const a = Math.atan2(dy, dx) + wob / lunge;
      steer(o, Math.cos(a) * sp * lunge, Math.sin(a) * sp * lunge, dt, 3);
    }
  } else {
    o.timer = (o.timer || 0) - dt;
    if (o.timer <= 0) { o.timer = 1 + Math.random() * 3; o.wa = Math.random() * TAU; }
    steer(o, Math.cos(o.wa + wob) * sp * 0.4, Math.sin(o.wa + wob) * sp * 0.4, dt, 2);
  }
}
function fleeZombie(o, z, dt) {
  const dx = o.x - z.x, dy = o.y - z.y, d = Math.hypot(dx, dy) || 1;
  const sp = o.t === 'sheep' ? 46 : o.t === 'cow' ? 34 : 42;           // langsamer als ein angreifender Zombie
  steer(o, dx / d * sp, dy / d * sp, dt, 4);
}

function updateDyn(dt) {
  const ccx = Math.floor(car.x / CS), ccy = Math.floor(car.y / CS);
  zombies = []; living = [];
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
    const c = chunks.get(ckey(ccx + dx, ccy + dy));
    if (c && c.done) for (const o of c.dyn) if ((o.animal || o.person) && !o.dead) (o.zombie ? zombies : living).push(o);
  }
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
    const c = chunks.get(ckey(ccx + dx, ccy + dy));
    if (!c || !c.done) continue;
    if (c.dyn.some(o => o.dead)) c.dyn = c.dyn.filter(o => !o.dead);
    for (const o of c.dyn) {
      const z = (o.animal || o.person) && !o.zombie && !(o.down > 0) && zombies.length ? nearestOf(zombies, o, 80) : null;   // bemerken Zombies erst spät
      if (o.zombie) zombieAI(o, dt);
      else if (z) fleeZombie(o, z, dt);
      else if (o.animal) animalAI(o, dt);
      else if (o.person) personAI(o, dt);
      else if (Math.abs(o.vx) + Math.abs(o.vy) + Math.abs(o.va) < 0.5) continue;
      o.x += o.vx * dt; o.y += o.vy * dt;
      if (!o.animal && !o.person) {
        o.a += o.va * dt;
        const f = Math.exp(-2.6 * dt);
        o.vx *= f; o.vy *= f; o.va *= Math.exp(-2 * dt);
      }
      for (const s of c.statics) {
        if (s.w) {                                    // Gebäude: aus dem Rechteck schieben
          if (!inRect(s, o.x, o.y, o.r)) continue;
          const cs = Math.cos(s.ang || 0), sn = Math.sin(s.ang || 0);
          const lx = (o.x - s.x) * cs + (o.y - s.y) * sn, ly = -(o.x - s.x) * sn + (o.y - s.y) * cs;
          const px = s.w / 2 + o.r - Math.abs(lx), py = s.h / 2 + o.r - Math.abs(ly);
          const [ux, uy] = px < py ? [Math.sign(lx) * px, 0] : [0, Math.sign(ly) * py];
          o.x += ux * cs - uy * sn; o.y += ux * sn + uy * cs;
          if (o.person) o.a += Math.PI / 2;
          continue;
        }
        const ddx = o.x - s.x, ddy = o.y - s.y, d = Math.hypot(ddx, ddy), md = o.r + s.r * 0.75;
        if (d < md && d > 1e-4) {
          const nx = ddx / d, ny = ddy / d;
          o.x += nx * (md - d); o.y += ny * (md - d);
          const vn = o.vx * nx + o.vy * ny;
          if (vn < 0) { o.vx -= 1.4 * vn * nx; o.vy -= 1.4 * vn * ny; }
        }
      }
    }
  }
}

const RUNOVER_SPEED = 60; // px/s, entspricht 15 km/h
const revenge = () => CAR_TYPES[car.type].id === 'interceptor' && car.mode;
function runOver(o, dirx, diry) {
  o.dead = true;
  const big = o.t === 'cow' ? 1.6 : o.t === 'person' ? 0.8 : 1;
  // Zombies bluten grün; Farbton der Flecken, des Kerns und der Spritzer
  const blood = o.zombie ? [[60, 150, 30], [30, 90, 14], [90, 200, 50]] : [[120, 10, 12], [90, 6, 8], [170, 16, 20]];
  car.bloodRgb = blood[1];
  paintGround(o.x, o.y, 40 * big, g => {
    // verschmierter Fleck in Fahrtrichtung
    for (let i = 0; i < 9; i++) {
      const f = Math.random();
      const x = o.x + dirx * f * 26 * big + (Math.random() - .5) * 10 * big;
      const y = o.y + diry * f * 26 * big + (Math.random() - .5) * 10 * big;
      const [br, bg, bb] = blood[0], v = 1 + Math.random() * 0.33;
      g.fillStyle = `rgba(${br * v | 0},${bg * v | 0},${bb * v | 0},${0.55 + Math.random() * 0.3})`;
      g.beginPath(); g.ellipse(x, y, (5 + Math.random() * 6) * big, (3 + Math.random() * 4) * big, Math.atan2(diry, dirx), 0, TAU); g.fill();
    }
    g.fillStyle = `rgba(${blood[1].join(',')},0.7)`;
    g.beginPath(); g.arc(o.x, o.y, 6 * big, 0, TAU); g.fill();
  });
  for (let k = 0; k < 18; k++) {
    const a = Math.atan2(diry, dirx) + (Math.random() - .5) * 2.2, s = 40 + Math.random() * 140;
    emit(o.x, o.y, Math.cos(a) * s, Math.sin(a) * s, `rgba(${blood[2].join(',')},`, 1.5 + Math.random() * 2, .5 + Math.random() * .3);
  }
  if (o.t === 'sheep') for (let k = 0; k < 10; k++) {
    const a = Math.random() * TAU, s = 20 + Math.random() * 60;
    emit(o.x, o.y, Math.cos(a) * s, Math.sin(a) * s, 'rgba(245,242,232,', 2 + Math.random() * 2, .9);
  }
  car.vx *= o.t === 'cow' ? 0.8 : 0.93; car.vy *= o.t === 'cow' ? 0.8 : 0.93;
  shake = Math.max(shake, o.t === 'cow' ? 5 : 2.5);
  car.bloody = 2.5; // Sekunden mit blutiger Reifenspur
}

// Zeichnet etwas dauerhaft auf den Boden aller betroffenen Chunks (Weltkoordinaten)
function paintGround(x, y, rad, fn) {
  for (let cy = Math.floor((y - rad) / CS); cy <= Math.floor((y + rad) / CS); cy++) {
    for (let cx = Math.floor((x - rad) / CS); cx <= Math.floor((x + rad) / CS); cx++) {
      const c = chunks.get(ckey(cx, cy));
      if (!c || !c.done) continue;
      c.ctx.save(); c.ctx.translate(-cx * CS, -cy * CS); fn(c.ctx); c.ctx.restore();
    }
  }
}

const isRoadSurf = s => s === S_ASPHALT || s === S_BRIDGE;
const walkable = s => !isRoadSurf(s) && !SURF[s].solid && s !== S_SHALLOW && s !== S_ICE;
function inRect(o, x, y, pad) {
  const c = Math.cos(o.ang || 0), sn = Math.sin(o.ang || 0);
  const lx = (x - o.x) * c + (y - o.y) * sn, ly = -(x - o.x) * sn + (y - o.y) * c;
  return Math.abs(lx) < o.w / 2 + pad && Math.abs(ly) < o.h / 2 + pad;
}

// Fußgänger: schlendern im Ort umher und meiden die Fahrbahn. Nur zum Überqueren gehen sie
// auf die Straße – quer zur Fahrbahn, zügig, und nur wenn kein Auto naht. Rast das Auto auf
// sie zu, springen sie zur Seite; erwischt es sie doch, stolpern sie und stehen wieder auf.
function personAI(o, dt) {
  if (o.down > 0) {
    o.down -= dt;
    const f = Math.exp(-4 * dt); o.vx *= f; o.vy *= f;
    return;
  }
  const dx = o.x - car.x, dy = o.y - car.y, dc = Math.hypot(dx, dy), cs = Math.hypot(car.vx, car.vy);
  let speed = o.walk;
  let dodge = false;
  // Revenge: spätere, langsamere Reaktion, und manche erstarren vor Schreck
  const rv = revenge();
  if (o.frozen === undefined) o.frozen = Math.random() < 0.4;
  if (dc < (rv ? 70 : 120) && cs > 40 && !(rv && o.frozen)) {
    const ux = car.vx / cs, uy = car.vy / cs, ahead = dx * ux + dy * uy, lat = -dx * uy + dy * ux;
    if (ahead > -15 && Math.abs(lat) < 45) {                        // in der Bahn des Autos: Sprung zur Seite
      const side = lat >= 0 ? 1 : -1;
      o.a = Math.atan2(ux * side, -uy * side); speed = rv ? 55 : 110; dodge = true;
    }
  }
  const freeze = rv && o.frozen && dc < 120 && cs > 40;              // starr vor Schreck
  const surf = surfAtFast(o.x, o.y);
  if (!dodge) {
    if (o.cross > 0) {                                              // beim Überqueren
      o.cross += dt;
      speed = dc < 220 && cs > 20 ? 60 : 34;
      if (!isRoadSurf(surf) && o.cross > 0.4) o.cross = 0;
    } else if (isRoadSurf(surf)) {                                  // versehentlich auf der Straße: rasch runter
      const R = roadQuery(o.x, o.y, segsNear(o.x, o.y, o.x, o.y));
      if (R.seg) {
        const nx = R.seg.nx[R.k], ny = R.seg.ny[R.k], s = Math.sign((o.x - R.seg.xs[R.k]) * nx + (o.y - R.seg.ys[R.k]) * ny) || 1;
        o.a = Math.atan2(ny * s, nx * s);
      }
      speed = 40;
    } else {
      o.timer -= dt;
      if (o.timer <= 0) {
        o.timer = 1.5 + Math.random() * 4;
        o.walk = Math.random() < 0.2 ? 0 : 16 + Math.random() * 12; // manchmal stehen bleiben
        o.a += (Math.random() - .5) * 1.6;
        speed = o.walk;
      }
      const ax = o.x + Math.cos(o.a) * 14, ay = o.y + Math.sin(o.a) * 14, sa = surfAtFast(ax, ay);
      if (isRoadSurf(sa) && speed > 0) {
        const quiet = dc > 280 || cs < 15;
        const R = quiet && Math.random() < 0.3 ? roadQuery(ax, ay, segsNear(ax, ay, ax, ay)) : null;
        if (R && R.seg) {                                           // überqueren: quer zur Fahrbahn
          const nx = R.seg.nx[R.k], ny = R.seg.ny[R.k], s = Math.sign(Math.cos(o.a) * nx + Math.sin(o.a) * ny) || 1;
          o.a = Math.atan2(ny * s, nx * s); o.cross = 0.01;
        } else {
          o.a += Math.PI * (0.6 + Math.random() * 0.8);              // umdrehen
        }
      } else if (!walkable(sa) || (!o.free && setlQuery(ax, ay, settlementsNear(ax, ay, ax, ay)).f > 1)) {
        o.a += Math.PI * (0.6 + Math.random() * 0.8);
      }
    }
  }
  if (freeze) speed = 0;
  const tx = Math.cos(o.a) * speed, ty = Math.sin(o.a) * speed, k = Math.min(1, dt * (dodge ? 12 : 6));
  o.vx += (tx - o.vx) * k; o.vy += (ty - o.vy) * k;
  o.phase += Math.hypot(o.vx, o.vy) * dt * 0.45;
}

// Tiere grasen, schlendern umher, bleiben auf ihrer Weide und weichen dem Auto aus.
// Stöße (aus collide) wirken über die Geschwindigkeit und klingen über die Angleichung ab.
function animalAI(o, dt) {
  const sheep = o.t === 'sheep';
  const dx = o.x - car.x, dy = o.y - car.y, dc = Math.hypot(dx, dy);
  const carSpeed = Math.hypot(car.vx, car.vy);
  let tvx = 0, tvy = 0;
  if (dc < (sheep ? 150 : 90) && (carSpeed > 20 || dc < 50)) {
    const sp = sheep ? 75 : 45;                     // Flucht, aber nicht über den Weiderand hinaus
    if (surfAtFast(o.x + dx / dc * 22, o.y + dy / dc * 22) === S_PASTURE) { tvx = dx / dc * sp; tvy = dy / dc * sp; }
  } else {
    o.timer -= dt;
    if (o.timer <= 0) {
      o.timer = 1.5 + Math.random() * 4;
      o.walk = Math.random() < 0.45 ? 0 : sheep ? 14 : 9;   // grasen oder gehen
      o.a += (Math.random() - .5) * 2.4;
    }
    tvx = Math.cos(o.a) * o.walk; tvy = Math.sin(o.a) * o.walk;
    if (o.walk && surfAtFast(o.x + Math.cos(o.a) * 22, o.y + Math.sin(o.a) * 22) !== S_PASTURE) {
      o.a += Math.PI; tvx = -tvx; tvy = -tvy;          // Weidegrenze: umdrehen
    }
  }
  const k = Math.min(1, dt * 2.5);
  o.vx += (tvx - o.vx) * k; o.vy += (tvy - o.vy) * k;
  const sp = Math.hypot(o.vx, o.vy);
  if (sp > 4) {                                     // in Laufrichtung drehen
    let da = Math.atan2(o.vy, o.vx) - o.a;
    da = Math.atan2(Math.sin(da), Math.cos(da));
    o.a += da * Math.min(1, dt * 5);
  }
}

// ---------- Spuren & Partikel ----------
function stamp(x0, y0, x1, y1, color, w) {
  const minx = Math.min(x0, x1) - w, maxx = Math.max(x0, x1) + w;
  const miny = Math.min(y0, y1) - w, maxy = Math.max(y0, y1) + w;
  for (let cy = Math.floor(miny / CS); cy <= Math.floor(maxy / CS); cy++) {
    for (let cx = Math.floor(minx / CS); cx <= Math.floor(maxx / CS); cx++) {
      const c = chunks.get(ckey(cx, cy));
      if (!c || !c.done) continue;
      const g = c.ctx, ox = cx * CS, oy = cy * CS;
      g.strokeStyle = color; g.lineWidth = w; g.lineCap = 'butt';
      g.beginPath(); g.moveTo(x0 - ox, y0 - oy); g.lineTo(x1 - ox, y1 - oy); g.stroke();
    }
  }
}

const particles = [];
function emit(x, y, vx, vy, color, size, life, fire) {
  if (particles.length > 900) particles.shift();
  const q = { x, y, vx, vy, color, size, life, max: life, fire: !!fire };
  particles.push(q);
  return q;
}

function effects(dt) {
  const fx = Math.cos(car.a), fy = Math.sin(car.a), rx = -fy, ry = fx;
  const speed = Math.hypot(car.vx, car.vy);
  car.bloody = Math.max(0, car.bloody - dt);
  const slipping = Math.abs(car.vl) > 70 || (keys.hand && speed > 60) ||
                   (car.braking && speed > 120 && SURF[car.ws[2]].brake < .6);
  for (let i = 0; i < 4; i++) {
    const w = WHEELS[i];
    const x = car.x + fx * w[0] + rx * w[1], y = car.y + fy * w[0] + ry * w[1];
    const p = SURF[car.ws[i]];
    const prev = car.prevW[i];
    if (prev && Math.hypot(x - prev[0], y - prev[1]) < 60) {
      if (p.track && speed > 4) stamp(prev[0], prev[1], x, y, p.track, 4);
      else if (p.skid && (slipping || (car.braking && speed > 200 && i >= 2))) stamp(prev[0], prev[1], x, y, p.skid, 4);
    }
    if (car.bloody > 0 && prev && speed > 4 && Math.hypot(x - prev[0], y - prev[1]) < 60)
      stamp(prev[0], prev[1], x, y, `rgba(${(car.bloodRgb || [120, 12, 14]).join(',')},${(0.45 * Math.min(1, car.bloody / 2.5)).toFixed(3)})`, 4);
    car.prevW[i] = car.air > 0 ? null : [x, y];
    if (car.air > 0) continue;

    if (i < 2) continue; // Partikel nur an den Hinterrädern
    // DeLorean im Flammenmodus: ab 88 km/h brennende Reifenspuren
    if (CAR_TYPES[car.type].id === 'dmc' && car.mode && Math.abs(car.vf) * KMH >= FLAME_KMH && prev) {
      stamp(prev[0], prev[1], x, y, 'rgba(28,16,8,0.35)', 5);
      const n = Math.ceil(Math.hypot(x - prev[0], y - prev[1]) / 8);
      for (let q = 0; q < n; q++) {
        const f = q / n;
        emit(prev[0] + (x - prev[0]) * f + (Math.random() - .5) * 3, prev[1] + (y - prev[1]) * f + (Math.random() - .5) * 3,
             (Math.random() - .5) * 6, (Math.random() - .5) * 6, '', 3 + Math.random() * 2.5, 1.6 + Math.random() * 1.2, true);
      }
    }
    const spin = car.throttle !== 0 && speed < 140 && p.accel < 0.7;
    let rate = 0;
    if (p.splash && speed > 30) rate = speed / 8;
    else if (p.smoke && slipping) rate = 30;
    else if (p.dust && !p.dustSlipOnly && speed > 50) rate = speed / 18 + (spin ? 20 : 0);
    else if (p.dust && (slipping || spin) && speed > 20) rate = 18;
    if (rate > 0 && Math.random() < rate * dt) {
      const col = p.smoke ? 'rgba(210,210,214,' : p.dust;
      const back = -0.25 - Math.random() * .3;
      emit(x, y, car.vx * back + (Math.random() - .5) * 60, car.vy * back + (Math.random() - .5) * 60,
           col, p.splash ? 3 + Math.random() * 3 : 4 + Math.random() * 5, .5 + Math.random() * .6);
    }
  }

  if (revenge() && car.throttle > 0 && car.air <= 0) {              // Flammen aus den Seitenrohren
    for (const sd of [-1, 1]) if (Math.random() < 0.7) {
      const ex = car.x - fx * 8 + rx * 13.5 * sd, ey = car.y - fy * 8 + ry * 13.5 * sd;
      emit(ex, ey, -fx * 90 + rx * sd * 20 + car.vx * 0.8, -fy * 90 + ry * sd * 20 + car.vy * 0.8,
           Math.random() < .5 ? 'rgba(255,150,40,' : 'rgba(255,220,110,', 2 + Math.random() * 2, 0.18);
    }
  }
  if (impactAcc > 40) {
    shake = Math.max(shake, Math.min(10, impactAcc / 50));
    for (let k = 0; k < Math.min(14, impactAcc / 20); k++) {
      const a = Math.random() * TAU, s = 30 + Math.random() * 80;
      emit(car.x + fx * 20, car.y + fy * 20, Math.cos(a) * s, Math.sin(a) * s, 'rgba(240,235,220,', 3 + Math.random() * 3, .4);
    }
  }
  impactAcc = 0;
  if (car.air > 0 && Math.random() < 0.8) {                         // Booster-Abgas im Sprung
    emit(car.x - fx * 26, car.y - fy * 26, -car.vx * 0.3 + (Math.random() - .5) * 40, -car.vy * 0.3 + (Math.random() - .5) * 40,
         'rgba(255,160,50,', 3 + Math.random() * 3, .35);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.life -= dt;
    if (q.life <= 0) { particles.splice(i, 1); continue; }

// ---------- Güterzüge ----------
// Bis zu zwei Züge fahren auf Strecken in der Nähe des Autos. Position: Segmentindex k entlang
// der Strecke plus Abstand d darin; Lok und Wagen folgen dahinter auf der Gleiskurve.
const trains = [];

const chainSeg = (t, k) => t.dir ? railSeg(t.line, k, 1) : railSeg(k, t.line, 0);
function railPoint(t, off) {
  let k = t.k, d = t.d + off, s = chainSeg(t, k);

  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (s.cum[m] <= d) lo = m; else hi = m; }
  const f = (d - s.cum[lo]) / ((s.cum[hi] - s.cum[lo]) || 1);

function spawnTrain() {
  const views = railsNear(car.x - 2000, car.y - 2000, car.x + 2000, car.y + 2000);
  if (!views.length) return;

  const line = s.dir ? s.i : s.j;

}
function nearLevels() {

// Tempoanteil je Fahrzeugart: der Verkehr fährt gemächlich (rund halbes Tempo), Polizei,
// Feuerwehr und Motorräder flotter, Lkw, Tankwagen und Busse langsamer
const CAT_PACE = { police: 0.78, fire: 0.75, moto: 0.72, lkw: 0.36, tanker: 0.34, bus: 0.4 };
// erlaubtes Tempo je Straßenart (km/h)
function roadKmh(s) {

const traffic = [];

// Sicht); Landstraßen doppelt gewichtet. Beim Start der Welt darf es auch näher sein.
let spawnPool = [], spawnPoolT = 0;
function spawnVehicle(minD) {
  if (clock > spawnPoolT) {
    spawnPoolT = clock + 1;
    spawnPool = [];
    const r = Math.ceil(TRAFFIC_R / CS), ccx = Math.floor(car.x / CS), ccy = Math.floor(car.y / CS);
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      const c = chunks.get(ckey(ccx + dx, ccy + dy));
      if (!c || !c.done) continue;
      const x0 = (ccx + dx) * CS, y0 = (ccy + dy) * CS;
      for (const w of c.segs) {
        const sg = w.seg;
        if (!drivable(sg)) continue;
        for (let k = w.i0 + 1; k < w.i1 - 1; k += 4) {
          if (sg.xs[k] < x0 || sg.xs[k] >= x0 + CS || sg.ys[k] < y0 || sg.ys[k] >= y0 + CS) continue;
          spawnPool.push([sg, k]);
          if (sg.type === 'road') spawnPool.push([sg, k]);

  for (let tries = 0; tries < 8 && spawnPool.length; tries++) {
    const [s, k] = spawnPool[Math.floor(Math.random() * spawnPool.length)];
    const d = Math.hypot(s.xs[k] - car.x, s.ys[k] - car.y);
    if (d < minD || d > TRAFFIC_R - 150 || k < 1 || k > s.n - 2) continue;
    const dir = Math.random() < 0.5 ? 1 : -1;
    const m = pickModel(s);
    const v = { id: ++vehIds, m, s, k, t: 0, dir, off: 0, lane: 0, v: 0, hit: 0, next: null,
                x: 0, y: 0, a: 0, ox: 0, oy: 0, trail: [], blue: (m.cat === 'police' || m.cat === 'fire') && Math.random() < 0.5,
                f: (CAT_PACE[m.cat] || 0.5) * (0.8 + Math.random() * 0.4) };
    v.off = v.lane = laneFor(v, s);
    const P = vehPose(v);
    if (traffic.some(o => Math.hypot(o.x - P.x, o.y - P.y) < 120)) continue;
    v.x = P.x; v.y = P.y; v.a = Math.atan2(P.ty, P.tx);
    v.v = Math.min(roadKmh(s), m.kmh) / KMH * v.f * 0.8;
    if (m.art) for (let q = m.art + 60; q >= 0; q -= 6) v.trail.push([P.x - P.tx * q, P.y - P.ty * q]);

  const R = roadQuery(x + ox * 6, y + oy * 6, views.filter(w => w.seg !== s && drivable(w.seg)));
  if (!R.seg || R.edge > 4) return null;

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#1b1d22';
  ctx.fillRect(0, 0, cv.width, cv.height);
  const z = cam.z * DPR;
  const sx = (Math.random() - .5) * shake, sy = (Math.random() - .5) * shake;
  ctx.setTransform(z, 0, 0, z, cv.width / 2 - (cam.x + sx) * z, cv.height / 2 - (cam.y + sy) * z);
  ctx.imageSmoothingEnabled = false;

  const [x0, y0, x1, y1] = viewBounds(4);
  for (let cy = Math.floor(y0 / CS); cy <= Math.floor(y1 / CS); cy++) {
    for (let cx = Math.floor(x0 / CS); cx <= Math.floor(x1 / CS); cx++) {
      const c = chunks.get(ckey(cx, cy));
      if (c && c.done) ctx.drawImage(c.canvas, cx * CS, cy * CS, CS + 1, CS + 1);
      else { ctx.fillStyle = c ? c.fallback : '#555'; ctx.fillRect(cx * CS, cy * CS, CS + 1, CS + 1); }
    }
  }

  const lows = [], highs = [], dyns = [];
  const [bx0, by0, bx1, by1] = viewBounds(110);
  for (let cy = Math.floor(by0 / CS); cy <= Math.floor(by1 / CS); cy++) {
    for (let cx = Math.floor(bx0 / CS); cx <= Math.floor(bx1 / CS); cx++) {
      const c = chunks.get(ckey(cx, cy));
      if (!c || !c.done) continue;
      for (const o of c.statics) if (o.x > x0 - 100 && o.x < x1 + 100 && o.y > y0 - 100 && o.y < y1 + 100) (HIGH[o.t] ? highs : lows).push(o);
      for (const o of c.dyn) if (o.x > x0 - 30 && o.x < x1 + 30 && o.y > y0 - 30 && o.y < y1 + 30) dyns.push(o);
    }
  }
  const canopies = [];
  for (let cy = Math.floor(by0 / CS); cy <= Math.floor(by1 / CS); cy++)
    for (let cx = Math.floor(bx0 / CS); cx <= Math.floor(bx1 / CS); cx++) {
      const c = chunks.get(ckey(cx, cy));
      if (c && c.done && c.canopy) canopies.push(c.canopy);
    }
  ctx.fillStyle = 'rgba(0,0,0,0.24)';                               // Schatten der Waldränder
  for (const cp of canopies) ctx.fill(cp.shadow);
  for (const o of lows) drawShadow(o);
  for (const o of dyns) drawShadow(o);
  for (const o of highs) drawShadow(o);
  for (const o of lows) drawStatic(o);
  for (const o of dyns) drawDyn(o);
  const levels = new Set();
  for (let cy = Math.floor(by0 / CS); cy <= Math.floor(by1 / CS); cy++) {
    for (let cx = Math.floor(bx0 / CS); cx <= Math.floor(bx1 / CS); cx++) {
      const c = chunks.get(ckey(cx, cy));
      if (c && c.done) for (const L of c.levels) levels.add(L);
    }
  }
  drawTrains();
  for (const r of rods) if (r.landed) drawRod(r);
  drawAssist();
  drawTraffic(x0, y0, x1, y1);
  drawCar();
  for (const L of levels) drawLevel(L);
  for (const r of rods) if (!r.landed) drawRod(r);
  for (const f of flyers) {                                         // Beifahrer samt Sitz im Flug
    const k = f.t / EJECT_TIME, lift = Math.sin(Math.PI * k), sc = 1 + 1.6 * lift;
    ctx.fillStyle = `rgba(0,0,0,${(0.3 - 0.15 * lift).toFixed(3)})`;
    circle(f.x + 4 + 40 * lift, f.y + 5 + 50 * lift, 6);
    ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.a); ctx.scale(sc, sc);
    ctx.fillStyle = '#5a1f1a'; rrect(-6, -5, 10, 10, 2);           // Sitz
    ctx.fillStyle = '#2b2f36'; ctx.beginPath(); ctx.ellipse(0, 0, 2.8, 4.6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e2b897'; circle(1.5, -4.4, 1.3); circle(1.5, 4.4, 1.3);
    ctx.fillStyle = f.hair; circle(0.6, 0, 2.6);
    ctx.restore();
  }
  for (const q of particles) {
    if (q.fire) {                                                   // flackernde Flammen
      const a = Math.min(1, q.life / q.max * 1.6) * (0.7 + 0.3 * Math.random());
      ctx.fillStyle = `rgba(255,${90 + Math.random() * 60 | 0},20,${(0.8 * a).toFixed(3)})`; circle(q.x, q.y, q.size);
      ctx.fillStyle = `rgba(255,225,110,${(0.9 * a).toFixed(3)})`; circle(q.x, q.y, q.size * 0.45);
      continue;
    }
    ctx.fillStyle = q.color + (0.55 * q.life / q.max).toFixed(3) + ')';
    circle(q.x, q.y, q.size);
  }
  ctx.lineCap = 'round';
  for (const b of bullets) {                                        // Leuchtspur
    const sp = Math.hypot(b.vx, b.vy), ux = b.vx / sp, uy = b.vy / sp;
    ctx.strokeStyle = 'rgba(255,200,80,0.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(b.x - ux * 12, b.y - uy * 12); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.lineCap = 'butt';
  for (const cp of canopies) for (const g of cp.groups.values()) {  // Waldrand-Kronen und Waldmantel
    ctx.fillStyle = g.cols[0]; ctx.fill(g.base);
    ctx.fillStyle = g.cols[1]; ctx.fill(g.mid);
    ctx.fillStyle = g.cols[2]; ctx.fill(g.hi);
    ctx.fillStyle = 'rgba(232,238,244,0.92)'; ctx.fill(g.snow);
  }
  for (const o of highs) drawStatic(o);

  const lamps = [];
  for (const s of settlementsNear(bx0, by0, bx1, by1))
    for (const l of settlementLamps(s)) if (l.x > bx0 && l.x < bx1 && l.y > by0 && l.y < by1) lamps.push(l);
  ctx.fillStyle = '#4a4d52';
  for (const l of lamps) circle(l.x, l.y, 2.6);                        // Laternenmasten
  if (nightLevel > 0.01) drawNight(lamps);
}

// ---------- Nacht ----------
// Über die fertige Szene kommt eine dunkle Lichtkarte, aus der Scheinwerfer und Laternen
// herausgeschnitten werden; danach warmes Licht additiv obendrauf.
let night = false, nightLevel = 0;
const lightCv = document.createElement('canvas'), lctx = lightCv.getContext('2d');
const LAMP_R = 90;
function radial(g, x, y, r, stops) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  for (const [o, c] of stops) gr.addColorStop(o, c);
  g.fillStyle = gr;
}
// Zwei Lichtkegel nach vorn (bzw. ein kurzer nach hinten beim Rückwärtsfahren). Jeder Kegel
// besteht aus übereinanderliegenden Schichten, nach außen breiter und kürzer, damit das Licht
// am Rand und am Ende weich ausläuft. additive: Schichten summieren sich (Lichtfarbe);
// sonst decken sie wie beim Ausschneiden aus der Dunkelheit (1 - (1-a)^n).
const BEAM_LAYERS = 16;
function beam(g, col, ox, oy, a, L, spread, peak, per) {
  for (let i = 1; i <= BEAM_LAYERS; i++) {
    const f = i / BEAM_LAYERS, sp = spread * (0.25 + 0.75 * f), len = L * (1 - 0.3 * f);
    radial(g, ox, oy, len, [[0, col(peak * per)], [0.45, col(peak * 0.7 * per)], [1, col(0)]]);
    g.beginPath(); g.moveTo(ox, oy); g.arc(ox, oy, len, a - sp, a + sp); g.closePath(); g.fill();
  }
}
function locoLights(g, col, additive) {
  const per = additive ? 1 / BEAM_LAYERS : 1 - Math.pow(0.05, 1 / BEAM_LAYERS);
  for (const t of trains) {
    const L = t.laid[0];
    if (!L) continue;
    const fx = Math.cos(L.a), fy = Math.sin(L.a);
    beam(g, col, L.x + fx * 21, L.y + fy * 21, L.a, 380, 0.32, 1, per);
  }
}
function carLights(g, col, additive) {
  const per = additive ? 1 / BEAM_LAYERS : 1 - Math.pow(0.05, 1 / BEAM_LAYERS);
  const fx = Math.cos(car.a), fy = Math.sin(car.a), rx = -fy, ry = fx;
  for (const sd of [-1, 1])
    beam(g, col, car.x + fx * 22 + rx * 8 * sd, car.y + fy * 22 + ry * 8 * sd, car.a + sd * 0.04, 340, 0.5, 1, per);
  if (car.reversing) beam(g, col, car.x - fx * 24, car.y - fy * 24, car.a + Math.PI, 120, 0.7, 0.75, per);
}
// Zusätzliche Lichtquellen des Fahrzeugs und der Flammenspur (Weltkoordinaten)
function specialLights() {
  const out = [], id = CAR_TYPES[car.type].id, fx = Math.cos(car.a), fy = Math.sin(car.a);
  const rgba = (r, g, b) => a => `rgba(${r},${g},${b},${a.toFixed(3)})`;
  if (id === 'police' && car.mode) {
    const s = Math.floor(clock * 7) % 2 ? -1 : 1;
    out.push({ x: car.x - fx * 2 - fy * 5 * s, y: car.y - fy * 2 + fx * 5 * s, r: 90, cut: 0.55, glow: 0.45, col: rgba(70, 140, 255) });
  }
  if (id === 'bond' && bond.flash > 0 && bond.open > 0.9)
    out.push({ x: car.x + fx * 30, y: car.y + fy * 30, r: 100, cut: 0.55, glow: 0.35, col: rgba(255, 190, 90) });
  if (id === 'interceptor' && car.mode && car.throttle > 0) {
    const rx = -fy, ry = fx;
    for (const sd of [-1, 1]) out.push({ x: car.x - fx * 12 + rx * 13.5 * sd, y: car.y - fy * 12 + ry * 13.5 * sd, r: 45, cut: 0.4, glow: 0.3, col: rgba(255, 140, 40) });
  }
  if (id === 'van' && turret.flash > 0) {
    const a = car.a + turret.ang, bx = car.x + fx * TURRET_X + Math.cos(a) * 19, by = car.y + fy * TURRET_X + Math.sin(a) * 19;
    out.push({ x: bx, y: by, r: 110, cut: 0.6, glow: 0.35, col: rgba(255, 190, 90) });
  }
  for (const r of rods.slice(-20)) out.push({ x: r.x, y: r.y, r: 55, cut: 0.45 * Math.min(1, r.life / 3), glow: 0.3 * Math.min(1, r.life / 3), col: rgba(110, 255, 70) });
  if (Math.floor(clock * 3) % 2 === 0) for (const L of nearLevels()) if (L.active)
    for (const P of levelPosts(L)) out.push({ x: P.x, y: P.y, r: 40, cut: 0.4, glow: 0.4, col: rgba(255, 40, 30) });
  for (const z of zombies.slice(0, 15)) out.push({ x: z.x, y: z.y, r: 24, cut: 0.3, glow: 0.25, col: rgba(110, 255, 70) });
  if (id === 'kitt') {
    const sy = Math.sin(clock * 5) * 7.5;
    out.push({ x: car.x + fx * 21 - fy * sy, y: car.y + fy * 21 + fx * sy, r: 22, cut: 0.3, glow: 0.5, col: rgba(255, 30, 20) });
  }
  // höchstens 20 Flammen werfen Licht, gleichmäßig über die Spur verteilt – spart Verläufe
  const fires = particles.filter(q => q.fire && q.life > 0.3), step = Math.max(1, Math.ceil(fires.length / 20));
  for (let i = 0; i < fires.length; i += step)
    out.push({ x: fires[i].x, y: fires[i].y, r: 26 + 6 * step ** 0.5, cut: 0.4, glow: 0.22, col: rgba(255, 130, 30) });
  return out;
}
function drawNight(lamps) {
  if (lightCv.width !== cv.width || lightCv.height !== cv.height) { lightCv.width = cv.width; lightCv.height = cv.height; }
  const g = lctx, T = ctx.getTransform();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-over';
  g.clearRect(0, 0, lightCv.width, lightCv.height);
  g.fillStyle = `rgba(6,10,26,${(0.9 * nightLevel).toFixed(3)})`;
  g.fillRect(0, 0, lightCv.width, lightCv.height);
  g.setTransform(T);
  g.globalCompositeOperation = 'destination-out';
  for (const l of lamps) {
    radial(g, l.x, l.y, LAMP_R, [[0, 'rgba(0,0,0,0.95)'], [0.5, 'rgba(0,0,0,0.6)'], [1, 'rgba(0,0,0,0)']]);
    g.beginPath(); g.arc(l.x, l.y, LAMP_R, 0, TAU); g.fill();
  }
  carLights(g, a => `rgba(0,0,0,${a.toFixed(4)})`, false);
  trafficLights(g, true, 0);
  locoLights(g, a => `rgba(0,0,0,${a.toFixed(4)})`, false);
  for (const L of specialLights()) {                                // Blaulicht, Taxischild, Scanner, Flammen
    radial(g, L.x, L.y, L.r, [[0, `rgba(0,0,0,${L.cut})`], [1, 'rgba(0,0,0,0)']]);
    g.beginPath(); g.arc(L.x, L.y, L.r, 0, TAU); g.fill();
  }
  radial(g, car.x, car.y, 45, [[0, 'rgba(0,0,0,0.5)'], [1, 'rgba(0,0,0,0)']]);  // Schein ums Auto
  g.beginPath(); g.arc(car.x, car.y, 45, 0, TAU); g.fill();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(lightCv, 0, 0);
  ctx.setTransform(T);
  ctx.globalCompositeOperation = 'lighter';
  const k = nightLevel;
  for (const l of lamps) {
    radial(ctx, l.x, l.y, LAMP_R * 0.8, [[0, `rgba(255,196,120,${0.22 * k})`], [1, 'rgba(255,196,120,0)']]);
    ctx.beginPath(); ctx.arc(l.x, l.y, LAMP_R * 0.8, 0, TAU); ctx.fill();
    ctx.fillStyle = `rgba(255,236,190,${0.9 * k})`; circle(l.x, l.y, 2.2);
  }
  carLights(ctx, a => `rgba(255,244,214,${(a * 0.16 * k).toFixed(4)})`, true);
  trafficLights(ctx, false, k);
  locoLights(ctx, a => `rgba(255,244,214,${(a * 0.16 * k).toFixed(4)})`, true);
  for (const L of specialLights()) {
    radial(ctx, L.x, L.y, L.r, [[0, L.col(L.glow * k)], [1, L.col(0)]]);
    ctx.beginPath(); ctx.arc(L.x, L.y, L.r, 0, TAU); ctx.fill();
  }
  ctx.lineCap = 'round';                                           // Leuchtspur leuchtet selbst
  for (const b of bullets) {
    const sp = Math.hypot(b.vx, b.vy), ux = b.vx / sp, uy = b.vy / sp;
    ctx.strokeStyle = `rgba(255,190,70,${(0.9 * k).toFixed(3)})`; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(b.x - ux * 14, b.y - uy * 14); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.lineCap = 'butt';
  const fx = Math.cos(car.a), fy = Math.sin(car.a);
  const tail = car.braking ? 0.75 : 0.35;                                  // Rücklichter
  for (const sd of [-1, 1]) {
    const x = car.x - fx * 23 - fy * 7.5 * sd, y = car.y - fy * 23 + fx * 7.5 * sd;
    radial(ctx, x, y, 14, [[0, `rgba(255,40,30,${tail * k})`], [1, 'rgba(255,40,30,0)']]);
    ctx.beginPath(); ctx.arc(x, y, 14, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

// ---------- Minikarte ----------
const mapCv = document.getElementById('map');
const mctx = mapCv.getContext('2d');
const MAP_N = 90, MAP_R = 1500, MAP_CELL = MAP_R * 2 / MAP_N;
const mapBuf = new ImageData(MAP_N, MAP_N);
const mapShown = document.createElement('canvas');
mapShown.width = mapShown.height = MAP_N;
let mapRow = 0, mapCX = 0, mapCY = 0, shownCX = 0, shownCY = 0, mapReady = false;

let mapRoads = [];
let mapPlaces = [], mapRivers = [], mapRails = [];
const MAP_ROAD_STYLE = { street: [1.2, '#e3e1da'], track: [1, '#7d6444'], lane: [1.5, '#d6d6cf'], road: [2, '#f4f4ef'] };

function mapWork(rows) {
  if (mapRow === 0) {
    mapCX = car.x; mapCY = car.y;
    mapRoads = segsNear(car.x - MAP_R - 300, car.y - MAP_R - 300, car.x + MAP_R + 300, car.y + MAP_R + 300);
    mapPlaces = settlementsNear(car.x - MAP_R, car.y - MAP_R, car.x + MAP_R, car.y + MAP_R).filter(s => s.kind !== 'village');
    mapRivers = riversNear(car.x - MAP_R - 300, car.y - MAP_R - 300, car.x + MAP_R + 300, car.y + MAP_R + 300);
    mapRails = railsNear(car.x - MAP_R - 300, car.y - MAP_R - 300, car.x + MAP_R + 300, car.y + MAP_R + 300);
  }
  const d = mapBuf.data;
  for (let n = 0; n < rows && mapRow < MAP_N; n++, mapRow++) {
    const wy = mapCY - MAP_R + (mapRow + .5) * MAP_CELL;
    for (let i = 0; i < MAP_N; i++) {
      const p = SURF[surfaceAt(mapCX - MAP_R + (i + .5) * MAP_CELL, wy, NO_ROADS, undefined, NO_RIVERS, NO_RAILS)].rgb;
      const o = (mapRow * MAP_N + i) * 4;
      d[o] = p[0]; d[o + 1] = p[1]; d[o + 2] = p[2]; d[o + 3] = 255;
    }
  }
  if (mapRow >= MAP_N) {
    mapShown.getContext('2d').putImageData(mapBuf, 0, 0);
    shownCX = mapCX; shownCY = mapCY; mapRow = 0; mapReady = true;
  }
}

function drawMap() {
  const S = mapCv.width;
  mctx.fillStyle = '#2a2d33'; mctx.fillRect(0, 0, S, S);
  if (mapReady) {
    const k = S / (MAP_R * 2);
    mctx.imageSmoothingEnabled = false;
    mctx.drawImage(mapShown, (shownCX - car.x) * k, (shownCY - car.y) * k, S, S);
  }
  const k = S / (MAP_R * 2);
  mctx.lineJoin = 'round'; mctx.lineCap = 'round';
  for (const v of mapRoads) {
    const s = v.seg, st = MAP_ROAD_STYLE[s.type];
    mctx.lineWidth = st[0]; mctx.strokeStyle = st[1];
    mctx.beginPath();
    for (let q = v.i0; q <= v.i1; q += 3) {
      const x = (s.xs[q] - car.x) * k + S / 2, y = (s.ys[q] - car.y) * k + S / 2;
      q === v.i0 ? mctx.moveTo(x, y) : mctx.lineTo(x, y);
    }
    mctx.lineTo((s.xs[v.i1] - car.x) * k + S / 2, (s.ys[v.i1] - car.y) * k + S / 2);
    mctx.stroke();
  }
  mctx.textAlign = 'center'; mctx.textBaseline = 'middle';
  mctx.strokeStyle = '#3f86c8';                                      // Flüsse
  for (const v of mapRivers) {
    const r = v.r;
    for (let q = v.i0; q < v.i1; q += 2) {
      const q2 = Math.min(v.i1, q + 2);
      mctx.lineWidth = Math.max(1, r.hw[q] * 2 * k);
      mctx.beginPath();
      mctx.moveTo((r.xs[q] - car.x) * k + S / 2, (r.ys[q] - car.y) * k + S / 2);
      mctx.lineTo((r.xs[q2] - car.x) * k + S / 2, (r.ys[q2] - car.y) * k + S / 2);
      mctx.stroke();
    }
  }
  mctx.strokeStyle = '#3b3029'; mctx.lineWidth = 1.6; mctx.setLineDash([4, 3]);   // Gleise
  for (const v of mapRails) {
    const s = v.seg;
    mctx.beginPath();
    for (let q = v.i0; q <= v.i1; q += 3) {
      const x = (s.xs[q] - car.x) * k + S / 2, y = (s.ys[q] - car.y) * k + S / 2;
      q === v.i0 ? mctx.moveTo(x, y) : mctx.lineTo(x, y);
    }
    mctx.stroke();
  }
  mctx.setLineDash([]);
  for (const t of trains) for (const w of t.laid) {                 // Züge
    mctx.fillStyle = w.type === 'loco' ? '#ff5a3c' : '#e9e2d0';
    mctx.fillRect((w.x - car.x) * k + S / 2 - 1.5, (w.y - car.y) * k + S / 2 - 1.5, 3, 3);
  }
  for (const s of mapPlaces) {
    const x = (s.x - car.x) * k + S / 2, y = (s.y - car.y) * k + S / 2;
    mctx.font = s.kind === 'city' ? '700 11px system-ui, sans-serif' : '600 9px system-ui, sans-serif';
    mctx.lineWidth = 3; mctx.strokeStyle = 'rgba(20,22,28,0.85)'; mctx.strokeText(s.name, x, y);
    mctx.fillStyle = '#fff'; mctx.fillText(s.name, x, y);
  }
  mctx.save(); mctx.translate(S / 2, S / 2); mctx.rotate(car.a);
  mctx.fillStyle = CAR_TYPES[car.type].color; mctx.strokeStyle = '#000'; mctx.lineWidth = 1.5;
  mctx.beginPath(); mctx.moveTo(8, 0); mctx.lineTo(-6, -5.5); mctx.lineTo(-3, 0); mctx.lineTo(-6, 5.5); mctx.closePath();
  mctx.stroke(); mctx.fill();
  mctx.restore();
}

// ---------- HUD ----------
const elSpd = document.getElementById('spd'), elGear = document.getElementById('gear');
const elSurf = document.getElementById('surfName'), elSw = document.getElementById('swatch');
const elPlace = document.getElementById('place'), elType = document.getElementById('cartype');
const elAssist = document.getElementById('assist');
let hudName = '';
function updateHud() {
  elSpd.textContent = Math.round(Math.abs(car.vf) * KMH);
  elGear.textContent = car.vf < -5 ? 'R' : car.vf > 5 ? 'D' : 'N';
  if (frameNo % 8) return;
  const s = surfAtFast(car.x, car.y);
  const R = roadQuery(car.x, car.y, segsNear(car.x, car.y, car.x, car.y));
  let name = SURF[s].name, col = SURF[s].rgb;
  let road = R.seg && R.edge < 0 ? R.seg : null, extra = s === S_BRIDGE ? ' · Brücke' : '';
  if (road) {
    name = (road.mtn && road.net === 1 ? 'Gebirgsstraße' : RT[road.type].name) + extra;
    col = road.type === 'track' ? SURF[S_GRAVEL].rgb : [86, 88, 94];
  }
  const P = setlQuery(car.x, car.y, settlementsNear(car.x, car.y, car.x, car.y));
  const place = P.s && P.f < 1 ? SETL_KIND[P.s.kind] + ' ' + P.s.name : '';
  if (elPlace.textContent !== place) elPlace.textContent = place;
  const T = CAR_TYPES[car.type];
  const status = T.id === 'kitt' ? (car.air > 0 ? 'Booster!' : car.boostCd > 0 ? 'Booster lädt' : 'Booster bereit (M)')
               : (T.mode ? T.mode[car.mode ? 1 : 0] + ' (M)' : '') +
                 (T.id === 'bond' ? ' · Schleudersitz ' + (bond.ejectCd > 0 ? 'lädt' : 'bereit (E)') : '');
  const typeText = T.name + (status ? ' · ' + status : '');
  if (elType.textContent !== typeText) elType.textContent = typeText;
  const at = assistOn ? 'Spurhalteassistent ' + (car.assistActive ? 'lenkt' : 'bereit') + ' (L)' : '';
  if (elAssist.textContent !== at) elAssist.textContent = at;
  if (name !== hudName) {
    hudName = name;
    elSurf.textContent = name;
    elSw.style.background = `rgb(${col[0]},${col[1]},${col[2]})`;
  }
}

// ---------- Welt ----------
// Start auf dem rechten Fahrstreifen der nächstgelegenen Landstraße
function findSpawn() {
  for (let r = 1500; r < 60000; r *= 1.6) {
    let best = null, bd = Infinity;
    for (const v of segsNear(-r, -r, r, r)) {
      const s = v.seg;
      if (s.type !== 'road') continue;
      for (let k = Math.max(v.i0, 4); k <= Math.min(v.i1, s.n - 5); k++) {
        if (s.water[k]) continue;
        const d = s.xs[k] * s.xs[k] + s.ys[k] * s.ys[k];
        if (d < bd) { bd = d; best = [s, k]; }
      }
    }
    if (best) {
      const [s, k] = best;
      return { x: s.xs[k] + s.nx[k] * LANE / 2, y: s.ys[k] + s.ny[k] * LANE / 2, a: Math.atan2(-s.nx[k], s.ny[k]) };
    }
  }
  return { x: 0, y: 0, a: 0 };
}

function newWorld(seed) {
  SEED = seed;
  history.replaceState(null, '', '#' + seed);
  document.getElementById('seed').textContent = seed;
  chunks.clear();
  segCache.clear();
  setlCache.clear();
  rivCache.clear();
  wetCache.clear();
  rods.length = 0;
  railCache.clear(); levelCache.clear(); trains.length = 0; traffic.length = 0; worldClock = clock; spawnPoolT = 0;
  particles.length = 0;
  spawn = findSpawn();
  Object.assign(car, { x: spawn.x, y: spawn.y, a: spawn.a, vx: 0, vy: 0, w: 0, steer: 0, vf: 0, vl: 0 });
  car.prevW = [null, null, null, null];
  cam.x = car.x; cam.y = car.y; cam.z = baseZoom();
  mapRow = 0; mapReady = false;
  ensureChunks();
  workChunks(Infinity);
  mapWork(MAP_N);
}

// ---------- Hauptschleife ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  frameNo++;

  gatherNearby();
  computeAssist();
  const steps = Math.max(1, Math.ceil(dt * 120));
  for (let i = 0; i < steps; i++) physics(dt / steps);
  updateDyn(dt);
  effects(dt);
  updateCamera(dt);
  clock += dt;
  car.boostCd = Math.max(0, car.boostCd - dt);
  updateTurret(dt);
  updateBond(dt);
  updateRods(dt);
  rodInfections();
  updateTrains(dt);
  updateTraffic(dt);
  nightLevel += ((night ? 1 : 0) - nightLevel) * Math.min(1, dt * 2.5);

  ensureChunks();
  workChunks(6);
  mapWork(6);

  render();
  drawMap();
  updateHud();
  requestAnimationFrame(frame);
}

const hashSeed = parseInt(location.hash.slice(1), 10);
newWorld(hashSeed > 0 ? hashSeed : Math.floor(Math.random() * 999999) + 1);
requestAnimationFrame(frame);
</script>
