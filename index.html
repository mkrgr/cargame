<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kleiner Flitzer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d22; color: #f1f1ee;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas#game { display: block; width: 100vw; height: 100vh; }
  .panel { position: fixed; background: rgba(20, 22, 28, 0.72); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); user-select: none; }
  #dash { left: 16px; top: 16px; padding: 12px 16px; min-width: 150px; }
  #spd { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  #dash small { opacity: .6; margin-left: 4px; font-size: 13px; }
  #gear { float: right; margin-left: 14px; font-size: 18px; font-weight: 700; padding: 2px 8px; border-radius: 6px;
    background: rgba(255,255,255,0.1); }
  #surf { margin-top: 10px; font-size: 14px; display: flex; align-items: center; gap: 8px; opacity: .9; }
  #swatch { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3); display: inline-block; }
  #mapWrap { right: 16px; top: 16px; padding: 8px; }
  #map { display: block; width: 180px; height: 180px; border-radius: 9px; }
  #seedRow { font-size: 12px; opacity: .65; text-align: center; margin-top: 6px; }
  #help { left: 16px; bottom: 16px; padding: 10px 14px; font-size: 13px; line-height: 1.6; }
  #help b { display: inline-block; min-width: 74px; color: #ffd36b; font-weight: 600; }
  #help.hidden { display: none; }
  #intro { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;
    transition: opacity .8s; }
  #intro div { text-align: center; background: rgba(20,22,28,0.78); padding: 22px 34px; border-radius: 18px; }
  #intro h1 { margin: 0 0 6px; font-size: 34px; letter-spacing: .5px; }
  #intro p { margin: 0; opacity: .75; }
  @media (max-width: 640px) { #mapWrap { transform: scale(.7); transform-origin: top right; } #help { display: none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="dash" class="panel">
  <span id="gear">N</span><span id="spd">0</span><small>km/h</small>
  <div id="surf"><i id="swatch"></i><span id="surfName">–</span></div>
</div>

<div id="mapWrap" class="panel">
  <canvas id="map" width="180" height="180"></canvas>
  <div id="seedRow">Welt #<span id="seed"></span></div>
</div>

<div id="help" class="panel">
  <div><b>↑ / W</b>Gas</div>
  <div><b>↓ / S</b>Bremsen / Rückwärts</div>
  <div><b>← → / A D</b>Lenken</div>
  <div><b>Leertaste</b>Handbremse</div>
  <div><b>R</b>Neue Welt &nbsp; <b style="min-width:0">C</b> Farbe &nbsp; <b style="min-width:0">H</b> Hilfe</div>
</div>

<div id="intro"><div><h1>Kleiner Flitzer</h1><p>Drück eine Taste und fahr los</p></div></div>

<script>
'use strict';

// ---------- Setup ----------
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
}
addEventListener('resize', resize);
resize();

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---------- Noise ----------
let SEED = 1;
function hash(ix, iy, s) {
  let h = Math.imul(ix, 374761393) ^ Math.imul(iy, 668265263) ^ Math.imul(s, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash(ix, iy, s), b = hash(ix + 1, iy, s), c = hash(ix, iy + 1, s), d = hash(ix + 1, iy + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s, oct) {
  let sum = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) {
    sum += amp * vnoise(x * f, y * f, s + i * 101);
    norm += amp; amp *= 0.5; f *= 2;
  }
  return sum / norm;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---------- Untergründe ----------
const S_DEEP = 0, S_SHALLOW = 1, S_ASPHALT = 2, S_GRAVEL = 3, S_GRASS = 4, S_SAND = 5,
      S_MUD = 6, S_SNOW = 7, S_ICE = 8, S_BRIDGE = 9, S_DENSE = 10, S_ROCK = 11, S_CLIFF = 12, S_HEATH = 13;
// grip: Seitenhaftung, accel/top: Anteil an Motorleistung/Höchstgeschwindigkeit, drag: Rollwiderstand, brake: Bremswirkung
const SURF = [
  { name: 'Tiefes Wasser',  rgb: [34, 86, 140],   grip: 3,   accel: .4,  top: .4,  drag: 1.6, brake: .6, solid: true },
  { name: 'Flaches Wasser', rgb: [74, 148, 196],  grip: 3,   accel: .45, top: .42, drag: 1.6, brake: .6, dust: 'rgba(225,242,255,', splash: true },
  { name: 'Asphalt',        rgb: [74, 76, 82],    grip: 8.5, accel: 1,   top: 1,   drag: .12, brake: 1,  skid: 'rgba(22,22,26,0.33)', smoke: true },
  { name: 'Schotter',       rgb: [156, 142, 120], grip: 4.2, accel: .8,  top: .82, drag: .4,  brake: .75, track: 'rgba(95,82,64,0.20)', dust: 'rgba(180,165,140,' },
  { name: 'Wiese',          rgb: [88, 148, 66],   grip: 5,   accel: .75, top: .72, drag: .55, brake: .7, track: 'rgba(48,88,34,0.16)', dust: 'rgba(80,130,55,', dustSlipOnly: true },
  { name: 'Sand',           rgb: [224, 200, 146], grip: 3.3, accel: .55, top: .6,  drag: 1,   brake: .85, track: 'rgba(160,128,78,0.28)', dust: 'rgba(232,210,160,' },
  { name: 'Matsch',         rgb: [104, 78, 52],   grip: 2.2, accel: .45, top: .5,  drag: 1.3, brake: .5, track: 'rgba(52,36,20,0.38)', dust: 'rgba(84,60,38,' },
  { name: 'Schnee',         rgb: [234, 239, 245], grip: 2.8, accel: .6,  top: .66, drag: .7,  brake: .45, track: 'rgba(150,162,185,0.32)', dust: 'rgba(255,255,255,' },
  { name: 'Eis',            rgb: [176, 214, 234], grip: .5,  accel: .3,  top: .95, drag: .05, brake: .15, skid: 'rgba(255,255,255,0.22)' },
  { name: 'Brücke',         rgb: [138, 100, 64],  grip: 7,   accel: .95, top: .9,  drag: .2,  brake: .9, skid: 'rgba(40,28,18,0.3)' },
  { name: 'Dichter Wald',   rgb: [36, 80, 40],    grip: 5,   accel: .75, top: .72, drag: .55, brake: .7, solid: true },
  { name: 'Fels',           rgb: [158, 146, 124], grip: 4.6, accel: .7,  top: .68, drag: .5,  brake: .8, dust: 'rgba(170,165,155,', dustSlipOnly: true },
  { name: 'Felswand',       rgb: [88, 88, 94],   grip: 4.6, accel: .7,  top: .68, drag: .5,  brake: .8, solid: true },
  { name: 'Heide',          rgb: [148, 138, 86],  grip: 4.6, accel: .72, top: .7,  drag: .6,  brake: .7, track: 'rgba(90,80,45,0.18)', dust: 'rgba(150,135,90,', dustSlipOnly: true },
];

let lastE = 0, lastM = 0, lastH = 0, lastCold = false;

const WL = 0.395, WD = 0.37;   // Wasserspiegel, Grenze zum tiefen Wasser
const DENSE_F = 0.68;          // ab hier ist der Wald undurchdringlich

// großräumige Seen plus kleinere Teiche
function elev(x, y) { return 0.62 * fbm(x / 1800, y / 1800, SEED, 3) + 0.38 * fbm(x / 450, y / 450, SEED + 3, 3); }
function forestAt(x, y) { return fbm(x / 700, y / 700, SEED + 61, 2); }
// Jede Oktave gedreht, sonst folgen die Grate dem achsparallelen Rauschgitter
const ROT = [0, 0.9, 2.1, 3.3].map(a => [Math.cos(a), Math.sin(a)]);
function ridged(x, y, s, oct) {
  let sum = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) {
    const [c, sn] = ROT[i];
    const v = 1 - Math.abs(2 * vnoise((x * c - y * sn) * f, (x * sn + y * c) * f, s + i * 101) - 1);
    sum += amp * v * v; norm += amp; amp *= 0.5; f *= 2;
  }
  return sum / norm;
}
// Einzelne Baumkronen für den dichten Wald: nächster verschobener Gitterpunkt
const CROWN = { shade: 0, id: 0 };
function crownAt(x, y) {
  const G = 20, gx = Math.floor(x / G), gy = Math.floor(y / G);
  let best = 0, id = 0;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const cx = gx + dx, cy = gy + dy;
    const px = (cx + hash(cx, cy, SEED + 11)) * G, py = (cy + hash(cx, cy, SEED + 12)) * G;
    const rr = G * (0.75 + 0.45 * hash(cx, cy, SEED + 13));
    // Lichtkante oben links: Abstand zu leicht versetztem Mittelpunkt
    const d2 = ((x - px + 3) ** 2 + (y - py + 3) ** 2) / (rr * rr);
    const v = 1 - d2;
    if (v > best) { best = v; id = hash(cx, cy, SEED + 14); }
  }
  CROWN.shade = best; CROWN.id = id;
  return CROWN;
}
// Gebirgshöhe 0..1: großräumige Maske mal Grate. >0.35 Fels, >0.6 Felswand, >0.8 Schneegipfel
function mtnH(x, y) {
  const mask = fbm(x / 2600, y / 2600, SEED + 80, 3);
  if (mask < 0.6) return 0;
  let k = clamp((mask - 0.6) / 0.12, 0, 1);
  k = k * k * (3 - 2 * k);
  return k * (0.3 + 0.7 * ridged(x / 600, y / 600, SEED + 81, 4));
}
function autumnAt(x, y) { return fbm(x / 1600, y / 1600, SEED + 90, 2) > 0.6; }
function isWater(x, y) { return elev(x, y) < WL && mtnH(x, y) < 0.2; }

// ---------- Straßennetz ----------
// Drei Netze auf unterschiedlich groben Gittern: verschobene Knoten, verbunden durch Bézierkurven
// mit stetigen Tangenten. Autobahnen laufen als durchgehende Zeilen/Spalten durch die ganze Welt.
const NETS = [
  { cell: 4200, jit: 0.22 }, // Autobahnen
  { cell: 1300, jit: 0.33 }, // Land- und Nebenstraßen
  { cell: 620,  jit: 0.38 }, // Waldwege
];
// Fahrstreifen sind 36 px breit, das Auto inkl. Räder 28 px.
const LANE = 36;
const RT = {
  hw:    { half: 83, sh: 8, col: '#4b4d53', name: 'Autobahn', rank: 3 },    // 7.5 Mitte + 2 Streifen + 3.5 Rand
  road:  { half: 40, sh: 6, col: '#5a5b61', name: 'Landstraße', rank: 2 },  // 1 Streifen je Richtung + 4 Rand
  lane:  { half: 30, sh: 4, col: '#5a5b61', name: 'Nebenstraße', rank: 2 },
  track: { half: 14, sh: 0, col: '#a08f70', name: 'Waldweg', rank: 1 },
};
const segCache = new Map();
const NO_ROADS = [];

function roadNode(net, i, j) {
  const n = NETS[net];
  return [(i + .5 + (hash(i, j, SEED + net * 7 + 1) - .5) * 2 * n.jit) * n.cell,
          (j + .5 + (hash(i, j, SEED + net * 7 + 2) - .5) * 2 * n.jit) * n.cell];
}
function edgeExists(net, i, j, dir) {
  if (net === 0) return dir ? hash(i, 0, SEED + 301) < 0.4 : hash(0, j, SEED + 300) < 0.4;
  return hash(i, j, SEED + 310 + net * 2 + dir) < (net === 1 ? 0.68 : 0.6);
}
const WOODLAND = { [S_GRASS]: 1, [S_SNOW]: 1, [S_MUD]: 1, [S_DENSE]: 1, [S_HEATH]: 1 };
function nodeDegree(net, i, j) {
  return edgeExists(net, i, j, 0) + edgeExists(net, i - 1, j, 0) + edgeExists(net, i, j, 1) + edgeExists(net, i, j - 1, 1);
}
function nodeTangent(net, i, j, dir) {
  const a = roadNode(net, dir ? i : i - 1, dir ? j - 1 : j), b = roadNode(net, dir ? i : i + 1, dir ? j + 1 : j);
  const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
  return [dx / l, dy / l];
}
function getSeg(net, i, j, dir) {
  const key = net + '|' + i + '|' + j + '|' + dir;
  let s = segCache.get(key);
  if (s === undefined) { s = buildSeg(net, i, j, dir, key); segCache.set(key, s); }
  return s;
}
function buildSeg(net, i, j, dir, key) {
  if (!edgeExists(net, i, j, dir)) return null;
  const i2 = dir ? i : i + 1, j2 = dir ? j + 1 : j;
  const A = roadNode(net, i, j), B = roadNode(net, i2, j2);
  const tA = nodeTangent(net, i, j, dir), tB = nodeTangent(net, i2, j2, dir);
  const len = Math.hypot(B[0] - A[0], B[1] - A[1]), k = len * 0.36;
  const P1 = [A[0] + tA[0] * k, A[1] + tA[1] * k], P2 = [B[0] - tB[0] * k, B[1] - tB[1] * k];
  const n = Math.max(6, Math.ceil(len / 14)) + 1;
  const xs = new Float32Array(n), ys = new Float32Array(n), nx = new Float32Array(n), ny = new Float32Array(n);
  const water = new Uint8Array(n);
  let forest = 0, wet = 0, mt = 0;
  for (let q = 0; q < n; q++) {
    const t = q / (n - 1), u = 1 - t, b0 = u * u * u, b1 = 3 * u * u * t, b2 = 3 * u * t * t, b3 = t * t * t;
    xs[q] = b0 * A[0] + b1 * P1[0] + b2 * P2[0] + b3 * B[0];
    ys[q] = b0 * A[1] + b1 * P1[1] + b2 * P2[1] + b3 * B[1];
    if (mtnH(xs[q], ys[q]) > 0.3) mt++;
  }
  const mtn = net !== 2 && mt > n * 0.1;
  // Gebirgsstraßen schlängeln sich in Serpentinen; an den Knoten (t=0/1) bleibt die Lage unverändert
  if (mtn && net === 1) {
    const ox = xs.slice(), oy = ys.slice();
    const amp = 90 * Math.min(1, mt / (n * 0.4)), phase = hash(i, j, SEED + 340 + dir) * TAU;
    let arc = 0;
    for (let q = 0; q < n; q++) {
      const a = Math.max(0, q - 1), b = Math.min(n - 1, q + 1);
      const tx = ox[b] - ox[a], ty = oy[b] - oy[a], l = Math.hypot(tx, ty) || 1;
      if (q) arc += Math.hypot(ox[q] - ox[q - 1], oy[q] - oy[q - 1]);
      const off = amp * Math.sin(Math.PI * q / (n - 1)) * Math.sin(arc / 520 * TAU + phase);
      xs[q] = ox[q] - ty / l * off; ys[q] = oy[q] + tx / l * off;
    }
  }
  for (let q = 0; q < n; q++) {
    if (isWater(xs[q], ys[q])) { water[q] = 1; wet++; }
    if (net === 2 && forestAt(xs[q], ys[q]) > 0.52 && WOODLAND[surfaceAt(xs[q], ys[q], NO_ROADS)]) forest++;
  }
  // Waldwege nur durch Wald und nie durchs Wasser
  if (net === 2 && (wet > 0 || forest < n * 0.6)) return null;
  let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9, plen = 0;
  for (let q = 0; q < n; q++) {
    if (q) plen += Math.hypot(xs[q] - xs[q - 1], ys[q] - ys[q - 1]);
    const a = Math.max(0, q - 1), b = Math.min(n - 1, q + 1);
    const tx = xs[b] - xs[a], ty = ys[b] - ys[a], l = Math.hypot(tx, ty) || 1;
    nx[q] = -ty / l; ny[q] = tx / l; // zeigt in Fahrtrichtung nach rechts
    minx = Math.min(minx, xs[q]); maxx = Math.max(maxx, xs[q]); miny = Math.min(miny, ys[q]); maxy = Math.max(maxy, ys[q]);
  }
  // Sackgassen sind immer kleine Nebenstraßen
  const deadEnd = net === 1 && (nodeDegree(net, i, j) < 2 || nodeDegree(net, i2, j2) < 2);
  // Der Straßentyp gilt für die ganze Gitterzeile bzw. -spalte, damit er nicht mitten auf der Strecke wechselt
  const marked = hash(dir ? i : j, dir, SEED + 330) < 0.6;
  const type = net === 0 ? 'hw' : net === 1 ? (!deadEnd && marked ? 'road' : 'lane') : 'track';
  const rt = RT[type];
  return { key, net, i, j, dir, type, rank: rt.rank, half: rt.half, sh: rt.sh, col: rt.col, xs, ys, nx, ny, water, n,
           step: plen / (n - 1), mtn,
           hasWater: wet > 0, minx, miny, maxx, maxy };
}

// Alle Segmente nahe eines Rechtecks, jeweils auf den relevanten Stützpunktbereich beschnitten
function segsNear(x0, y0, x1, y1) {
  const out = [];
  for (let net = 0; net < 3; net++) {
    const cell = NETS[net].cell;
    for (let j = Math.floor(y0 / cell) - 2; j <= Math.floor(y1 / cell) + 1; j++) {
      for (let i = Math.floor(x0 / cell) - 2; i <= Math.floor(x1 / cell) + 1; i++) {
        for (let dir = 0; dir < 2; dir++) {
          const s = getSeg(net, i, j, dir);
          if (!s) continue;
          const m = s.half + s.sh + 60;
          if (s.maxx < x0 - m || s.minx > x1 + m || s.maxy < y0 - m || s.miny > y1 + m) continue;
          let i0 = -1, i1 = -1;
          for (let k = 0; k < s.n; k++) {
            const x = s.xs[k], y = s.ys[k];
            if (x >= x0 - m && x <= x1 + m && y >= y0 - m && y <= y1 + m) { if (i0 < 0) i0 = k; i1 = k; }
          }
          if (i0 >= 0) out.push({ seg: s, i0: Math.max(0, i0 - 1), i1: Math.min(s.n - 1, i1 + 1) });
        }
      }
    }
  }
  out.sort((a, b) => b.seg.net - a.seg.net || (a.seg.key < b.seg.key ? -1 : a.seg.key > b.seg.key ? 1 : 0));
  return out;
}

// ---------- Über- und Unterführungen ----------
// Wo eine Autobahn eine andere Straße kreuzt, liegt eine der beiden auf einer Brücke.
// Im Umkreis R der Kreuzung bestimmt die Einfahrt, auf welcher Ebene das Auto fährt.
const crossCache = new Map();
const UNDERPASS_CLEAR = 14; // seitlicher Freiraum unter der Brücke neben dem Bankett
function crossingsOf(a, b) {
  const key = a.key + '#' + b.key;
  let r = crossCache.get(key);
  if (r) return r;
  r = [];
  if (!(a.maxx < b.minx || a.minx > b.maxx || a.maxy < b.miny || a.miny > b.maxy)) {
    for (let i = 0; i < a.n - 1; i++) {
      const ax = a.xs[i], ay = a.ys[i], bx = a.xs[i + 1], by = a.ys[i + 1];
      if (Math.max(ax, bx) < b.minx || Math.min(ax, bx) > b.maxx || Math.max(ay, by) < b.miny || Math.min(ay, by) > b.maxy) continue;
      for (let j = 0; j < b.n - 1; j++) {
        const cx = b.xs[j], cy = b.ys[j], dx = b.xs[j + 1], dy = b.ys[j + 1];
        if (Math.min(cx, dx) > Math.max(ax, bx) || Math.max(cx, dx) < Math.min(ax, bx) ||
            Math.min(cy, dy) > Math.max(ay, by) || Math.max(cy, dy) < Math.min(ay, by)) continue;
        const rX = bx - ax, rY = by - ay, sX = dx - cx, sY = dy - cy, den = rX * sY - rY * sX;
        if (Math.abs(den) < 1e-9) continue;
        const t = ((cx - ax) * sY - (cy - ay) * sX) / den, u = ((cx - ax) * rY - (cy - ay) * rX) / den;
        if (t < 0 || t > 1 || u < 0 || u > 1) continue;
        const x = ax + rX * t, y = ay + rY * t;
        if (r.some(z => Math.hypot(z.x - x, z.y - y) < 200)) continue;
        // Kreuzt eine Straße genau an ihrem Knoten, melden beide Nachbarstücke dieselbe Kreuzung
        let z = allCrossings.find(q => Math.hypot(q.x - x, q.y - y) < 150 && q.lo.net + q.up.net === a.net + b.net);
        if (!z) { z = makeCrossing(a, b, i, j, x, y); allCrossings.push(z); }
        r.push(z);
      }
    }
  }
  crossCache.set(key, r);
  return r;
}
const allCrossings = [];
function makeCrossing(a, b, i, j, x, y) {
  const sin = Math.max(0.4, Math.abs(a.ny[i] * -b.nx[j] - -a.nx[i] * b.ny[j]));
  // a ist immer die Autobahn; Waldwege liegen nie auf einer Brücke
  const aUp = b.type === 'track' || hash(Math.floor(x / 64), Math.floor(y / 64), SEED + 700) < 0.5;
  const up = aUp ? a : b, lo = aUp ? b : a;
  const span = (lo.half + lo.sh + UNDERPASS_CLEAR) / sin + 24;     // halbe Brückenlänge
  const R = Math.max(span + 80, (up.half + up.sh + 30) / sin);
  return { x, y, up, lo, span, R, upV: chainViews(up, x, y, R * 1.6), loV: chainViews(lo, x, y, R * 1.6) };
}
// Das Segment samt Vorgänger und Nachfolger derselben Straße, beschnitten auf den Umkreis rad
function chainViews(s, x, y, rad) {
  const prev = getSeg(s.net, s.dir ? s.i : s.i - 1, s.dir ? s.j - 1 : s.j, s.dir);
  const next = getSeg(s.net, s.dir ? s.i : s.i + 1, s.dir ? s.j + 1 : s.j, s.dir);
  const out = [];
  for (const q of [prev, s, next]) {
    if (!q) continue;
    let i0 = -1, i1 = -1;
    for (let k = 0; k < q.n; k++) if (Math.hypot(q.xs[k] - x, q.ys[k] - y) < rad) { if (i0 < 0) i0 = k; i1 = k; }
    if (i0 >= 0) out.push({ seg: q, i0: Math.max(0, i0 - 1), i1: Math.min(q.n - 1, i1 + 1) });
  }
  return out;
}
const SN = { d: 0, x: 0, y: 0 };
function segNearest(views, x, y) {
  let best = 1e9;
  for (const v of views) {
    const s = v.seg;
    for (let k = v.i0; k < v.i1; k++) {
      const ax = s.xs[k], ay = s.ys[k], bx = s.xs[k + 1] - ax, by = s.ys[k + 1] - ay;
      const t = clamp(((x - ax) * bx + (y - ay) * by) / (bx * bx + by * by), 0, 1);
      const qx = ax + bx * t, qy = ay + by * t, d = Math.hypot(x - qx, y - qy);
      if (d < best) { best = d; SN.x = qx; SN.y = qy; }
    }
  }
  SN.d = best;
  return SN;
}

// Vorzeichenbehafteter Abstand zum Fahrbahnrand (negativ = auf der Fahrbahn)
const RQ = { edge: 1e9, seg: null };
function roadQuery(x, y, views) {
  let best = 1e9, bs = null;
  for (const v of views) {
    const s = v.seg, m = s.half + s.sh + 16;
    if (x < s.minx - m || x > s.maxx + m || y < s.miny - m || y > s.maxy + m) continue;
    const xs = s.xs, ys = s.ys;
    for (let k = v.i0; k < v.i1; k++) {
      const ax = xs[k], ay = ys[k];
      if (Math.abs(x - ax) > m || Math.abs(y - ay) > m) continue;
      const bx = xs[k + 1] - ax, by = ys[k + 1] - ay, px = x - ax, py = y - ay;
      const t = clamp((px * bx + py * by) / (bx * bx + by * by), 0, 1);
      const d = Math.hypot(px - bx * t, py - by * t) - s.half;
      if (d < best) { best = d; bs = s; }
    }
  }
  RQ.edge = best; RQ.seg = bs;
  return RQ;
}

function surfaceAt(x, y, views) {
  const e = elev(x, y), h = mtnH(x, y);
  const t = fbm(x / 2400, y / 2400, SEED + 31, 3);
  const cold = t < 0.39, water = e < WL && h < 0.2;
  const R = roadQuery(x, y, views || segsNear(x, y, x, y));
  lastE = e; lastH = h; lastCold = cold;
  if (R.seg) {
    if (R.edge < 0) return R.seg.type === 'track' ? S_GRAVEL : (water ? S_BRIDGE : S_ASPHALT);
    if (R.edge < R.seg.sh && !water) return S_GRAVEL;
  }
  if (water) return cold ? S_ICE : (e < WD ? S_DEEP : S_SHALLOW);
  if (h > 0.6) return S_CLIFF;
  if (h > 0.35) return S_ROCK;
  if (e < WL + 0.025 && h < 0.2) return cold ? S_SNOW : S_SAND;
  const m = fbm(x / 800, y / 800, SEED + 47, 3);
  const f = forestAt(x, y);
  lastM = m;
  if (cold) return f > DENSE_F ? S_DENSE : m > 0.68 ? S_ICE : S_SNOW;
  if (t > 0.62) return m > 0.66 ? S_GRASS : S_SAND;
  if (m > 0.7) return vnoise(x / 70, y / 70, SEED + 9) > 0.55 ? S_SHALLOW : S_MUD; // Sumpf
  if (m > 0.63) return S_MUD;
  if (f > DENSE_F) return S_DENSE;
  if (m < 0.38) return S_HEATH;
  return S_GRASS;
}

// ---------- Chunks ----------
const CELL = 4, CN = 128, CS = CELL * CN; // 512 Welt-Pixel pro Chunk
const MAX_CHUNKS = 80;
const chunks = new Map();
const ckey = (cx, cy) => (cx + 50000) * 100000 + (cy + 50000);
let frameNo = 0;
let spawn = { x: 0, y: 0, a: 0 };

function newChunk(cx, cy) {
  const segs = segsNear(cx * CS, cy * CS, (cx + 1) * CS, (cy + 1) * CS);
  const s = surfaceAt((cx + .5) * CS, (cy + .5) * CS, segs);
  const p = SURF[s].rgb;
  return {
    cx, cy, segs, done: false, row: 0, lastUsed: frameNo,
    surf: new Uint8Array(CN * CN), img: new ImageData(CN, CN),
    canvas: null, statics: [], dyn: [],
    fallback: `rgb(${p[0]},${p[1]},${p[2]})`,
  };
}

function genRows(c, n) {
  const d = c.img.data, ox = c.cx * CS, oy = c.cy * CS;
  const end = Math.min(CN, c.row + n);
  for (let j = c.row; j < end; j++) {
    for (let i = 0; i < CN; i++) {
      const wx = ox + (i + .5) * CELL, wy = oy + (j + .5) * CELL;
      const s = surfaceAt(wx, wy, c.segs);
      const idx = j * CN + i;
      c.surf[idx] = s;
      const p = SURF[s].rgb;
      let r = p[0], g = p[1], b = p[2];
      const n1 = hash(c.cx * CN + i, c.cy * CN + j, SEED + 99);
      const lf = vnoise(wx / 90, wy / 90, SEED + 5);
      let v = 0.94 + 0.08 * n1 + 0.2 * (lf - .5);
      if (s === S_DEEP) {
        const k = clamp((lastE - (WD - 0.13)) / 0.13, 0, 1);
        r = 24 + 22 * k; g = 62 + 36 * k; b = 112 + 38 * k; v = 0.97 + 0.05 * n1;
      } else if (s === S_SHALLOW) {
        const k = clamp((lastE - WD) / (WL - WD), 0, 1);
        r = 58 + 40 * k; g = 128 + 42 * k; b = 182 + 18 * k; v = 0.97 + 0.05 * n1;
      } else if (s === S_GRASS) {
        const k = 0.5 - lastM; // trockener = gelblicher
        r += k * 130; g += k * 30; b -= k * 20;
      } else if (s === S_ICE) {
        v = 0.95 + 0.1 * n1 + 0.12 * (lf - .5);
      } else if (s === S_DENSE) {
        const cr = crownAt(wx, wy);
        v = 0.45 + 0.75 * Math.sqrt(cr.shade);
        if (lastCold) {
          r = 34; g = 72; b = 60;
          if (cr.shade > 0.55 && cr.id > 0.4) { r = 214; g = 222; b = 230; } // Schnee auf den Kronen
        } else if (autumnAt(wx, wy)) {
          const pal = [[176, 84, 34], [196, 140, 40], [150, 52, 36], [96, 112, 46]];
          [r, g, b] = pal[Math.floor(cr.id * pal.length)];
        } else {
          g = 76 + 30 * cr.id; r = 30 + 18 * cr.id;
        }
      } else if (s === S_HEATH) {
        if (n1 > 0.84) { r = 146; g = 96; b = 150; } // Heidekraut
      } else if (s === S_CLIFF && lastH > 0.8) {
        r = 232; g = 236; b = 242;                   // Schneegipfel
      }
      if (lastH > 0.12 && s !== S_SHALLOW && s !== S_DEEP) {
        const hh = lastH; // Hangschattierung, Licht von oben links
        v *= 1 + clamp((mtnH(wx - 5, wy - 5) - mtnH(wx + 5, wy + 5)) * (s === S_CLIFF ? 11 : 7), -0.5, 0.5);
        lastH = hh;
      }
      const o = idx * 4;
      d[o] = clamp(r * v, 0, 255); d[o + 1] = clamp(g * v, 0, 255); d[o + 2] = clamp(b * v, 0, 255); d[o + 3] = 255;
    }
  }
  c.row = end;
  if (c.row >= CN) finalizeChunk(c);
}

function finalizeChunk(c) {
  const small = document.createElement('canvas');
  small.width = small.height = CN;
  small.getContext('2d').putImageData(c.img, 0, 0);
  c.canvas = document.createElement('canvas');
  c.canvas.width = c.canvas.height = CS;
  const g = c.canvas.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(small, 0, 0, CS, CS);
  c.ctx = g;
  c.img = null;
  drawRoads(c);
  c.crossings = [];
  const segs = c.segs.map(v => v.seg);
  for (const a of segs) if (a.net === 0) for (const b of segs) if (b.net !== 0) {
    for (const z of crossingsOf(a, b)) {
      if (z.x > c.cx * CS - 300 && z.x < (c.cx + 1) * CS + 300 && z.y > c.cy * CS - 300 && z.y < (c.cy + 1) * CS + 300 &&
          !c.crossings.includes(z)) c.crossings.push(z);
    }
  }
  genObstacles(c);
  c.done = true;
}

// Straßen als Vektorlinien in den Chunk zeichnen. Jedes Segment wird komplett gezeichnet,
// damit Strichmarkierungen über Chunkgrenzen hinweg nahtlos weiterlaufen.
const MARK = 'rgba(238,238,228,0.92)';
// Unterbrochene Teilstücke bekommen die Lauflänge als Strich-Offset, damit das Strichmuster
// unabhängig von Lücken (und damit in jedem Chunk gleich) weiterläuft.
function polyLine(g, s, off, w, col, dash, pred) {
  g.lineWidth = w; g.strokeStyle = col; g.setLineDash(dash || []);
  let open = false, len = 0, px = 0, py = 0;
  for (let k = 0; k < s.n; k++) {
    const x = s.xs[k] + s.nx[k] * off, y = s.ys[k] + s.ny[k] * off;
    if (k) len += Math.hypot(x - px, y - py);
    px = x; py = y;
    if (pred && !pred(k, x, y)) { if (open) { g.stroke(); open = false; } continue; }
    if (open) g.lineTo(x, y);
    else { g.beginPath(); g.lineDashOffset = len; g.moveTo(x, y); open = true; }
  }
  if (open) g.stroke();
}

// Liegt (x,y) auf der Fahrbahn eines der Segmente? Segmentenden zählen ohne runde Kappe,
// damit an T-Kreuzungen die gegenüberliegende Randlinie durchgehend bleibt.
function onAnyBody(x, y, views) {
  for (const v of views) {
    const o = v.seg, m = o.half + 16;
    if (x < o.minx - m || x > o.maxx + m || y < o.miny - m || y > o.maxy + m) continue;
    for (let k = v.i0; k < v.i1; k++) {
      const ax = o.xs[k], ay = o.ys[k];
      if (Math.abs(x - ax) > m || Math.abs(y - ay) > m) continue;
      const bx = o.xs[k + 1] - ax, by = o.ys[k + 1] - ay, px = x - ax, py = y - ay;
      let t = (px * bx + py * by) / (bx * bx + by * by);
      if ((k === 0 && t < 0) || (k === o.n - 2 && t > 1)) continue;
      t = clamp(t, 0, 1);
      if (Math.hypot(px - bx * t, py - by * t) < o.half + 1) return true;
    }
  }
  return false;
}

// Markierungen enden dort, wo eine gleich- oder höherrangige Straße kreuzt oder einmündet.
// Ausgenommen ist die eigene Fortsetzung (gleiches Netz, gleiche Gitterzeile bzw. -spalte).
function markPred(c, s) {
  const others = c.segs.filter(v => {
    const o = v.seg;
    if (o === s || o.rank < s.rank) return false;
    if ((o.net === 0) !== (s.net === 0)) return false; // Über-/Unterführung: Linien laufen durch
    if (o.net === s.net && o.dir === s.dir && (s.dir ? o.i === s.i : o.j === s.j)) return false;
    return !(o.maxx < s.minx - 100 || o.minx > s.maxx + 100 || o.maxy < s.miny - 100 || o.miny > s.maxy + 100);
  });
  if (!others.length) return null;
  const x0 = c.cx * CS - 20, y0 = c.cy * CS - 20, x1 = x0 + CS + 40, y1 = y0 + CS + 40;
  return (k, x, y) => x < x0 || x > x1 || y < y0 || y > y1 || !onAnyBody(x, y, others);
}

function drawMarkings(g, s, p) {
  const h = s.half;
  if (s.type === 'hw') {
    polyLine(g, s, 0, 5, '#a3a8ae', null, p);                          // Mittelleitplanke
    for (const sg of [-1, 1]) {
      polyLine(g, s, sg * 6.5, 1.6, MARK, null, p);
      polyLine(g, s, sg * (7.5 + LANE), 1.6, MARK, [22, 26], p);      // Fahrstreifenbegrenzung
      polyLine(g, s, sg * (7.5 + LANE * 2), 2, MARK, null, p);        // Randlinie
    }
  } else if (s.type === 'road') {
    polyLine(g, s, 0, 1.8, MARK, [20, 22], p);
    polyLine(g, s, -(LANE + 1), 1.8, MARK, null, p);
    polyLine(g, s, LANE + 1, 1.8, MARK, null, p);
  } else if (s.type === 'track') {
    polyLine(g, s, 0, 3, 'rgba(96,128,62,0.55)', null, p);            // Grasnarbe in der Mitte
    polyLine(g, s, -7, 4, 'rgba(110,90,60,0.5)', null, p);            // Fahrspuren
    polyLine(g, s, 7, 4, 'rgba(110,90,60,0.5)', null, p);
  }
  if (s.mtn) {                                                        // Leitplanken im Gebirge
    for (const sg of [-1, 1]) {
      polyLine(g, s, sg * (h + s.sh - 2), 2.5, '#d5d8dc', null, p);
      polyLine(g, s, sg * (h + s.sh - 2), 4, '#5b5f66', [2, 16], p);
    }
  }
}
function drawRoads(c) {
  const g = c.ctx;
  g.save();
  g.translate(-c.cx * CS, -c.cy * CS);
  g.lineJoin = 'round';
  const segs = c.segs.map(v => v.seg);
  const wetPred = s => k => s.water[k] || s.water[k - 1] || s.water[k + 1];
  for (const net of [2, 1, 0]) {
    const list = segs.filter(s => s.net === net);
    g.lineCap = 'butt';
    for (const s of list) if (s.hasWater) {
      g.save(); g.translate(7, 9);
      polyLine(g, s, 0, s.half * 2 + 4, 'rgba(0,0,0,0.28)', null, wetPred(s));
      g.restore();
    }
    g.lineCap = 'round';
    for (const s of list) {
      if (s.sh) polyLine(g, s, 0, (s.half + s.sh) * 2, '#9a8c74', null, k => !s.water[k]);
      else polyLine(g, s, 0, s.half * 2 + 6, 'rgba(84,66,42,0.35)');
    }
    for (const s of list) polyLine(g, s, 0, s.half * 2, s.col);
    g.lineCap = 'butt';
    for (const s of list) drawMarkings(g, s, markPred(c, s));
  }
  for (const s of segs) if (s.hasWater) {
    const p = wetPred(s);
    polyLine(g, s, -(s.half + 1.5), 3, '#d9d3c5', null, p); // Brückengeländer
    polyLine(g, s, s.half + 1.5, 3, '#d9d3c5', null, p);
  }
  g.setLineDash([]);
  g.restore();
}

function localSurf(c, x, y) {
  const i = Math.floor((x - c.cx * CS) / CELL), j = Math.floor((y - c.cy * CS) / CELL);
  if (i < 0 || j < 0 || i >= CN || j >= CN) return surfaceAt(x, y);
  return c.surf[j * CN + i];
}

const ROOFS = [['#b8553f', '#8f3e2d'], ['#5d6b7a', '#46515d'], ['#7a4b3a', '#5c382b'], ['#c8a35a', '#a1813f'], ['#4f7a5a', '#3b5c44']];

function genObstacles(c) {
  const rng = mulberry32(Math.floor(hash(c.cx, c.cy, SEED + 500) * 4294967296));
  const ox = c.cx * CS, oy = c.cy * CS;
  const S = c.statics, D = c.dyn;
  const free = (x, y, r, onRoad) => {
    if (Math.hypot(x - spawn.x, y - spawn.y) < 200) return false;
    if (!onRoad) {
      const R = roadQuery(x, y, c.segs);
      if (R.seg && R.edge - R.seg.sh < r + 3) return false;
    }
    for (const o of S) if (Math.hypot(o.x - x, o.y - y) < o.r + r + 8) return false;
    for (const o of D) if (Math.hypot(o.x - x, o.y - y) < o.r + r + 4) return false;
    return true;
  };
  const addDyn = (t, x, y, onRoad) => {
    const def = DYN[t];
    if (c.crossings.some(z => Math.hypot(x - z.x, y - z.y) < z.R)) return;
    if (free(x, y, def.r, onRoad)) D.push({ t, x, y, r: def.r, m: def.m, vx: 0, vy: 0, a: rng() * TAU, va: 0, c: def.colors[Math.floor(rng() * def.colors.length)] });
  };

  for (let k = 0; k < 70; k++) {
    const x = ox + rng() * CS, y = oy + rng() * CS;
    const s = localSurf(c, x, y);
    const r = rng();
    const forest = forestAt(x, y);
    let o = null;
    if (s === S_GRASS) {
      const pt = forest > 0.56 ? 0.75 : 0.07;
      if (r < pt) o = makeTree(rng, x, y);
      else if (r < pt + 0.06) o = { t: 'bush', x, y, r: 6 + rng() * 4 };
      else if (r < pt + 0.09) o = makeRock(rng, x, y);
      else if (r < pt + 0.115) { tryHouse(c, rng, x, y); continue; }
      else if (r < pt + 0.125) { addDyn('bale', x, y); continue; }
    } else if (s === S_SAND) {
      if (r < 0.13) o = { t: 'cactus', x, y, r: 6 + rng() * 3, arms: rng() * TAU };
      else if (r < 0.2) o = makeRock(rng, x, y);
      else if (r < 0.22) { addDyn('barrel', x, y); continue; }
    } else if (s === S_SNOW) {
      if (r < (forest > 0.5 ? 0.6 : 0.12)) o = { ...makeTree(rng, x, y), t: 'pine', snow: true };
      else if (r < 0.7) o = makeRock(rng, x, y);
    } else if (s === S_MUD) {
      if (r < 0.14) o = { t: 'stump', x, y, r: 6 + rng() * 3 };
      else if (r < 0.26) o = { t: 'bush', x, y, r: 6 + rng() * 3, dead: true };
      else if (r < 0.3) { addDyn('crate', x, y); continue; }
    } else if (s === S_ROCK) {
      if (r < 0.14) o = makeRock(rng, x, y, 1.6);
      else if (r < 0.2) o = { ...makeTree(rng, x, y), t: 'pine', snow: fbm(x / 2400, y / 2400, SEED + 31, 3) < 0.45 };
    } else if (s === S_HEATH) {
      if (r < 0.1) o = { t: 'bush', x, y, r: 5 + rng() * 4, heath: true };
      else if (r < 0.14) o = makeRock(rng, x, y);
      else if (r < 0.17) o = makeTree(rng, x, y);
    } else if (s === S_ICE) {
      if (r < 0.04) o = makeRock(rng, x, y);
    } else if (s === S_SHALLOW) {
      if (r < 0.06) o = makeRock(rng, x, y);
    } else if (s === S_ASPHALT) {
      // gelegentlich eine Baustelle: Pylonenreihe quer über einen Fahrstreifen
      if (r < 0.03) {
        const a = rng() * TAU, n = 3 + Math.floor(rng() * 3);
        for (let q = 0; q < n; q++) addDyn('cone', x + Math.cos(a) * q * 16, y + Math.sin(a) * q * 16, true);
        continue;
      }
    }
    if (o && free(o.x, o.y, o.r)) S.push(o);
  }
}

function makeTree(rng, x, y) {
  const r = 12 + rng() * 10;
  const autumn = autumnAt(x, y) && rng() < 0.85;
  const h = autumn ? 15 + rng() * 35 : 95 + rng() * 35, l = autumn ? 36 + rng() * 8 : 26 + rng() * 8;
  const blobs = [];
  const n = 5 + Math.floor(rng() * 2), a0 = rng() * TAU;
  for (let i = 0; i < n; i++) {
    const a = a0 + i / n * TAU + rng() * .4;
    blobs.push([Math.cos(a) * r * .42, Math.sin(a) * r * .42, r * (.5 + rng() * .15)]);
  }
  return { t: 'tree', x, y, r, blobs,
    c1: `hsl(${h},42%,${l}%)`, c2: `hsl(${h - 8},45%,${l + 9}%)`, c3: `hsl(${h - 15},50%,${l + 18}%)` };
}
function makeRock(rng, x, y, scale = 1) {
  const r = (7 + rng() * 9) * scale, pts = [];
  for (let i = 0; i < 8; i++) pts.push(.75 + rng() * .3);
  const l = 48 + rng() * 14;
  return { t: 'rock', x, y, r, pts, c1: `hsl(30,4%,${l}%)`, c2: `hsl(30,5%,${l + 12}%)` };
}
function tryHouse(c, rng, x, y) {
  const w = 50 + rng() * 34, h = 42 + rng() * 30;
  const pts = [[0, 0], [-w / 2, -h / 2], [w / 2, -h / 2], [-w / 2, h / 2], [w / 2, h / 2]];
  for (const [dx, dy] of pts) if (surfaceAt(x + dx, y + dy, c.segs) !== S_GRASS) return;
  const r = Math.hypot(w, h) / 2;
  const R = roadQuery(x, y, c.segs);
  if (R.seg && R.edge - R.seg.sh < r + 6) return;
  if (Math.hypot(x - spawn.x, y - spawn.y) < 250) return;
  for (const o of c.statics) if (Math.hypot(o.x - x, o.y - y) < o.r + r + 10) return;
  const roof = ROOFS[Math.floor(rng() * ROOFS.length)];
  c.statics.push({ t: 'house', x, y, w, h, r, c1: roof[0], c2: roof[1], chim: rng() });
}

const DYN = {
  cone:   { r: 5,  m: 0.05, colors: ['#ff7a1a'] },
  barrel: { r: 8,  m: 0.3,  colors: ['#c8352b', '#2f6db5', '#3d8a4a'] },
  crate:  { r: 9,  m: 0.35, colors: ['#a8783f'] },
  bale:   { r: 10, m: 0.4,  colors: ['#d9b85a'] },
};

function chunkAt(x, y) {
  return chunks.get(ckey(Math.floor(x / CS), Math.floor(y / CS)));
}
function surfAtFast(x, y) {
  const cx = Math.floor(x / CS), cy = Math.floor(y / CS);
  const c = chunks.get(ckey(cx, cy));
  if (c && c.done) {
    const i = Math.floor((x - cx * CS) / CELL), j = Math.floor((y - cy * CS) / CELL);
    return c.surf[j * CN + i];
  }
  return surfaceAt(x, y);
}

function viewBounds(margin) {
  const z = cam.z;
  const hw = W / 2 / z + margin, hh = H / 2 / z + margin;
  return [cam.x - hw, cam.y - hh, cam.x + hw, cam.y + hh];
}

function ensureChunks() {
  const [x0, y0, x1, y1] = viewBounds(CS * 0.6);
  for (let cy = Math.floor(y0 / CS); cy <= Math.floor(y1 / CS); cy++) {
    for (let cx = Math.floor(x0 / CS); cx <= Math.floor(x1 / CS); cx++) {
      const k = ckey(cx, cy);
      let c = chunks.get(k);
      if (!c) { c = newChunk(cx, cy); chunks.set(k, c); }
      c.lastUsed = frameNo;
    }
  }
  if (chunks.size > MAX_CHUNKS) {
    const old = [...chunks.entries()].filter(([, c]) => c.lastUsed < frameNo - 30).sort((a, b) => a[1].lastUsed - b[1].lastUsed);
    for (let i = 0; i < old.length && chunks.size > MAX_CHUNKS; i++) chunks.delete(old[i][0]);
  }
}

function workChunks(budgetMs) {
  const t0 = performance.now();
  const todo = [];
  for (const c of chunks.values()) if (!c.done) todo.push(c);
  if (!todo.length) return;
  const d = c => Math.hypot((c.cx + .5) * CS - car.x, (c.cy + .5) * CS - car.y);
  todo.sort((a, b) => d(a) - d(b));
  for (const c of todo) {
    while (!c.done) {
      if (performance.now() - t0 > budgetMs) return;
      genRows(c, 8);
    }
  }
}

// ---------- Auto ----------
const CAR_COLORS = ['#e8432e', '#2f7de1', '#f2b705', '#2bb673', '#f3f3f0', '#8e4fc4', '#1f2329'];
const car = { x: 0, y: 0, a: 0, vx: 0, vy: 0, w: 0, steer: 0, vf: 0, vl: 0, color: 0,
  braking: false, reversing: false, zone: null, upper: false, ws: [S_ASPHALT, S_ASPHALT, S_ASPHALT, S_ASPHALT], prevW: [null, null, null, null] };
const WHEELS = [[14, -10], [14, 10], [-14, -10], [-14, 10]]; // vorne links/rechts, hinten links/rechts
const TOP = 560, ACC = 430, REV_TOP = 190, REV_ACC = 300, BRAKE = 950;
const KMH = 0.25;
const CR = 11, COFF = [-13, 0, 13];
const INV_I = 1 / 260;

const keys = { up: false, down: false, left: false, right: false, hand: false };
const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right', Space: 'hand' };
let started = false;
addEventListener('keydown', e => {
  if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = true; e.preventDefault(); }
  if (!started) { started = true; document.getElementById('intro').style.opacity = 0; }
  if (e.repeat) return;
  if (e.code === 'KeyR') newWorld(Math.floor(Math.random() * 999999) + 1);
  if (e.code === 'KeyC') car.color = (car.color + 1) % CAR_COLORS.length;
  if (e.code === 'KeyH') document.getElementById('help').classList.toggle('hidden');
});
addEventListener('keyup', e => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

let nearStatics = [], nearDyn = [];
function gatherNearby() {
  nearStatics = []; nearDyn = [];
  const ccx = Math.floor(car.x / CS), ccy = Math.floor(car.y / CS);
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const c = chunks.get(ckey(ccx + dx, ccy + dy));
    if (!c || !c.done) continue;
    for (const o of c.statics) if (Math.abs(o.x - car.x) < o.r + 80 && Math.abs(o.y - car.y) < o.r + 80) nearStatics.push(o);
    for (const o of c.dyn) if (Math.abs(o.x - car.x) < 120 && Math.abs(o.y - car.y) < 120) nearDyn.push(o);
  }
  updateZone();
}

function updateZone() {
  let zone = null, zd = Infinity;
  const ccx = Math.floor(car.x / CS), ccy = Math.floor(car.y / CS);
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const c = chunks.get(ckey(ccx + dx, ccy + dy));
    if (!c || !c.done) continue;
    for (const z of c.crossings) {
      const d = Math.hypot(car.x - z.x, car.y - z.y);
      if (d < z.R && d < zd) { zone = z; zd = d; }
    }
  }
  if (zone === car.zone) return;
  car.zone = zone;
  car.upper = !!zone && segNearest(zone.upV, car.x, car.y).d < zone.up.half + zone.up.sh;
}

// Oben: Geländer halten das Auto auf der Brückenfahrbahn.
// Unten: die Rampen/Widerlager der oberen Straße sind Wände, frei bleibt nur der Korridor der unteren Straße.
function crossingWalls() {
  const z = car.zone, up = z.up, lo = z.lo;
  const fx = Math.cos(car.a), fy = Math.sin(car.a);
  for (const off of COFF) {
    const px = car.x + fx * off, py = car.y + fy * off;
    const U = segNearest(z.upV, px, py);
    const dU = U.d, ux = U.x, uy = U.y;
    if (car.upper) {
      const lim = up.half + 1 - CR;
      if (dU > lim) resolveStatic(px, py, (ux - px) / dU, (uy - py) / dU, dU - lim, 0.2, 0.01);
      continue;
    }
    const wall = up.half + 2 + CR;
    if (dU >= wall) continue;
    const L = segNearest(z.loV, px, py);
    const corr = lo.half + lo.sh + UNDERPASS_CLEAR - CR;
    if (L.d <= corr) continue;
    const penU = wall - dU, penL = L.d - corr;
    if (penU < penL && dU > 1e-3) resolveStatic(px, py, (px - ux) / dU, (py - uy) / dU, penU, 0.25, 0.01);
    else resolveStatic(px, py, (L.x - px) / L.d, (L.y - py) / L.d, penL, 0.25, 0.01);
  }
}

let shake = 0;
let impactAcc = 0;

function physics(dt) {
  const fx = Math.cos(car.a), fy = Math.sin(car.a), rx = -fy, ry = fx;

  let G = 0, A = 0, T = 0, Dr = 0, B = 0;
  for (let i = 0; i < 4; i++) {
    const w = WHEELS[i];
    let s = surfAtFast(car.x + fx * w[0] + rx * w[1], car.y + fy * w[0] + ry * w[1]);
    if (SURF[s].solid) s = s === S_DEEP ? S_SHALLOW : S_ROCK;
    car.ws[i] = s;
    const p = SURF[s];
    G += p.grip; A += p.accel; T += p.top; Dr += p.drag; B += p.brake;
  }
  G /= 4; A /= 4; T /= 4; Dr /= 4; B /= 4;

  let vf = car.vx * fx + car.vy * fy;
  let vl = car.vx * rx + car.vy * ry;

  const steerIn = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  car.steer += (steerIn - car.steer) * Math.min(1, dt * 7);

  car.braking = false; car.throttle = 0;
  if (keys.up) {
    if (vf < -10) { brake(); }
    else {
      const lim = TOP * T;
      if (vf < lim) vf = Math.min(lim, vf + ACC * A * dt * Math.max(0.15, 1 - Math.max(0, vf) / lim));
      car.throttle = 1;
    }
  }
  if (keys.down) {
    if (vf > 10) { brake(); }
    else {
      const lim = REV_TOP * T;
      if (-vf < lim) vf = Math.max(-lim, vf - REV_ACC * A * dt * Math.max(0.15, 1 - Math.max(0, -vf) / lim));
      car.throttle = -1;
    }
  }
  function brake() {
    const dec = BRAKE * B * dt;
    vf = Math.abs(vf) <= dec ? 0 : vf - Math.sign(vf) * dec;
    car.braking = true;
  }

  vf -= vf * Dr * dt;
  if (!keys.up && !keys.down) {
    const c = 35 * dt;
    vf = Math.abs(vf) < c ? 0 : vf - Math.sign(vf) * c;
  }

  let grip = G;
  if (keys.hand) {
    grip *= 0.22;
    const c = 170 * B * dt;
    vf = Math.abs(vf) < c ? 0 : vf - Math.sign(vf) * c;
  }
  vl *= Math.exp(-grip * dt);

  const sf = clamp(vf / 90, -1, 1);
  let desired = car.steer * 2.7 * sf / (1 + Math.abs(vf) / 650);
  if (keys.hand) desired *= 1.5;
  car.w += (desired - car.w) * Math.min(1, (2 + G * 1.1) * dt);
  car.a += car.w * dt;

  car.vx = fx * vf + rx * vl;
  car.vy = fy * vf + ry * vl;
  car.x += car.vx * dt;
  car.y += car.vy * dt;

  collide();

  const nfx = Math.cos(car.a), nfy = Math.sin(car.a);
  car.vf = car.vx * nfx + car.vy * nfy;
  car.vl = car.vx * -nfy + car.vy * nfx;
  car.reversing = car.throttle < 0 && car.vf < 0;
}

// Stoß zwischen Auto (Kollisionskreis bei px,py) und unbeweglichem Hindernis; n zeigt vom Hindernis zum Auto
function resolveStatic(px, py, nx, ny, pen, e, fric = 0.08) {
  car.x += nx * pen; car.y += ny * pen;
  const ox = px - car.x, oy = py - car.y;
  const vpx = car.vx - car.w * oy, vpy = car.vy + car.w * ox;
  const vn = vpx * nx + vpy * ny;
  if (vn >= 0) return;
  const rn = ox * ny - oy * nx;
  const j = -(1 + e) * vn / (1 + rn * rn * INV_I);
  car.vx += j * nx; car.vy += j * ny;
  car.w += rn * j * INV_I;
  const tx = -ny, ty = nx, vt = car.vx * tx + car.vy * ty;
  car.vx -= tx * vt * fric; car.vy -= ty * vt * fric;
  impactAcc = Math.max(impactAcc, -vn);
}

function collide() {
  if (car.zone) crossingWalls();
  if (car.upper) return; // auf der Brücke gibt es nichts, woran man stoßen könnte
  const fx = Math.cos(car.a), fy = Math.sin(car.a);
  for (const off of COFF) {
    const px = car.x + fx * off, py = car.y + fy * off;

    for (const o of nearStatics) {
      if (o.t === 'house') {
        const qx = clamp(px, o.x - o.w / 2, o.x + o.w / 2), qy = clamp(py, o.y - o.h / 2, o.y + o.h / 2);
        let dx = px - qx, dy = py - qy, d = Math.hypot(dx, dy);
        if (d >= CR) continue;
        if (d < 1e-4) { // Mittelpunkt im Haus: über die nächste Kante hinausschieben
          const l = px - (o.x - o.w / 2), r = (o.x + o.w / 2) - px, t = py - (o.y - o.h / 2), b = (o.y + o.h / 2) - py;
          const m = Math.min(l, r, t, b);
          if (m === l) resolveStatic(px, py, -1, 0, l + CR, .3);
          else if (m === r) resolveStatic(px, py, 1, 0, r + CR, .3);
          else if (m === t) resolveStatic(px, py, 0, -1, t + CR, .3);
          else resolveStatic(px, py, 0, 1, b + CR, .3);
        } else resolveStatic(px, py, dx / d, dy / d, CR - d, .3);
      } else {
        const rr = o.t === 'tree' || o.t === 'pine' ? o.r * 0.7 : o.t === 'bush' ? o.r * 0.8 : o.r * 0.9;
        const dx = px - o.x, dy = py - o.y, d = Math.hypot(dx, dy), md = CR + rr;
        if (d < md && d > 1e-4) resolveStatic(px, py, dx / d, dy / d, md - d, o.t === 'bush' ? .1 : .35);
      }
    }

    for (const o of nearDyn) {
      const dx = o.x - px, dy = o.y - py, d = Math.hypot(dx, dy), md = CR + o.r;
      if (d >= md || d < 1e-4) continue;
      const nx = dx / d, ny = dy / d, pen = md - d, tm = 1 + o.m;
      o.x += nx * pen / tm; o.y += ny * pen / tm;
      car.x -= nx * pen * o.m / tm; car.y -= ny * pen * o.m / tm;
      const ox = px - car.x, oy = py - car.y;
      const vpx = car.vx - car.w * oy, vpy = car.vy + car.w * ox;
      const vrel = (o.vx - vpx) * nx + (o.vy - vpy) * ny;
      if (vrel < 0) {
        const j = -1.5 * vrel / (1 / o.m + 1);
        o.vx += j * nx / o.m; o.vy += j * ny / o.m;
        o.va += (Math.random() - .5) * j / o.m * 0.08;
        car.vx -= j * nx; car.vy -= j * ny;
      }
    }

    // tiefes Wasser, dichter Wald und Felswände sind undurchdringlich
    if (SURF[surfAtFast(px, py)].solid) {
      let nx = 0, ny = 0;
      for (let k = 0; k < 8; k++) {
        const a = k / 8 * TAU, ax = Math.cos(a), ay = Math.sin(a);
        if (!SURF[surfAtFast(px + ax * 18, py + ay * 18)].solid) { nx += ax; ny += ay; }
      }
      let l = Math.hypot(nx, ny);
      if (l < 1e-4) { nx = -car.vx; ny = -car.vy; l = Math.hypot(nx, ny) || 1; }
      resolveStatic(px, py, nx / l, ny / l, 2.5, .2);
    }
  }
}

function updateDyn(dt) {
  const ccx = Math.floor(car.x / CS), ccy = Math.floor(car.y / CS);
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
    const c = chunks.get(ckey(ccx + dx, ccy + dy));
    if (!c || !c.done) continue;
    for (const o of c.dyn) {
      if (Math.abs(o.vx) + Math.abs(o.vy) + Math.abs(o.va) < 0.5) continue;
      o.x += o.vx * dt; o.y += o.vy * dt; o.a += o.va * dt;
      const f = Math.exp(-2.6 * dt);
      o.vx *= f; o.vy *= f; o.va *= Math.exp(-2 * dt);
      for (const s of c.statics) {
        if (s.t === 'house') continue;
        const ddx = o.x - s.x, ddy = o.y - s.y, d = Math.hypot(ddx, ddy), md = o.r + s.r * 0.75;
        if (d < md && d > 1e-4) {
          const nx = ddx / d, ny = ddy / d;
          o.x += nx * (md - d); o.y += ny * (md - d);
          const vn = o.vx * nx + o.vy * ny;
          if (vn < 0) { o.vx -= 1.4 * vn * nx; o.vy -= 1.4 * vn * ny; }
        }
      }
    }
  }
}

// ---------- Spuren & Partikel ----------
function stamp(x0, y0, x1, y1, color, w) {
  const minx = Math.min(x0, x1) - w, maxx = Math.max(x0, x1) + w;
  const miny = Math.min(y0, y1) - w, maxy = Math.max(y0, y1) + w;
  for (let cy = Math.floor(miny / CS); cy <= Math.floor(maxy / CS); cy++) {
    for (let cx = Math.floor(minx / CS); cx <= Math.floor(maxx / CS); cx++) {
      const c = chunks.get(ckey(cx, cy));
      if (!c || !c.done) continue;
      const g = c.ctx, ox = cx * CS, oy = cy * CS;
      g.strokeStyle = color; g.lineWidth = w; g.lineCap = 'butt';
      g.beginPath(); g.moveTo(x0 - ox, y0 - oy); g.lineTo(x1 - ox, y1 - oy); g.stroke();
    }
  }
}

const particles = [];
function emit(x, y, vx, vy, color, size, life) {
  if (particles.length > 600) particles.shift();
  particles.push({ x, y, vx, vy, color, size, life, max: life });
}

function effects(dt) {
  const fx = Math.cos(car.a), fy = Math.sin(car.a), rx = -fy, ry = fx;
  const speed = Math.hypot(car.vx, car.vy);
  const slipping = Math.abs(car.vl) > 70 || (keys.hand && speed > 60) ||
                   (car.braking && speed > 120 && SURF[car.ws[2]].brake < .6);
  for (let i = 0; i < 4; i++) {
    const w = WHEELS[i];
    const x = car.x + fx * w[0] + rx * w[1], y = car.y + fy * w[0] + ry * w[1];
    const p = SURF[car.ws[i]];
    const prev = car.prevW[i];
    if (prev && Math.hypot(x - prev[0], y - prev[1]) < 60) {
      if (p.track && speed > 4) stamp(prev[0], prev[1], x, y, p.track, 4);
      else if (p.skid && (slipping || (car.braking && speed > 200 && i >= 2))) stamp(prev[0], prev[1], x, y, p.skid, 4);
    }
    car.prevW[i] = [x, y];

    if (i < 2) continue; // Partikel nur an den Hinterrädern
    const spin = car.throttle !== 0 && speed < 140 && p.accel < 0.7;
    let rate = 0;
    if (p.splash && speed > 30) rate = speed / 8;
    else if (p.smoke && slipping) rate = 30;
    else if (p.dust && !p.dustSlipOnly && speed > 50) rate = speed / 18 + (spin ? 20 : 0);
    else if (p.dust && (slipping || spin) && speed > 20) rate = 18;
    if (rate > 0 && Math.random() < rate * dt) {
      const col = p.smoke ? 'rgba(210,210,214,' : p.dust;
      const back = -0.25 - Math.random() * .3;
      emit(x, y, car.vx * back + (Math.random() - .5) * 60, car.vy * back + (Math.random() - .5) * 60,
           col, p.splash ? 3 + Math.random() * 3 : 4 + Math.random() * 5, .5 + Math.random() * .6);
    }
  }

  if (impactAcc > 40) {
    shake = Math.max(shake, Math.min(10, impactAcc / 50));
    for (let k = 0; k < Math.min(14, impactAcc / 20); k++) {
      const a = Math.random() * TAU, s = 30 + Math.random() * 80;
      emit(car.x + fx * 20, car.y + fy * 20, Math.cos(a) * s, Math.sin(a) * s, 'rgba(240,235,220,', 3 + Math.random() * 3, .4);
    }
  }
  impactAcc = 0;

  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.life -= dt;
    if (q.life <= 0) { particles.splice(i, 1); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt;
    const f = Math.exp(-3 * dt); q.vx *= f; q.vy *= f;
    q.size += dt * 6;
  }
}

// ---------- Kamera ----------
const cam = { x: 0, y: 0, z: 1 };
function baseZoom() { return clamp(Math.min(W, H) / 820, 0.55, 1.25); }
function updateCamera(dt) {
  const tx = car.x + car.vx * 0.35, ty = car.y + car.vy * 0.35;
  const k = Math.min(1, dt * 4);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
  const sp = Math.hypot(car.vx, car.vy);
  const tz = baseZoom() * (1.08 - 0.3 * clamp(sp / TOP, 0, 1));
  cam.z += (tz - cam.z) * Math.min(1, dt * 1.5);
  shake *= Math.exp(-8 * dt);
}

// ---------- Zeichnen ----------
const SHADOW_H = { tree: 8, pine: 9, cactus: 5, bush: 3, rock: 3, stump: 2, cone: 2, barrel: 3, crate: 3, bale: 4 };
const HIGH = { tree: 1, pine: 1, house: 1, cactus: 1 };

function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }

function drawShadow(o) {
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  if (o.t === 'house') { ctx.fillRect(o.x - o.w / 2 + 8, o.y - o.h / 2 + 10, o.w, o.h); return; }
  const h = SHADOW_H[o.t] || 3;
  ctx.beginPath(); ctx.ellipse(o.x + h, o.y + h * 1.3, o.r, o.r * 0.95, 0, 0, TAU); ctx.fill();
}

function drawStatic(o) {
  switch (o.t) {
    case 'tree': {
      ctx.fillStyle = o.c1;
      circle(o.x, o.y, o.r * .62);
      for (const b of o.blobs) circle(o.x + b[0], o.y + b[1], b[2]);
      ctx.fillStyle = o.c2;
      for (const b of o.blobs) circle(o.x + b[0] * .8 - o.r * .12, o.y + b[1] * .8 - o.r * .14, b[2] * .62);
      ctx.fillStyle = o.c3;
      circle(o.x - o.r * .3, o.y - o.r * .32, o.r * .28);
      break;
    }
    case 'pine': {
      const star = (r, rot, col) => {
        ctx.fillStyle = col; ctx.beginPath();
        for (let i = 0; i < 16; i++) {
          const a = rot + i / 16 * TAU, rr = i % 2 ? r * .62 : r;
          i ? ctx.lineTo(o.x + Math.cos(a) * rr, o.y + Math.sin(a) * rr) : ctx.moveTo(o.x + Math.cos(a) * rr, o.y + Math.sin(a) * rr);
        }
        ctx.closePath(); ctx.fill();
      };
      star(o.r, 0, '#24503a'); star(o.r * .68, .2, '#2f6647'); star(o.r * .36, .4, '#3d7a55');
      if (o.snow) { ctx.fillStyle = 'rgba(255,255,255,0.85)';
        for (const b of o.blobs) circle(o.x + b[0] * .9, o.y + b[1] * .9, 2.2);
        circle(o.x - 1, o.y - 1, 2.5); }
      break;
    }
    case 'bush': {
      ctx.fillStyle = o.dead ? '#6b5a3c' : o.heath ? '#7a5a7e' : '#3f7a3a';
      circle(o.x - o.r * .35, o.y, o.r * .7); circle(o.x + o.r * .35, o.y + o.r * .1, o.r * .65); circle(o.x, o.y - o.r * .35, o.r * .65);
      ctx.fillStyle = o.dead ? '#86724d' : o.heath ? '#a57aa8' : '#579a4c';
      circle(o.x - o.r * .2, o.y - o.r * .4, o.r * .35);
      break;
    }
    case 'rock': {
      const poly = (s, dx, dy) => {
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const a = i / 8 * TAU, rr = o.r * o.pts[i] * s;
          i ? ctx.lineTo(o.x + dx + Math.cos(a) * rr, o.y + dy + Math.sin(a) * rr) : ctx.moveTo(o.x + dx + Math.cos(a) * rr, o.y + dy + Math.sin(a) * rr);
        }
        ctx.closePath(); ctx.fill();
      };
      ctx.fillStyle = o.c1; poly(1, 0, 0);
      ctx.fillStyle = o.c2; poly(.55, -o.r * .18, -o.r * .2);
      break;
    }
    case 'cactus': {
      ctx.fillStyle = '#3e8a4c';
      const ax = Math.cos(o.arms) * o.r, ay = Math.sin(o.arms) * o.r;
      circle(o.x + ax, o.y + ay, o.r * .45); circle(o.x - ax * .9, o.y - ay * .9, o.r * .4);
      circle(o.x, o.y, o.r);
      ctx.fillStyle = '#5aab62'; circle(o.x - o.r * .2, o.y - o.r * .2, o.r * .55);
      ctx.fillStyle = '#e9e3c4';
      for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; ctx.fillRect(o.x + Math.cos(a) * o.r * .7, o.y + Math.sin(a) * o.r * .7, 1.2, 1.2); }
      break;
    }
    case 'stump': {
      ctx.fillStyle = '#5a3d24'; circle(o.x, o.y, o.r);
      ctx.fillStyle = '#b89062'; circle(o.x, o.y, o.r * .75);
      ctx.strokeStyle = '#8c6a44'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r * .45, 0, TAU); ctx.stroke();
      break;
    }
    case 'house': {
      const x0 = o.x - o.w / 2, y0 = o.y - o.h / 2;
      if (o.w >= o.h) {
        ctx.fillStyle = o.c1; ctx.fillRect(x0, y0, o.w, o.h / 2);
        ctx.fillStyle = o.c2; ctx.fillRect(x0, o.y, o.w, o.h / 2);
      } else {
        ctx.fillStyle = o.c1; ctx.fillRect(x0, y0, o.w / 2, o.h);
        ctx.fillStyle = o.c2; ctx.fillRect(o.x, y0, o.w / 2, o.h);
      }
      ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2;
      ctx.beginPath();
      if (o.w >= o.h) { ctx.moveTo(x0, o.y); ctx.lineTo(x0 + o.w, o.y); } else { ctx.moveTo(o.x, y0); ctx.lineTo(o.x, y0 + o.h); }
      ctx.stroke();
      ctx.strokeRect(x0, y0, o.w, o.h);
      ctx.fillStyle = '#6d5e55';
      ctx.fillRect(o.x + (o.chim - .5) * o.w * .6 - 4, o.y - o.h * .3 - 4, 8, 8);
      break;
    }
  }
}

function drawDyn(o) {
  ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.a);
  switch (o.t) {
    case 'cone':
      ctx.fillStyle = '#d4601a'; ctx.fillRect(-6, -6, 12, 12);
      ctx.fillStyle = o.c; circle(0, 0, 5);
      ctx.fillStyle = '#fff'; circle(0, 0, 3.2);
      ctx.fillStyle = o.c; circle(0, 0, 1.8);
      break;
    case 'barrel':
      ctx.fillStyle = o.c; circle(0, 0, o.r);
      ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 0, o.r * .7, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.3)'; circle(-o.r * .3, -o.r * .3, o.r * .25);
      break;
    case 'crate':
      ctx.fillStyle = o.c; ctx.fillRect(-9, -9, 18, 18);
      ctx.strokeStyle = '#6e4a22'; ctx.lineWidth = 2;
      ctx.strokeRect(-8, -8, 16, 16);
      ctx.beginPath(); ctx.moveTo(-8, -8); ctx.lineTo(8, 8); ctx.moveTo(8, -8); ctx.lineTo(-8, 8); ctx.stroke();
      break;
    case 'bale':
      ctx.fillStyle = o.c; circle(0, 0, o.r);
      ctx.strokeStyle = '#b39443'; ctx.lineWidth = 1.2;
      for (const r of [.3, .55, .8]) { ctx.beginPath(); ctx.arc(0, 0, o.r * r, 0, TAU); ctx.stroke(); }
      break;
  }
  ctx.restore();
}

// Das Deck kann über mehrere Segmente der oberen Straße reichen, daher Auswahl über den Abstand zur Kreuzung
function drawDeck(z) {
  const segs = z.upV.map(v => v.seg);
  const preds = segs.map(s => k => Math.hypot(s.xs[k] - z.x, s.ys[k] - z.y) <= z.span);
  ctx.lineJoin = 'round'; ctx.lineCap = 'butt';
  ctx.save(); ctx.translate(12, 15);
  segs.forEach((s, i) => polyLine(ctx, s, 0, s.half * 2 + 8, 'rgba(0,0,0,0.32)', null, preds[i]));
  ctx.restore();
  // Auffahrten neu zeichnen, damit der Schatten nicht auf die eigene Straße fällt
  const ramps = segs.map(s => k => { const d = Math.hypot(s.xs[k] - z.x, s.ys[k] - z.y); return d > z.span - 16 && d < z.span + 40; });
  segs.forEach((s, i) => { if (s.sh) polyLine(ctx, s, 0, (s.half + s.sh) * 2, '#9a8c74', null, ramps[i]); });
  segs.forEach((s, i) => polyLine(ctx, s, 0, s.half * 2, s.col, null, ramps[i]));
  segs.forEach((s, i) => drawMarkings(ctx, s, ramps[i]));
  segs.forEach((s, i) => polyLine(ctx, s, 0, (s.half + 4) * 2, '#8b8e94', null, preds[i])); // Brückenkante (Beton)
  segs.forEach((s, i) => polyLine(ctx, s, 0, s.half * 2, s.col, null, preds[i]));
  segs.forEach((s, i) => drawMarkings(ctx, s, preds[i]));
  segs.forEach((s, i) => {                                                                  // Geländer
    polyLine(ctx, s, -(s.half + 2.5), 3, '#dcd6c8', null, preds[i]);
    polyLine(ctx, s, s.half + 2.5, 3, '#dcd6c8', null, preds[i]);
  });
  ctx.setLineDash([]);
}

function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }

function drawCar() {
  const col = CAR_COLORS[car.color];
  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.save(); ctx.translate(4, 5); ctx.rotate(car.a); rrect(-24, -13, 48, 26, 7); ctx.restore();

  ctx.rotate(car.a);
  ctx.fillStyle = '#16181c';
  for (let i = 0; i < 4; i++) {
    const [wx, wy] = WHEELS[i];
    ctx.save(); ctx.translate(wx, wy * 1.1);
    if (i < 2) ctx.rotate(car.steer * 0.5);
    ctx.fillRect(-5.5, -3, 11, 6);
    ctx.restore();
  }
  ctx.fillStyle = col; rrect(-23, -12, 46, 24, 7);
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; rrect(-21, -10, 42, 7, 4);
  ctx.fillStyle = '#20303e';
  ctx.beginPath(); ctx.moveTo(5, -10); ctx.lineTo(12, -8); ctx.lineTo(12, 8); ctx.lineTo(5, 10); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-11, -9); ctx.lineTo(-15, -8); ctx.lineTo(-15, 8); ctx.lineTo(-11, 9); ctx.closePath(); ctx.fill();
  ctx.fillStyle = col; rrect(-11, -9, 16, 18, 3);
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; rrect(-10, -8, 14, 6, 2);
  ctx.fillStyle = '#fff6c8';
  ctx.fillRect(20, -10, 3, 5); ctx.fillRect(20, 5, 3, 5);
  const rear = car.braking ? '#ff2a1a' : car.reversing ? '#ffffff' : '#7a1810';
  if (car.braking || car.reversing) {
    ctx.fillStyle = car.braking ? 'rgba(255,40,20,0.35)' : 'rgba(255,255,255,0.3)';
    circle(-25, -7, 6); circle(-25, 7, 6);
  }
  ctx.fillStyle = rear;
  ctx.fillRect(-23, -10, 2.5, 5); ctx.fillRect(-23, 5, 2.5, 5);
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#1b1d22';
  ctx.fillRect(0, 0, cv.width, cv.height);
  const z = cam.z * DPR;
  const sx = (Math.random() - .5) * shake, sy = (Math.random() - .5) * shake;
  ctx.setTransform(z, 0, 0, z, cv.width / 2 - (cam.x + sx) * z, cv.height / 2 - (cam.y + sy) * z);
  ctx.imageSmoothingEnabled = false;

  const [x0, y0, x1, y1] = viewBounds(4);
  for (let cy = Math.floor(y0 / CS); cy <= Math.floor(y1 / CS); cy++) {
    for (let cx = Math.floor(x0 / CS); cx <= Math.floor(x1 / CS); cx++) {
      const c = chunks.get(ckey(cx, cy));
      if (c && c.done) ctx.drawImage(c.canvas, cx * CS, cy * CS, CS + 1, CS + 1);
      else { ctx.fillStyle = c ? c.fallback : '#555'; ctx.fillRect(cx * CS, cy * CS, CS + 1, CS + 1); }
    }
  }

  const lows = [], highs = [], dyns = [];
  const [bx0, by0, bx1, by1] = viewBounds(110);
  for (let cy = Math.floor(by0 / CS); cy <= Math.floor(by1 / CS); cy++) {
    for (let cx = Math.floor(bx0 / CS); cx <= Math.floor(bx1 / CS); cx++) {
      const c = chunks.get(ckey(cx, cy));
      if (!c || !c.done) continue;
      for (const o of c.statics) if (o.x > x0 - 100 && o.x < x1 + 100 && o.y > y0 - 100 && o.y < y1 + 100) (HIGH[o.t] ? highs : lows).push(o);
      for (const o of c.dyn) if (o.x > x0 - 30 && o.x < x1 + 30 && o.y > y0 - 30 && o.y < y1 + 30) dyns.push(o);
    }
  }
  for (const o of lows) drawShadow(o);
  for (const o of dyns) drawShadow(o);
  for (const o of highs) drawShadow(o);
  for (const o of lows) drawStatic(o);
  for (const o of dyns) drawDyn(o);
  if (!car.upper) drawCar();
  const decks = new Set();
  for (let cy = Math.floor(by0 / CS); cy <= Math.floor(by1 / CS); cy++) {
    for (let cx = Math.floor(bx0 / CS); cx <= Math.floor(bx1 / CS); cx++) {
      const c = chunks.get(ckey(cx, cy));
      if (c && c.done) for (const z of c.crossings) decks.add(z);
    }
  }
  for (const z of decks) drawDeck(z);
  if (car.upper) drawCar();
  for (const q of particles) {
    ctx.fillStyle = q.color + (0.55 * q.life / q.max).toFixed(3) + ')';
    circle(q.x, q.y, q.size);
  }
  for (const o of highs) drawStatic(o);
}

// ---------- Minikarte ----------
const mapCv = document.getElementById('map');
const mctx = mapCv.getContext('2d');
const MAP_N = 90, MAP_R = 1500, MAP_CELL = MAP_R * 2 / MAP_N;
const mapBuf = new ImageData(MAP_N, MAP_N);
const mapShown = document.createElement('canvas');
mapShown.width = mapShown.height = MAP_N;
let mapRow = 0, mapCX = 0, mapCY = 0, shownCX = 0, shownCY = 0, mapReady = false;

let mapRoads = [];
const MAP_ROAD_STYLE = { track: [1, '#7d6444'], lane: [1.5, '#d6d6cf'], road: [2, '#f4f4ef'], hw: [3.5, '#f2c14e'] };

function mapWork(rows) {
  if (mapRow === 0) {
    mapCX = car.x; mapCY = car.y;
    mapRoads = segsNear(car.x - MAP_R - 300, car.y - MAP_R - 300, car.x + MAP_R + 300, car.y + MAP_R + 300);
  }
  const d = mapBuf.data;
  for (let n = 0; n < rows && mapRow < MAP_N; n++, mapRow++) {
    const wy = mapCY - MAP_R + (mapRow + .5) * MAP_CELL;
    for (let i = 0; i < MAP_N; i++) {
      const p = SURF[surfaceAt(mapCX - MAP_R + (i + .5) * MAP_CELL, wy, NO_ROADS)].rgb;
      const o = (mapRow * MAP_N + i) * 4;
      d[o] = p[0]; d[o + 1] = p[1]; d[o + 2] = p[2]; d[o + 3] = 255;
    }
  }
  if (mapRow >= MAP_N) {
    mapShown.getContext('2d').putImageData(mapBuf, 0, 0);
    shownCX = mapCX; shownCY = mapCY; mapRow = 0; mapReady = true;
  }
}

function drawMap() {
  const S = mapCv.width;
  mctx.fillStyle = '#2a2d33'; mctx.fillRect(0, 0, S, S);
  if (mapReady) {
    const k = S / (MAP_R * 2);
    mctx.imageSmoothingEnabled = false;
    mctx.drawImage(mapShown, (shownCX - car.x) * k, (shownCY - car.y) * k, S, S);
  }
  const k = S / (MAP_R * 2);
  mctx.lineJoin = 'round'; mctx.lineCap = 'round';
  for (const v of mapRoads) {
    const s = v.seg, st = MAP_ROAD_STYLE[s.type];
    mctx.lineWidth = st[0]; mctx.strokeStyle = st[1];
    mctx.beginPath();
    for (let q = v.i0; q <= v.i1; q += 3) {
      const x = (s.xs[q] - car.x) * k + S / 2, y = (s.ys[q] - car.y) * k + S / 2;
      q === v.i0 ? mctx.moveTo(x, y) : mctx.lineTo(x, y);
    }
    mctx.lineTo((s.xs[v.i1] - car.x) * k + S / 2, (s.ys[v.i1] - car.y) * k + S / 2);
    mctx.stroke();
  }
  mctx.save(); mctx.translate(S / 2, S / 2); mctx.rotate(car.a);
  mctx.fillStyle = CAR_COLORS[car.color]; mctx.strokeStyle = '#000'; mctx.lineWidth = 1.5;
  mctx.beginPath(); mctx.moveTo(8, 0); mctx.lineTo(-6, -5.5); mctx.lineTo(-3, 0); mctx.lineTo(-6, 5.5); mctx.closePath();
  mctx.stroke(); mctx.fill();
  mctx.restore();
}

// ---------- HUD ----------
const elSpd = document.getElementById('spd'), elGear = document.getElementById('gear');
const elSurf = document.getElementById('surfName'), elSw = document.getElementById('swatch');
let hudName = '';
function updateHud() {
  elSpd.textContent = Math.round(Math.abs(car.vf) * KMH);
  elGear.textContent = car.vf < -5 ? 'R' : car.vf > 5 ? 'D' : 'N';
  if (frameNo % 8) return;
  const s = surfAtFast(car.x, car.y);
  const R = roadQuery(car.x, car.y, segsNear(car.x, car.y, car.x, car.y));
  let name = SURF[s].name, col = SURF[s].rgb;
  let road = R.seg && R.edge < 0 ? R.seg : null, extra = s === S_BRIDGE ? ' · Brücke' : '';
  const z = car.zone;
  if (z && car.upper) { road = z.up; extra = ' · Überführung'; }
  else if (z && segNearest(z.loV, car.x, car.y).d < z.lo.half &&
           segNearest(z.upV, car.x, car.y).d < z.up.half) { road = z.lo; extra = ' · Unterführung'; }
  if (road) {
    name = (road.mtn && road.net === 1 ? 'Gebirgsstraße' : RT[road.type].name) + extra;
    col = road.type === 'track' ? SURF[S_GRAVEL].rgb : [86, 88, 94];
  }
  if (name !== hudName) {
    hudName = name;
    elSurf.textContent = name;
    elSw.style.background = `rgb(${col[0]},${col[1]},${col[2]})`;
  }
}

// ---------- Welt ----------
// Start auf dem rechten Fahrstreifen der nächstgelegenen Landstraße
function findSpawn() {
  for (let r = 1500; r < 60000; r *= 1.6) {
    let best = null, bd = Infinity;
    for (const v of segsNear(-r, -r, r, r)) {
      const s = v.seg;
      if (s.type !== 'road') continue;
      for (let k = Math.max(v.i0, 4); k <= Math.min(v.i1, s.n - 5); k++) {
        if (s.water[k]) continue;
        const d = s.xs[k] * s.xs[k] + s.ys[k] * s.ys[k];
        if (d < bd) { bd = d; best = [s, k]; }
      }
    }
    if (best) {
      const [s, k] = best;
      return { x: s.xs[k] + s.nx[k] * LANE / 2, y: s.ys[k] + s.ny[k] * LANE / 2, a: Math.atan2(-s.nx[k], s.ny[k]) };
    }
  }
  return { x: 0, y: 0, a: 0 };
}

function newWorld(seed) {
  SEED = seed;
  history.replaceState(null, '', '#' + seed);
  document.getElementById('seed').textContent = seed;
  chunks.clear();
  segCache.clear();
  crossCache.clear();
  allCrossings.length = 0;
  car.zone = null; car.upper = false;
  particles.length = 0;
  spawn = findSpawn();
  Object.assign(car, { x: spawn.x, y: spawn.y, a: spawn.a, vx: 0, vy: 0, w: 0, steer: 0, vf: 0, vl: 0 });
  car.prevW = [null, null, null, null];
  cam.x = car.x; cam.y = car.y; cam.z = baseZoom();
  mapRow = 0; mapReady = false;
  ensureChunks();
  workChunks(Infinity);
  mapWork(MAP_N);
}

// ---------- Hauptschleife ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  frameNo++;

  gatherNearby();
  const steps = Math.max(1, Math.ceil(dt * 120));
  for (let i = 0; i < steps; i++) physics(dt / steps);
  updateDyn(dt);
  effects(dt);
  updateCamera(dt);

  ensureChunks();
  workChunks(6);
  mapWork(6);

  render();
  drawMap();
  updateHud();
  requestAnimationFrame(frame);
}

const hashSeed = parseInt(location.hash.slice(1), 10);
newWorld(hashSeed > 0 ? hashSeed : Math.floor(Math.random() * 999999) + 1);
requestAnimationFrame(frame);
</script>
