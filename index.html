<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kleiner Flitzer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d22; color: #f1f1ee;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas#game { display: block; width: 100vw; height: 100vh; }
  .panel { position: fixed; background: rgba(20, 22, 28, 0.72); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); user-select: none; }
  #dash { left: 16px; top: 16px; padding: 12px 16px; min-width: 150px; }
  #spd { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  #dash small { opacity: .6; margin-left: 4px; font-size: 13px; }
  #gear { float: right; margin-left: 14px; font-size: 18px; font-weight: 700; padding: 2px 8px; border-radius: 6px;
    background: rgba(255,255,255,0.1); }
  #surf { margin-top: 10px; font-size: 14px; display: flex; align-items: center; gap: 8px; opacity: .9; }
  #swatch { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3); display: inline-block; }
  #place { margin-top: 4px; font-size: 13px; color: #ffd36b; min-height: 0; }
  #place:empty { display: none; }
  #cartype { margin-top: 6px; font-size: 12px; opacity: .75; }
  #assist { margin-top: 3px; font-size: 12px; color: #7be3a0; }
  #assist:empty { display: none; }
  #mapWrap { right: 16px; top: 16px; padding: 8px; }
  #map { display: block; width: 180px; height: 180px; border-radius: 9px; }
  #seedRow { font-size: 12px; opacity: .65; text-align: center; margin-top: 6px; }
  #help { left: 16px; bottom: 16px; padding: 10px 14px; font-size: 13px; line-height: 1.6; }
  #help b { display: inline-block; min-width: 74px; color: #ffd36b; font-weight: 600; }
  #help.hidden { display: none; }
  #intro { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;
    transition: opacity .8s; }
  #intro div { text-align: center; background: rgba(20,22,28,0.78); padding: 22px 34px; border-radius: 18px; }
  #intro h1 { margin: 0 0 6px; font-size: 34px; letter-spacing: .5px; }
  #intro p { margin: 0; opacity: .75; }
  @media (max-width: 640px) { #mapWrap { transform: scale(.7); transform-origin: top right; } #help { display: none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="dash" class="panel">
  <span id="gear">N</span><span id="spd">0</span><small>km/h</small>
  <div id="surf"><i id="swatch"></i><span id="surfName">–</span></div>
  <div id="place"></div>
  <div id="cartype"></div>
  <div id="assist"></div>
</div>

<div id="mapWrap" class="panel">
  <canvas id="map" width="180" height="180"></canvas>
  <div id="seedRow">Welt #<span id="seed"></span></div>
</div>

<div id="help" class="panel">
  <div><b>↑ / W</b>Gas</div>
  <div><b>↓ / S</b>Bremsen / Rückwärts</div>
  <div><b>← → / A D</b>Lenken</div>
  <div><b>Leertaste</b>Handbremse</div>
  <div><b>R</b>Neue Welt &nbsp; <b style="min-width:0">C</b> Fahrzeug &nbsp; <b style="min-width:0">H</b> Hilfe</div>
  <div><b>M</b>Sonderfunktion &nbsp; <b style="min-width:0">E</b> Schleudersitz (007)</div>
  <div><b>N</b>Nacht an/aus &nbsp; <b style="min-width:0">L</b> Spurhalteassistent</div>
</div>

<div id="intro"><div><h1>Kleiner Flitzer</h1><p>Drück eine Taste und fahr los</p></div></div>

<script>
'use strict';

// ---------- Setup ----------
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
}
addEventListener('resize', resize);
resize();

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---------- Noise ----------
let SEED = 1;
function hash(ix, iy, s) {
  let h = Math.imul(ix, 374761393) ^ Math.imul(iy, 668265263) ^ Math.imul(s, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash(ix, iy, s), b = hash(ix + 1, iy, s), c = hash(ix, iy + 1, s), d = hash(ix + 1, iy + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s, oct) {
  let sum = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) {
    sum += amp * vnoise(x * f, y * f, s + i * 101);
    norm += amp; amp *= 0.5; f *= 2;
  }
  return sum / norm;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---------- Untergründe ----------
const S_DEEP = 0, S_SHALLOW = 1, S_ASPHALT = 2, S_GRAVEL = 3, S_GRASS = 4, S_SAND = 5,
      S_MUD = 6, S_SNOW = 7, S_ICE = 8, S_BRIDGE = 9, S_DENSE = 10, S_ROCK = 11, S_CLIFF = 12,
      S_PASTURE = 13, S_WHEAT = 14, S_CORN = 15, S_PLOW = 16, S_URBAN = 17, S_RAIL = 18;
// grip: Seitenhaftung, accel/top: Anteil an Motorleistung/Höchstgeschwindigkeit, drag: Rollwiderstand, brake: Bremswirkung
const SURF = [
  { name: 'Tiefes Wasser',  rgb: [34, 86, 140],   grip: 3,   accel: .4,  top: .4,  drag: 1.6, brake: .6, solid: true },
  { name: 'Flaches Wasser', rgb: [74, 148, 196],  grip: 3,   accel: .45, top: .42, drag: 1.6, brake: .6, dust: 'rgba(225,242,255,', splash: true },
  { name: 'Asphalt',        rgb: [74, 76, 82],    grip: 8.5, accel: 1,   top: 1,   drag: .12, brake: 1,  skid: 'rgba(22,22,26,0.33)', smoke: true },
  { name: 'Schotter',       rgb: [156, 142, 120], grip: 4.2, accel: .8,  top: .82, drag: .4,  brake: .75, track: 'rgba(95,82,64,0.20)', dust: 'rgba(180,165,140,' },
  { name: 'Wiese',          rgb: [88, 148, 66],   grip: 5,   accel: .75, top: .72, drag: .55, brake: .7, track: 'rgba(48,88,34,0.16)', dust: 'rgba(80,130,55,', dustSlipOnly: true },
  { name: 'Sand',           rgb: [224, 200, 146], grip: 3.3, accel: .55, top: .6,  drag: 1,   brake: .85, track: 'rgba(160,128,78,0.28)', dust: 'rgba(232,210,160,' },
  { name: 'Matsch',         rgb: [104, 78, 52],   grip: 2.2, accel: .45, top: .5,  drag: 1.3, brake: .5, track: 'rgba(52,36,20,0.38)', dust: 'rgba(84,60,38,' },
  { name: 'Schnee',         rgb: [234, 239, 245], grip: 2.8, accel: .6,  top: .66, drag: .7,  brake: .45, track: 'rgba(150,162,185,0.32)', dust: 'rgba(255,255,255,' },
  { name: 'Eis',            rgb: [176, 214, 234], grip: .5,  accel: .3,  top: .95, drag: .05, brake: .15, skid: 'rgba(255,255,255,0.22)' },
  { name: 'Brücke',         rgb: [138, 100, 64],  grip: 7,   accel: .95, top: .9,  drag: .2,  brake: .9, skid: 'rgba(40,28,18,0.3)' },
  { name: 'Dichter Wald',   rgb: [36, 80, 40],    grip: 5,   accel: .75, top: .72, drag: .55, brake: .7, solid: true },
  { name: 'Fels',           rgb: [158, 146, 124], grip: 4.6, accel: .7,  top: .68, drag: .5,  brake: .8, dust: 'rgba(170,165,155,', dustSlipOnly: true },
  { name: 'Felswand',       rgb: [88, 88, 94],   grip: 4.6, accel: .7,  top: .68, drag: .5,  brake: .8, solid: true },
  { name: 'Weide',          rgb: [104, 160, 70],  grip: 5,   accel: .75, top: .72, drag: .55, brake: .7, track: 'rgba(48,88,34,0.18)', dust: 'rgba(80,130,55,', dustSlipOnly: true },
  { name: 'Weizenfeld',     rgb: [214, 180, 92],  grip: 4,   accel: .6,  top: .6,  drag: 1,   brake: .75, track: 'rgba(150,118,50,0.35)', dust: 'rgba(232,204,128,' },
  { name: 'Maisfeld',       rgb: [86, 128, 48],   grip: 3.6, accel: .5,  top: .45, drag: 1.6, brake: .8, track: 'rgba(52,72,26,0.42)', dust: 'rgba(120,160,64,' },
  { name: 'Acker',          rgb: [122, 92, 62],   grip: 3.2, accel: .55, top: .55, drag: 1.1, brake: .7, track: 'rgba(70,50,30,0.35)', dust: 'rgba(146,114,82,' },
  { name: 'Pflaster',       rgb: [156, 152, 144], grip: 8,   accel: 1,   top: .9,  drag: .15, brake: 1,  skid: 'rgba(30,30,30,0.3)' },
  { name: 'Gleisbett',      rgb: [128, 118, 104], grip: 4.5, accel: .7,  top: .6,  drag: .6,  brake: .8, dust: 'rgba(150,140,125,', dustSlipOnly: true },
];

let lastE = 0, lastM = 0, lastH = 0, lastCold = false, lastPW = 0;

const WL = 0.395, WD = 0.37;   // Wasserspiegel, Grenze zum tiefen Wasser
const DENSE_F = 0.68;          // ab hier ist der Wald undurchdringlich

// großräumige Seen plus kleinere Teiche
function elev(x, y) { return 0.62 * fbm(x / 1800, y / 1800, SEED, 3) + 0.38 * fbm(x / 450, y / 450, SEED + 3, 3); }
// Klima: großräumig und nur leicht verzerrt, damit Schnee und Wüste zusammenhängende Regionen
// bilden statt kleiner Flecken; beide liegen an entgegengesetzten Enden der Skala und berühren sich nie
const COLD_T = 0.34, HOT_T = 0.66;
function climateT(x, y) {
  const wx = x + 900 * (fbm(x / 2600, y / 2600, SEED + 33, 2) - .5), wy = y + 900 * (fbm(x / 2600, y / 2600, SEED + 34, 2) - .5);
  return fbm(wx / 7000, wy / 7000, SEED + 31, 2);
}
function forestAt(x, y) { return fbm(x / 700, y / 700, SEED + 61, 2); }
// Jede Oktave gedreht, sonst folgen die Grate dem achsparallelen Rauschgitter
const ROT = [0, 0.9, 2.1, 3.3].map(a => [Math.cos(a), Math.sin(a)]);
function ridged(x, y, s, oct) {
  let sum = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) {
    const [c, sn] = ROT[i];
    const v = 1 - Math.abs(2 * vnoise((x * c - y * sn) * f, (x * sn + y * c) * f, s + i * 101) - 1);
    sum += amp * v * v; norm += amp; amp *= 0.5; f *= 2;
  }
  return sum / norm;
}
// Einzelne Baumkronen für den dichten Wald: nächster verschobener Gitterpunkt
const CROWN = { shade: 0, id: 0 };
function crownAt(x, y) {
  const G = 20, gx = Math.floor(x / G), gy = Math.floor(y / G);
  let best = 0, id = 0;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const cx = gx + dx, cy = gy + dy;
    const px = (cx + hash(cx, cy, SEED + 11)) * G, py = (cy + hash(cx, cy, SEED + 12)) * G;
    const rr = G * (0.75 + 0.45 * hash(cx, cy, SEED + 13));
    // Lichtkante oben links: Abstand zu leicht versetztem Mittelpunkt
    const d2 = ((x - px + 3) ** 2 + (y - py + 3) ** 2) / (rr * rr);
    const v = 1 - d2;
    if (v > best) { best = v; id = hash(cx, cy, SEED + 14); }
  }
  CROWN.shade = best; CROWN.id = id;
  return CROWN;
}
// Gebirgshöhe 0..1: großräumige Maske mal Grate. >0.35 Fels, >0.6 Felswand, >0.8 Schneegipfel
function mtnH(x, y, setl) {
  const mask = fbm(x / 2600, y / 2600, SEED + 80, 3);
  if (mask < 0.6) return 0;
  let k = clamp((mask - 0.6) / 0.12, 0, 1);
  k = k * k * (3 - 2 * k);
  const S = setlQuery(x, y, setl || settlementsNear(x, y, x, y)); // Siedlungen liegen im ebenen Gelände
  if (S.s) k *= clamp((S.f - 1) / 0.3, 0, 1);
  return k * (0.3 + 0.7 * ridged(x / 600, y / 600, SEED + 81, 4));
}
function autumnAt(x, y) { return fbm(x / 1600, y / 1600, SEED + 90, 2) > 0.6; }
function isWater(x, y) {
  if (riverQuery(x, y, riversNear(x, y, x, y)).edge < 0) return true;
  if (elev(x, y) >= WL || mtnH(x, y) >= 0.2) return false;
  const S = setlQuery(x, y, settlementsNear(x, y, x, y));
  return !S.s || S.f >= 1.3;
}

// ---------- Flüsse ----------
// Je Rasterzelle entspringt mit gewisser Wahrscheinlichkeit ein Fluss im Gebirge und fließt zum
// nächstgelegenen großen See: Zielrichtung, Gefälle und eine Mäanderbewegung bestimmen den Lauf.
// Er wird zur Mündung hin breiter; dort hat er tiefes Wasser in der Mitte.
const RIV_CELL = 3200, RIV_STEP = 18;
const rivCache = new Map();
function lakeDeep(x, y) { return elev(x, y) < WD && mtnH(x, y) < 0.2; }
function riverAt(i, j) {
  const key = i + '|' + j;
  let r = rivCache.get(key);
  if (r !== undefined) return r;
  rivCache.set(key, null); // schützt vor Rekursion während des Aufbaus
  r = buildRiver(i, j);
  rivCache.set(key, r);
  return r;
}
function buildRiver(i, j) {
  if (hash(i, j, SEED + 600) > 0.6) return null;
  let src = null;
  for (let q = 0; q < 14 && !src; q++) {
    const x = (i + hash(i, j, SEED + 601 + q * 2)) * RIV_CELL, y = (j + hash(i, j, SEED + 602 + q * 2)) * RIV_CELL;
    const m = mtnH(x, y);
    if (m > 0.3 && m < 0.62) src = [x, y];
  }
  if (!src) return null;
  let tgt = null;                                                   // nächster großer See
  for (let r = 800; r <= 7000 && !tgt; r += 400) for (let a = 0; a < 24 && !tgt; a++) {
    const ang = a / 24 * TAU + i, x = src[0] + Math.cos(ang) * r, y = src[1] + Math.sin(ang) * r;
    if (lakeDeep(x, y) && lakeDeep(x + 300, y) && lakeDeep(x - 300, y) && lakeDeep(x, y + 300) && lakeDeep(x, y - 300)) tgt = [x, y];
  }
  if (!tgt) return null;
  const xs = [src[0]], ys = [src[1]];
  let x = src[0], y = src[1], dx = tgt[0] - x, dy = tgt[1] - y, l = Math.hypot(dx, dy);
  dx /= l; dy /= l;
  let end = -1;
  for (let s = 0; s < 700; s++) {
    let tx = tgt[0] - x, ty = tgt[1] - y;
    const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
    const gx = elev(x + 6, y) - elev(x - 6, y), gy = elev(x, y + 6) - elev(x, y - 6), gl = Math.hypot(gx, gy) || 1;
    let nx = tx * 0.65 - gx / gl * 0.35, ny = ty * 0.65 - gy / gl * 0.35;
    const wob = (vnoise(s * RIV_STEP / 500, i * 13 + j * 7, SEED + 603) - 0.5) * 2.2;  // Mäander
    const c = Math.cos(wob), sn = Math.sin(wob);
    [nx, ny] = [nx * c - ny * sn, nx * sn + ny * c];
    dx = dx * 0.75 + nx * 0.25; dy = dy * 0.75 + ny * 0.25; l = Math.hypot(dx, dy); dx /= l; dy /= l;
    x += dx * RIV_STEP; y += dy * RIV_STEP; xs.push(x); ys.push(y);
    // Mündung erst in einem großen See (kleine Teiche werden durchflossen), etwas in den See hinein
    if (end < 0 && s > 10 && lakeDeep(x, y) && lakeDeep(x + dx * 250, y + dy * 250) &&
        lakeDeep(x - dy * 200, y + dx * 200) && lakeDeep(x + dy * 200, y - dx * 200)) end = s + 4;
    if (s === end) break;
  }
  if (end < 0) return null;
  const n = xs.length, hw = new Float32Array(n);
  let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  for (let k = 0; k < n; k++) {
    hw[k] = 5 + 17 * Math.pow(k / (n - 1), 0.7);
    minx = Math.min(minx, xs[k]); maxx = Math.max(maxx, xs[k]); miny = Math.min(miny, ys[k]); maxy = Math.max(maxy, ys[k]);
  }
  return { key: i + '|' + j, xs: Float32Array.from(xs), ys: Float32Array.from(ys), hw, n, minx, miny, maxx, maxy };
}
// Flüsse nahe eines Rechtecks, auf den relevanten Stützpunktbereich beschnitten
function riversNear(x0, y0, x1, y1) {
  const out = [], m = 40;
  for (let j = Math.floor(y0 / RIV_CELL) - 3; j <= Math.floor(y1 / RIV_CELL) + 3; j++)
    for (let i = Math.floor(x0 / RIV_CELL) - 3; i <= Math.floor(x1 / RIV_CELL) + 3; i++) {
      const r = riverAt(i, j);
      if (!r || r.maxx < x0 - m || r.minx > x1 + m || r.maxy < y0 - m || r.miny > y1 + m) continue;
      let i0 = -1, i1 = -1;
      for (let k = 0; k < r.n; k++) {
        const x = r.xs[k], y = r.ys[k];
        if (x >= x0 - m && x <= x1 + m && y >= y0 - m && y <= y1 + m) { if (i0 < 0) i0 = k; i1 = k; }
      }
      if (i0 >= 0) out.push({ r, i0: Math.max(0, i0 - 1), i1: Math.min(r.n - 1, i1 + 1) });
    }
  return out;
}
const NO_RIVERS = [];
// Abstand zum Ufer (negativ = im Wasser), Abstand zur Flussmitte und halbe Breite an dieser Stelle
const RV = { edge: 1e9, dist: 1e9, hw: 0 };
function riverQuery(x, y, views) {
  RV.edge = 1e9;
  for (const v of views) {
    const r = v.r;
    if (x < r.minx - 40 || x > r.maxx + 40 || y < r.miny - 40 || y > r.maxy + 40) continue;
    for (let k = v.i0; k < v.i1; k++) {
      const ax = r.xs[k], ay = r.ys[k];
      if (Math.abs(x - ax) > 50 || Math.abs(y - ay) > 50) continue;
      const bx = r.xs[k + 1] - ax, by = r.ys[k + 1] - ay;
      const t = clamp(((x - ax) * bx + (y - ay) * by) / (bx * bx + by * by), 0, 1);
      const d = Math.hypot(x - ax - bx * t, y - ay - by * t), hw = r.hw[k] + (r.hw[k + 1] - r.hw[k]) * t;
      if (d - hw < RV.edge) { RV.edge = d - hw; RV.dist = d; RV.hw = hw; }
    }
  }
  return RV;
}

// ---------- Straßennetz ----------
// Netze auf unterschiedlich groben Gittern: verschobene Knoten, verbunden durch Bézierkurven mit
// stetigen Tangenten. Das grobe Raster 0 trägt keine Straßen mehr, nur Großstädte und Bahnstrecken.
const NETS = [
  { cell: 4200, jit: 0.22 }, // Großraster: Großstädte und Bahnlinien
  { cell: 1300, jit: 0.33 }, // Land- und Nebenstraßen
  { cell: 620,  jit: 0.38 }, // Waldwege
];
// Fahrstreifen sind 36 px breit, das Auto inkl. Räder 28 px.
const LANE = 36;
const TRACK_VERGE = 18; // freier Randstreifen neben Waldwegen
const RT = {
  road:  { half: 40, sh: 6, col: '#55575d', name: 'Landstraße', rank: 2 },  // 1 Streifen je Richtung + 4 Rand
  lane:  { half: 30, sh: 4, col: '#55575d', name: 'Nebenstraße', rank: 2 },
  track: { half: 20, sh: 0, col: '#a08f70', name: 'Schotterstraße', rank: 1 },
  street: { half: 30, sh: 8, col: '#55575d', name: 'Stadtstraße', rank: 2 },     // mit Gehweg statt Bankett
};
const segCache = new Map();
const NO_ROADS = [];

function roadNode(net, i, j) {
  const n = NETS[net];
  return [(i + .5 + (hash(i, j, SEED + net * 7 + 1) - .5) * 2 * n.jit) * n.cell,
          (j + .5 + (hash(i, j, SEED + net * 7 + 2) - .5) * 2 * n.jit) * n.cell];
}
function edgeExists(net, i, j, dir) {
  if (net === 0) return false;                                      // Großraster: keine Straßen
  if (hash(i, j, SEED + 310 + net * 2 + dir) >= (net === 1 ? 0.68 : 0.6)) return false;
  // keine Straßenknoten im Wasser: Brücken verbinden nur Ufer, Kreuzungen liegen an Land
  return !nodeWet(net, i, j) && !nodeWet(net, dir ? i : i + 1, dir ? j + 1 : j);
}
const wetCache = new Map();
function nodeWet(net, i, j) {
  const key = net + '|' + i + '|' + j;
  let w = wetCache.get(key);
  if (w === undefined) { const [x, y] = roadNode(net, i, j); w = elev(x, y) < WL + 0.012; wetCache.set(key, w); }
  return w;
}
const WOODLAND = { [S_GRASS]: 1, [S_SNOW]: 1, [S_MUD]: 1, [S_DENSE]: 1 };
function nodeDegree(net, i, j) {

      for (let q = 0; q < 10; q++) tree(...s.toWorld(cu + (rng() - .5) * iw * 1.7, cv + (rng() - .5) * ih * 1.7));
      continue;
    }
    const centre = Math.max(0, 1 - d / s.R), floors = () => 2 + Math.floor(rng() * (3 + 10 * centre));
    const cut = !clearOf(cx, cy, iw * 2 - 10, ih * 2 - 10, s.ang, 0, false);   // Avenue schneidet hindurch
    const r = cut ? 1 : rng();
    if (centre > 0.55 && r < 0.55) {                                         // Türme
      const n = iw > 150 && ih > 150 ? 2 : 1, ww = iw * 2 / n;
      for (let p = 0; p < n; p++) {
        const st = pick(['step', 'glass', 'gravel', 'step', 'dome']);
        place(cu - iw + ww * (p + .5), cv, ww - 22, ih * 2 - 22, st, 8 + Math.floor(rng() * 8));
      }
      for (let q = 0; q < 3; q++) tree(...s.toWorld(cu + (rng() - .5) * iw * 1.9, cv + (rng() < .5 ? -1 : 1) * (ih - 6)));
    } else if (r < 0.7) {                                                    // Blockrand mit Innenhof
      const D = perimeter(cu, cv, iw, ih, rng() < 0.5, floors);
      const gi = iw - D - 14, gh = ih - D - 14;
      if (gi > 20 && gh > 20) for (let q = 0; q < 2 + Math.floor(gi * gh / 2500); q++) tree(...s.toWorld(cu + (rng() - .5) * gi * 1.6, cv + (rng() - .5) * gh * 1.6));
    } else {                                                                 // gemischte Grundstücke
      const nx = Math.max(1, Math.round(iw / 75)), ny = Math.max(1, Math.round(ih / 75)), lw = iw * 2 / nx, lh = ih * 2 / ny;
      for (let p = 0; p < nx; p++) for (let q = 0; q < ny; q++) {
        const st = pick(['shed', 'shed', 'glass', 'gravel', 'green', 'solar', 'house', 'terrace', 'step']);
        const sh = 0.75 + rng() * 0.2;
        place(cu - iw + lw * (p + .5), cv - ih + lh * (q + .5), lw * sh - 6, lh * sh - 6, st, floors());
      }
    }
  }
}
// Dorf und Kleinstadt: Häuser entlang aller Straßen im Ort, Kirche (und Marktbrunnen) im Kern
function organicBuildings(s, B, rng, views, clearOf, tree) {
  const town = s.kind === 'town', own = new Set(streetsOf(s));
  const roads = views.filter(v => v.seg.net === 1 || own.has(v.seg));
  let best = null, bd = Infinity;
  for (const v of roads) if (v.seg.net === 1) for (let k = v.i0; k <= v.i1; k++) {
    const d = Math.hypot(v.seg.xs[k] - s.x, v.seg.ys[k] - s.y);
    if (d > 40 && d < bd) { bd = d; best = [v.seg, k]; }
  }
  if (best) {
    const [g, k] = best, side = rng() < 0.5 ? 1 : -1, w = town ? 100 : 88, h = town ? 46 : 42;
    const off = g.half + g.sh + h / 2 + 14, ang = Math.atan2(-g.nx[k], g.ny[k]);
    const x = g.xs[k] + g.nx[k] * off * side, y = g.ys[k] + g.ny[k] * off * side;
    if (clearOf(x, y, w, h, ang, 6, true)) B.push({ t: 'church', x, y, w, h, ang, r: Math.hypot(w, h) / 2 });
  }
  if (town) {                                                                // Marktplatz
    for (let q = 0; q < 12; q++) {
      const x = s.x + Math.cos(q * 2.4) * q * 6, y = s.y + Math.sin(q * 2.4) * q * 6;
      if (clearOf(x, y, 34, 34, 0, 6, true)) { plazaAt(B, clearOf, tree, x, y, 34); break; }
    }
  }
  for (const v of roads) {
    const g = v.seg, mine = own.has(g), stepK = Math.max(1, Math.round((town ? 68 : 82) / g.step));
    for (let k = v.i0 + (mine ? 3 : 0); k <= v.i1; k += stepK) {
      if (Math.hypot(g.xs[k] - s.x, g.ys[k] - s.y) > s.R * (mine ? 1.05 : 0.95)) continue;
      for (const side of [-1, 1]) {
        if (rng() < (town ? 0.12 : 0.22)) continue;
        const w = 42 + rng() * 22, h = 36 + rng() * 16, off = g.half + g.sh + h / 2 + 8 + rng() * 8;
        const x = g.xs[k] + g.nx[k] * off * side, y = g.ys[k] + g.ny[k] * off * side;
        const ang = Math.atan2(-g.nx[k], g.ny[k]);
        if (clearOf(x, y, w, h, ang, 6, true)) {
          const roof = ROOFS[Math.floor(rng() * ROOFS.length)];
          B.push({ t: 'house', x, y, w, h, ang, r: Math.hypot(w, h) / 2, c1: roof[0], c2: roof[1], chim: rng() });
        }
        if (rng() < 0.35) tree(x + g.nx[k] * side * (h / 2 + 26), y + g.ny[k] * side * (h / 2 + 26));
      }
    }
  }
}

// ---------- Chunks ----------
const CELL = 4, CN = 128, CS = CELL * CN; // 512 Welt-Pixel pro Chunk
const MAX_CHUNKS = 80;
const chunks = new Map();
const ckey = (cx, cy) => (cx + 50000) * 100000 + (cy + 50000);
let frameNo = 0;
let spawn = { x: 0, y: 0, a: 0 };

function newChunk(cx, cy) {
  const segs = segsNear(cx * CS, cy * CS, (cx + 1) * CS, (cy + 1) * CS);
  const setl = settlementsNear(cx * CS, cy * CS, (cx + 1) * CS, (cy + 1) * CS);
  const rivs = riversNear(cx * CS, cy * CS, (cx + 1) * CS, (cy + 1) * CS);
  const rails = railsNear(cx * CS, cy * CS, (cx + 1) * CS, (cy + 1) * CS);
  const s = surfaceAt((cx + .5) * CS, (cy + .5) * CS, segs, setl, rivs, rails);
  const p = SURF[s].rgb;
  return {
    cx, cy, segs, setl, rivs, rails, levels: [], done: false, row: 0, lastUsed: frameNo,
    surf: new Uint8Array(CN * CN), img: new ImageData(CN, CN),
    canvas: null, statics: [], dyn: [],
    fallback: `rgb(${p[0]},${p[1]},${p[2]})`,
  };
}

function genRows(c, n) {
  const d = c.img.data, ox = c.cx * CS, oy = c.cy * CS;
  const end = Math.min(CN, c.row + n);
  for (let j = c.row; j < end; j++) {
    for (let i = 0; i < CN; i++) {
      const wx = ox + (i + .5) * CELL, wy = oy + (j + .5) * CELL;
      const s = surfaceAt(wx, wy, c.segs, c.setl, c.rivs, c.rails);
      const idx = j * CN + i;
      c.surf[idx] = s;
      shadeCell(c, s, wx, wy, i, j, d, idx * 4);
    }
  }
  c.row = end;
  if (c.row >= CN) finalizeChunk(c);
}

// Farbe einer Rasterzelle; nutzt lastE/lastM/lastH/lastCold aus dem vorangegangenen surfaceAt
function shadeCell(c, s, wx, wy, i, j, d, o) {
  const p = SURF[s].rgb;
  let r = p[0], g = p[1], b = p[2];
  const n1 = hash(c.cx * CN + i, c.cy * CN + j, SEED + 99);
  const lf = vnoise(wx / 90, wy / 90, SEED + 5);
  let v = 0.94 + 0.08 * n1 + 0.2 * (lf - .5);
  if (s === S_DEEP) {
    const k = clamp((lastE - (WD - 0.13)) / 0.13, 0, 1);
    r = 24 + 22 * k; g = 62 + 36 * k; b = 112 + 38 * k; v = 0.97 + 0.05 * n1;
  } else if (s === S_SHALLOW) {
    const k = clamp((lastE - WD) / (WL - WD), 0, 1);
    r = 58 + 40 * k; g = 128 + 42 * k; b = 182 + 18 * k; v = 0.97 + 0.05 * n1;
  } else if (s === S_GRASS) {
    const k = 0.5 - lastM; // trockener = gelblicher
    r += k * 130; g += k * 30; b -= k * 20;
  } else if (s === S_ICE) {
    v = 0.95 + 0.1 * n1 + 0.12 * (lf - .5);
  } else if (s === S_DENSE) {                     // Waldboden zwischen den Kronen
    if (lastCold) { r = 120; g = 132; b = 140; } else { r = 30; g = 44; b = 24; }
    v = 0.8 + 0.4 * n1 * lf;
  } else if (s === S_URBAN) {                     // Gehwegplatten
    v = 0.95 + 0.05 * n1 + 0.06 * (lf - .5);
  } else if (s === S_WHEAT) {                     // Saatreihen quer zur Parzelle
    v *= (Math.floor(lastPW / 12) & 1 ? 0.93 : 1.04) + 0.08 * (n1 - .5);
  } else if (s === S_CORN) {
    const q = ((lastPW % 16) + 16) % 16;
    v *= q < 8 ? 0.74 + 0.16 * n1 : 1.04 + 0.08 * n1;
  } else if (s === S_PLOW) {                      // Furchen
    v *= Math.floor(lastPW / 12) & 1 ? 0.86 : 1.04;
  } else if (s === S_CLIFF && lastH > 0.8) {
    r = 232; g = 236; b = 242;                   // Schneegipfel
  }
  if (lastH > 0.12 && s !== S_SHALLOW && s !== S_DEEP) {
    const hh = lastH; // Hangschattierung, Licht von oben links
    v *= 1 + clamp((mtnH(wx - 5, wy - 5, c.setl) - mtnH(wx + 5, wy + 5, c.setl)) * (s === S_CLIFF ? 11 : 7), -0.5, 0.5);
    lastH = hh;
  }
  d[o] = clamp(r * v, 0, 255); d[o + 1] = clamp(g * v, 0, 255); d[o + 2] = clamp(b * v, 0, 255); d[o + 3] = 255;
}

// Gleise: Schotterbett und Schwellen nur abseits der Straßen, Schienen auch über die Fahrbahn
// (Bahnübergang)
function drawRails(c) {
  const g = c.ctx;
  g.save(); g.translate(-c.cx * CS, -c.cy * CS); g.lineJoin = 'round'; g.lineCap = 'butt';
  for (const v of c.rails) {
    const s = v.seg, onRoad = new Uint8Array(s.n);
    for (let k = v.i0; k <= v.i1; k++) {
      const R = roadQuery(s.xs[k], s.ys[k], c.segs);
      if (R.seg && R.edge < 2) onRoad[k] = 1;
    }
    const wet = k => s.water[k] || s.water[k - 1] || s.water[k + 1];
    const bed = k => !onRoad[k] && !s.water[k];
    if (s.hasWater) {                                                // Brückenschatten
      g.save(); g.translate(6, 8); polyLine(g, s, 0, RAIL_HALF * 2 + 2, 'rgba(0,0,0,0.28)', null, wet); g.restore();
      polyLine(g, s, 0, RAIL_HALF * 2, '#5d4a38', null, wet);
    }
    polyLine(g, s, 0, RAIL_HALF * 2, '#8a8174', null, bed);          // Schotter
    polyLine(g, s, 0, RAIL_HALF * 2 - 4, '#9a9183', null, bed);
    polyLine(g, s, 0, 15, '#4b3a2c', [2.6, 3.6], k => bed(k) || wet(k));   // Schwellen
    for (const sd of [-1, 1]) {
      polyLine(g, s, sd * RAIL_GAUGE, 1.8, '#7d838a');                // Schienen
      polyLine(g, s, sd * RAIL_GAUGE - 0.4, 0.7, '#c8ccd0');
    }
    if (s.hasWater) for (const sd of [-1, 1]) polyLine(g, s, sd * (RAIL_HALF + 1), 2.5, '#d9d3c5', null, wet);
  }
  g.setLineDash([]); g.restore();
}
// Bahnübergänge (Land-, Neben-, Stadtstraßen, Waldwege)
const levelCache = new Map();
function findRailCrossings(c) {
  for (const rv of c.rails) for (const sv of c.segs) {
    const r = rv.seg, s = sv.seg;
    for (const p of polyCross(r, s)) {
      if (p.x < c.cx * CS - 200 || p.x > (c.cx + 1) * CS + 200 || p.y < c.cy * CS - 200 || p.y > (c.cy + 1) * CS + 200) continue;
      const key = Math.round(p.x / 30) + '|' + Math.round(p.y / 30) + '|' + s.net;
      let L = levelCache.get(key);
      if (!L) {
        const sin = Math.max(0.35, Math.abs(r.nx[p.ia] * s.ny[p.ib] - r.ny[p.ia] * s.nx[p.ib]));
        const barrier = s.type === 'road' || (s.type === 'street' && s.skind !== 'village');
        L = { x: p.x, y: p.y, seg: s, k: p.ib, barrier, closed: 0, sin };
        levelCache.set(key, L);
      }
      if (!c.levels.includes(L)) c.levels.push(L);
    }
  }
}

function finalizeChunk(c) {
  const small = document.createElement('canvas');
  small.width = small.height = CN;
  small.getContext('2d').putImageData(c.img, 0, 0);
  c.canvas = document.createElement('canvas');
  c.canvas.width = c.canvas.height = CS;
  const g = c.canvas.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(small, 0, 0, CS, CS);
  c.ctx = g;
  c.img = null;
  drawRoads(c);
  if (c.rails.length) { drawRails(c); findRailCrossings(c); }
  buildCanopy(c);
  genObstacles(c);
  c.done = true;
}

// Straßen als Vektorlinien in den Chunk zeichnen. Jedes Segment wird komplett gezeichnet,
// damit Strichmarkierungen über Chunkgrenzen hinweg nahtlos weiterlaufen.
const MARK = 'rgba(238,238,228,0.92)';
const shoulderCol = s => s.type === 'street' && s.skind !== 'village' ? '#bdb9b0' : '#9a8c74'; // Gehweg bzw. Bankett
// Unterbrochene Teilstücke bekommen die Lauflänge als Strich-Offset, damit das Strichmuster
// unabhängig von Lücken (und damit in jedem Chunk gleich) weiterläuft.
function polyLine(g, s, off, w, col, dash, pred) {
  g.lineWidth = w; g.strokeStyle = col; g.setLineDash(dash || []);
  let open = false, len = 0, px = 0, py = 0;
  for (let k = 0; k < s.n; k++) {
    const x = s.xs[k] + s.nx[k] * off, y = s.ys[k] + s.ny[k] * off;
    if (k) len += Math.hypot(x - px, y - py);
    px = x; py = y;
    if (pred && !pred(k, x, y)) { if (open) { g.stroke(); open = false; } continue; }
    if (open) g.lineTo(x, y);
    else { g.beginPath(); g.lineDashOffset = len; g.moveTo(x, y); open = true; }
  }
  if (open) g.stroke();
}

// Liegt (x,y) auf der Fahrbahn eines der Segmente? Segmentenden zählen ohne runde Kappe,
// damit an T-Kreuzungen die gegenüberliegende Randlinie durchgehend bleibt.
function onAnyBody(x, y, views) {
  for (const v of views) {
    const o = v.seg, m = o.half + 16;
    if (x < o.minx - m || x > o.maxx + m || y < o.miny - m || y > o.maxy + m) continue;
    for (let k = v.i0; k < v.i1; k++) {
      const ax = o.xs[k], ay = o.ys[k];
      if (Math.abs(x - ax) > m || Math.abs(y - ay) > m) continue;
      const bx = o.xs[k + 1] - ax, by = o.ys[k + 1] - ay, px = x - ax, py = y - ay;
      let t = (px * bx + py * by) / (bx * bx + by * by);
      if ((k === 0 && t < 0) || (k === o.n - 2 && t > 1)) continue;
      t = clamp(t, 0, 1);
      if (Math.hypot(px - bx * t, py - by * t) < o.half + 1) return true;
    }
  }
  return false;
}

// Markierungen enden dort, wo eine gleich- oder höherrangige Straße kreuzt oder einmündet.
// Ausgenommen ist die eigene Fortsetzung (gleiches Netz, gleiche Gitterzeile bzw. -spalte).
function markPred(c, s) {
  const others = c.segs.filter(v => {
    const o = v.seg;
    if (o === s || o.rank < s.rank) return false;
    if (o.net === s.net && o.dir === s.dir && (s.dir ? o.i === s.i : o.j === s.j)) return false;
    return !(o.maxx < s.minx - 100 || o.minx > s.maxx + 100 || o.maxy < s.miny - 100 || o.miny > s.maxy + 100);
  });
  if (!others.length) return null;
  const x0 = c.cx * CS - 20, y0 = c.cy * CS - 20, x1 = x0 + CS + 40, y1 = y0 + CS + 40;
  return (k, x, y) => x < x0 || x > x1 || y < y0 || y > y1 || !onAnyBody(x, y, others);
}


// Schotterstraße: Steinchen in wechselnden Tönen, ausgefranster Rand, Schlaglöcher und Pfützen.
// Alles aus Segment und Stützpunkt abgeleitet, damit benachbarte Chunks dasselbe zeichnen.
function gravelTexture(g, s, c) {
  if (s.hseed === undefined) { let h = 7; for (const ch of s.key) h = (h * 31 + ch.charCodeAt(0)) | 0; s.hseed = h; }
  const x0 = c.cx * CS - 30, y0 = c.cy * CS - 30, x1 = x0 + CS + 60, y1 = y0 + CS + 60, H = s.half;
  const stones = ['rgba(214,202,176,0.75)', 'rgba(120,104,80,0.6)', 'rgba(176,160,128,0.8)', 'rgba(90,78,62,0.5)'];
  for (let k = 0; k < s.n - 1; k++) {
    const bx = s.xs[k], by = s.ys[k];
    if (bx < x0 || bx > x1 || by < y0 || by > y1) continue;
    const tx = s.xs[k + 1] - bx, ty = s.ys[k + 1] - by, nx = s.nx[k], ny = s.ny[k];
    const r = q => hash(s.hseed, k * 64 + q, SEED + 950);
    for (let q = 0; q < 22; q++) {                                   // Steinchen auf der Fahrbahn
      const f = r(q * 3), o = (r(q * 3 + 1) * 2 - 1) * (H - 1), sz = 0.8 + r(q * 3 + 2) * 1.6;
      g.fillStyle = stones[q % 4];
      g.fillRect(bx + tx * f + nx * o - sz / 2, by + ty * f + ny * o - sz / 2, sz, sz);
    }
    for (let q = 0; q < 6; q++) {                                    // ausgefranster Rand, lose Steine daneben
      const side = q % 2 ? 1 : -1, f = r(100 + q), o = side * (H - 2 + r(110 + q) * 6), sz = 1.2 + r(120 + q) * 1.8;
      g.fillStyle = q % 3 ? 'rgba(150,134,104,0.8)' : 'rgba(84,70,52,0.55)';
      g.fillRect(bx + tx * f + nx * o - sz / 2, by + ty * f + ny * o - sz / 2, sz, sz);
    }
    const h = r(200);
    if (h < 0.06) {                                                  // Pfütze in einer Fahrspur
      const o = (r(201) < .5 ? -1 : 1) * 10, px = bx + nx * o, py = by + ny * o, a = Math.atan2(ty, tx);
      g.fillStyle = 'rgba(70,58,42,0.55)'; g.beginPath(); g.ellipse(px, py, 7 + r(202) * 5, 4, a, 0, TAU); g.fill();
      g.fillStyle = 'rgba(120,150,170,0.55)'; g.beginPath(); g.ellipse(px, py, 5 + r(202) * 4, 2.6, a, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(px - 2, py - 1, 2.5, 0.8);
    } else if (h < 0.14) {                                           // Schlagloch
      const o = (r(203) * 2 - 1) * (H - 6), px = bx + tx * .5 + nx * o, py = by + ty * .5 + ny * o, rr = 2 + r(204) * 2.5;
      g.fillStyle = 'rgba(60,50,36,0.6)'; g.beginPath(); g.arc(px, py, rr, 0, TAU); g.fill();
      g.fillStyle = 'rgba(200,186,156,0.6)'; g.beginPath(); g.arc(px - rr * .3, py - rr * .3, rr * .45, 0, TAU); g.fill();
    }
  }
}

function drawMarkings(g, s, p) {
  const h = s.half;
  if (s.type === 'road') {
    polyLine(g, s, 0, 1.8, MARK, [20, 22], p);
    polyLine(g, s, -(LANE + 1), 1.8, MARK, null, p);
    polyLine(g, s, LANE + 1, 1.8, MARK, null, p);
  } else if (s.type === 'street') {
    if (h > 25) polyLine(g, s, 0, 1.5, 'rgba(238,238,228,0.7)', [14, 18], p);
    if (s.skind !== 'village') {
      polyLine(g, s, -h, 1.5, '#8b877f', null, p);                    // Bordsteine
      polyLine(g, s, h, 1.5, '#8b877f', null, p);
    }
  } else if (s.type === 'track') {
    polyLine(g, s, -10, 7, 'rgba(98,80,56,0.42)', null, p);           // festgefahrene Fahrspuren
    polyLine(g, s, 10, 7, 'rgba(98,80,56,0.42)', null, p);
    polyLine(g, s, 0, 4, 'rgba(206,192,160,0.45)', [5, 3], p);         // Mittelgrat aus losem Schotter
  }
  if (s.mtn) {                                                        // Leitplanken im Gebirge
    for (const sg of [-1, 1]) {
      polyLine(g, s, sg * (h + s.sh - 2), 2.5, '#d5d8dc', null, p);
      polyLine(g, s, sg * (h + s.sh - 2), 4, '#5b5f66', [2, 16], p);
    }
  }
}
function drawRoads(c) {
  const g = c.ctx;
  g.save();
  g.translate(-c.cx * CS, -c.cy * CS);
  g.lineJoin = 'round';
  // alle Straßen einer Ebene in gemeinsamen Durchgängen (erst Bankette, dann Fahrbahnen, dann
  // Markierungen), damit Kreuzungen und Einmündungen nahtlos ineinander übergehen
  const segs = c.segs.map(v => v.seg).sort((a, b) => (b.type === 'track') - (a.type === 'track'));   // Schotter zuerst
  const wetPred = s => k => s.water[k] || s.water[k - 1] || s.water[k + 1];
  g.lineCap = 'butt';
  for (const s of segs) if (s.hasWater) {
    g.save(); g.translate(7, 9);
    polyLine(g, s, 0, s.half * 2 + 4, 'rgba(0,0,0,0.28)', null, wetPred(s));
    g.restore();
  }
  g.lineCap = 'round';
  for (const s of segs) if (!s.sh) polyLine(g, s, 0, s.half * 2 + 6, 'rgba(84,66,42,0.35)');
  for (const s of segs) if (s.sh) polyLine(g, s, 0, (s.half + s.sh) * 2, shoulderCol(s), null, k => !s.water[k]);
  for (const s of segs) if (s.type === 'track') polyLine(g, s, 0, s.half * 2, s.col);
  for (const s of segs) if (s.type === 'track') gravelTexture(g, s, c);
  for (const s of segs) if (s.type !== 'track') polyLine(g, s, 0, s.half * 2, s.col);
  g.lineCap = 'butt';
  for (const s of segs) drawMarkings(g, s, markPred(c, s));
  for (const s of segs) if (s.hasWater) {
    const p = wetPred(s);
    polyLine(g, s, -(s.half + 1.5), 3, '#d9d3c5', null, p); // Brückengeländer
    polyLine(g, s, s.half + 1.5, 3, '#d9d3c5', null, p);
  }
  g.setLineDash([]);
  g.restore();
}

// ---------- Wald ----------
// Jeder Punkt eines 20-px-Gitters im dichten Wald trägt eine Baumkrone: Laubbäume als wolkige
// Kronen aus mehreren Teilen, Nadelbäume als Sterne in drei Ebenen. Kronen im Inneren werden
// einmal in den Boden des Chunks gemalt; Randkronen und der vorgelagerte Waldmantel liegen als
// Overlay über allem (auch über dem Auto) – ohne Kollision, fest bleibt nur der Wald selbst.
const FOREST_G = 20;
const AUTUMN_PAL = [[176, 84, 34], [196, 140, 40], [150, 52, 36], [96, 112, 46]];
function forestCrown(gx, gy, x, y, scale) {
  const h1 = hash(gx, gy, SEED + 13), id = Math.floor(hash(gx, gy, SEED + 14) * 4) / 4, h3 = hash(gx, gy, SEED + 15);
  const cold = climateT(x, y) < COLD_T, aut = !cold && autumnAt(x, y);
  const conifer = cold ? h3 < 0.85 : h3 < (aut ? 0.2 : 0.3);
  const rr = FOREST_G * (0.7 + 0.5 * h1) * scale;
  let col, key;
  if (conifer) { col = cold ? [30, 66, 56] : [26 + 10 * id, 62 + 14 * id, 42]; key = 'c' + (cold ? 'w' : '') + id; }
  else if (cold) { col = [112 + 20 * id, 104 + 16 * id, 92]; key = 'b' + id; }       // kahle Laubbäume im Winter
  else if (aut) { const q = Math.floor(hash(gx, gy, SEED + 17) * 4); col = AUTUMN_PAL[q]; key = 'a' + q; }
  else { col = [32 + 26 * id, 86 + 34 * id, 40]; key = 'd' + id; }
  const blobs = [];
  if (!conifer) {
    const n = 4 + Math.floor(h3 * 3), a0 = h1 * TAU;
    blobs.push([x, y, rr * 0.62]);
    for (let k = 0; k < n; k++) {
      const a = a0 + k / n * TAU + hash(gx, gy, SEED + 20 + k) * 0.5;
      blobs.push([x + Math.cos(a) * rr * 0.42, y + Math.sin(a) * rr * 0.42, rr * (0.48 + 0.14 * hash(gx, gy, SEED + 30 + k))]);
    }
  }
  return { x, y, rr, conifer, cold, col, key, blobs, rot: h1 * TAU };
}
// Pfadgruppen je Farbton: Grundform, Mittelton, Lichter, Schnee
function crownGroup(groups, cr) {
  let g = groups.get(cr.key);
  if (!g) {
    const f = m => `rgb(${clamp(cr.col[0] * m, 0, 255) | 0},${clamp(cr.col[1] * m, 0, 255) | 0},${clamp(cr.col[2] * m, 0, 255) | 0})`;
    g = { base: new Path2D(), mid: new Path2D(), hi: new Path2D(), snow: new Path2D(), cols: [f(0.72), f(1.0), f(1.32)] };
    groups.set(cr.key, g);
  }
  return g;
}
const disc = (p, x, y, r) => { p.moveTo(x + r, y); p.arc(x, y, r, 0, TAU); };
function star(p, x, y, r, rot, pts) {
  for (let i = 0; i < pts * 2; i++) {
    const a = rot + i / (pts * 2) * TAU, rr = i % 2 ? r * 0.62 : r;
    i ? p.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : p.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  p.closePath();
}
function addCrown(groups, shadow, cr, shOff) {
  const g = crownGroup(groups, cr), { x, y, rr } = cr;
  if (cr.conifer) {
    star(g.base, x, y, rr * 0.95, cr.rot, 8);
    star(g.mid, x - rr * 0.06, y - rr * 0.06, rr * 0.64, cr.rot + 0.2, 8);
    star(g.hi, x - rr * 0.1, y - rr * 0.1, rr * 0.32, cr.rot + 0.4, 6);
    if (cr.cold) for (let k = 0; k < 3; k++) {
      const a = cr.rot + k * 2.1; disc(g.snow, x + Math.cos(a) * rr * 0.45, y + Math.sin(a) * rr * 0.45, rr * 0.13);
    }
    disc(shadow, x + shOff, y + shOff * 1.25, rr * 0.85);
  } else {
    for (const [bx, by, br] of cr.blobs) {
      disc(g.base, bx, by, br);
      disc(g.mid, bx - rr * 0.1, by - rr * 0.12, br * 0.74);
      disc(shadow, bx + shOff, by + shOff * 1.25, br);
    }
    for (let k = 1; k < Math.min(4, cr.blobs.length); k++) {         // Lichter oben links
      const [bx, by, br] = cr.blobs[k];
      disc(g.hi, bx - rr * 0.22, by - rr * 0.25, br * 0.32);

}
function fillGroups(g2, groups, shadow, shAlpha) {
  g2.fillStyle = `rgba(0,0,0,${shAlpha})`; g2.fill(shadow);
  for (const g of groups.values()) {
    g2.fillStyle = g.cols[0]; g2.fill(g.base);
    g2.fillStyle = g.cols[1]; g2.fill(g.mid);
    g2.fillStyle = g.cols[2]; g2.fill(g.hi);
    g2.fillStyle = 'rgba(232,238,244,0.92)'; g2.fill(g.snow);
  }
}
function buildCanopy(c) {
  const G = FOREST_G, ox = c.cx * CS, oy = c.cy * CS, M = 30;
  const dense = (x, y) => localSurf(c, x, y) === S_DENSE;
  const inner = new Map(), innerSh = new Path2D(), edge = new Map(), edgeSh = new Path2D();
  let anyInner = false;
  // Rand mitzeichnen, damit Kronen über Chunkgrenzen nicht abgeschnitten werden
  for (let gy = Math.floor((oy - M) / G); gy <= Math.floor((oy + CS + M) / G); gy++) {
    for (let gx = Math.floor((ox - M) / G); gx <= Math.floor((ox + CS + M) / G); gx++) {
      const px = (gx + hash(gx, gy, SEED + 11)) * G, py = (gy + hash(gx, gy, SEED + 12)) * G;
      if (px < ox - M || px >= ox + CS + M || py < oy - M || py >= oy + CS + M || !dense(px, py)) continue;
      let dx = 0, dy = 0, open = 0;
      for (let k = 0; k < 8; k++) {
        const a = k * TAU / 8, ax = Math.cos(a), ay = Math.sin(a);
        if (!dense(px + ax * 24, py + ay * 24)) { dx += ax; dy += ay; open++; }
      }
      if (!open) { addCrown(inner, innerSh, forestCrown(gx, gy, px, py, 1.05), 4); anyInner = true; continue; }
      // Randkrone (nur vom Chunk, in dem sie liegt, ins Overlay)
      if (px < ox || px >= ox + CS || py < oy || py >= oy + CS) continue;
      const l = Math.hypot(dx, dy) || 1, ux = dx / l, uy = dy / l;
      let cr = forestCrown(gx, gy, px + ux * 5, py + uy * 5, 1.12);
      if (c.rails.length) {                                          // an Gleisen kleiner, damit nichts ins Gleis ragt
        const e = railQuery(cr.x, cr.y, c.rails).edge;
        if (e < cr.rr + 20) {
          if (e < 30) continue;
          cr = forestCrown(gx, gy, cr.x, cr.y, 1.12 * (e - 20) / cr.rr);
        }
      }
      addCrown(edge, edgeSh, cr, 9);
      // Waldmantel: Sträucher und junge Bäume vor dem Rand
      if (open >= 2 && hash(gx, gy, SEED + 18) < 0.55) {
        const d = cr.rr * 0.9 + 6 + hash(gx, gy, SEED + 19) * 10, sx = px + ux * d, sy = py + uy * d;
        const R = roadQuery(sx, sy, c.segs);
        const nearRail = c.rails.length && railQuery(sx, sy, c.rails).edge < RAIL_CLEAR;
        if ((!R.seg || R.edge > 4) && !nearRail && !SURF[localSurf(c, sx, sy)].solid && !isRoadSurf(localSurf(c, sx, sy))) {
          const sh = forestCrown(gx + 7919, gy, sx, sy, 0.45);
          sh.col = sh.col.map(v => v * 1.08); sh.key += 's';
          addCrown(edge, edgeSh, sh, 5);
        }
      }
    }
  }
  if (anyInner) {                                                    // Waldinneres fest in den Boden malen
    const g = c.ctx;
    g.save(); g.translate(-ox, -oy); fillGroups(g, inner, innerSh, 0.32); g.restore();
  }
  c.canopy = edge.size ? { shadow: edgeSh, groups: edge } : null;
}

function localSurf(c, x, y) {
  const i = Math.floor((x - c.cx * CS) / CELL), j = Math.floor((y - c.cy * CS) / CELL);
  // knapp außerhalb: mit den Listen des Chunks rechnen (die reichen über den Rand hinaus) statt neu zu suchen
  if (i < 0 || j < 0 || i >= CN || j >= CN) return surfaceAt(x, y, c.segs, c.setl, c.rivs, c.rails);
  return c.surf[j * CN + i];
}

const ROOFS = [['#b8553f', '#8f3e2d'], ['#5d6b7a', '#46515d'], ['#7a4b3a', '#5c382b'], ['#c8a35a', '#a1813f'], ['#4f7a5a', '#3b5c44']];

function genObstacles(c) {
  const rng = mulberry32(Math.floor(hash(c.cx, c.cy, SEED + 500) * 4294967296));
  const ox = c.cx * CS, oy = c.cy * CS;
  const S = c.statics, D = c.dyn;
  const free = (x, y, r, onRoad) => {
    if (Math.hypot(x - spawn.x, y - spawn.y) < 200) return false;
    if (!onRoad) {
      const R = roadQuery(x, y, c.segs);
      const clear = R.seg && R.seg.type === 'track' ? TRACK_VERGE : R.seg ? R.seg.sh : 0;
      if (R.seg && R.edge - clear < r * 0.7 + 3) return false;
      if (c.rails.length && railQuery(x, y, c.rails).edge < r + RAIL_CLEAR - 8) return false;   // volle Krone plus Abstand
    }
    for (const o of S) if (Math.hypot(o.x - x, o.y - y) < o.r + r + 8) return false;
    for (const o of D) if (Math.hypot(o.x - x, o.y - y) < o.r + r + 4) return false;
    return true;
  };
  const addDyn = (t, x, y, onRoad) => {
    const def = DYN[t];
    if (!free(x, y, def.r, onRoad)) return;
    const o = { t, x, y, r: def.r, m: def.m, vx: 0, vy: 0, a: rng() * TAU, va: 0, c: def.colors[Math.floor(rng() * def.colors.length)] };
    if (def.animal) Object.assign(o, { animal: true, timer: rng() * 3, walk: 0, spots: [rng(), rng(), rng()] });
    D.push(o);
  };

  for (let k = 0; k < 70; k++) {
    const x = ox + rng() * CS, y = oy + rng() * CS;
    if (c.setl.length && setlQuery(x, y, c.setl).f < 1.08) continue;
    const s = localSurf(c, x, y);
    const r = rng();
    const forest = forestAt(x, y);
    let o = null;
    if (s === S_GRASS && farmAt(x, y) && forest < 0.56) {
      if (r < 0.22) o = { t: 'bush', x, y, r: 6 + rng() * 3 }; // Hecken zwischen den Parzellen
    } else if (s === S_GRASS) {
      const pt = forest > 0.56 ? 0.75 : 0.07;
      if (r < pt) o = makeTree(rng, x, y);
      else if (r < pt + 0.06) o = { t: 'bush', x, y, r: 6 + rng() * 4 };
      else if (r < pt + 0.09) o = makeRock(rng, x, y);
      else if (r < pt + 0.115) { tryHouse(c, rng, x, y); continue; }
      else if (r < pt + 0.125) { addDyn('bale', x, y); continue; }
    } else if (s === S_SAND) {
      if (r < 0.13) o = { t: 'cactus', x, y, r: 6 + rng() * 3, arms: rng() * TAU };
      else if (r < 0.2) o = makeRock(rng, x, y);
      else if (r < 0.22) { addDyn('barrel', x, y); continue; }
    } else if (s === S_SNOW) {
      if (r < (forest > 0.5 ? 0.6 : 0.12)) o = { ...makeTree(rng, x, y), t: 'pine', snow: true };
      else if (r < 0.7) o = makeRock(rng, x, y);
    } else if (s === S_MUD) {
      if (r < 0.14) o = { t: 'stump', x, y, r: 6 + rng() * 3 };
      else if (r < 0.26) o = { t: 'bush', x, y, r: 6 + rng() * 3, dead: true };
      else if (r < 0.3) { addDyn('crate', x, y); continue; }
    } else if (s === S_ROCK) {
      if (r < 0.14) o = makeRock(rng, x, y, 1.6);
      else if (r < 0.2) o = { ...makeTree(rng, x, y), t: 'pine', snow: climateT(x, y) < COLD_T + 0.04 };
    } else if (s === S_PASTURE) {
      if (r < 0.16) {                                   // kleine Herde
        const kind = parcelAt(x, y).animal, n = 3 + Math.floor(rng() * 4);
        for (let q = 0; q < n; q++) addDyn(kind, x + (rng() - .5) * 60, y + (rng() - .5) * 60);
        continue;
      }
      if (r < 0.08) o = makeTree(rng, x, y);
    } else if (s === S_ICE) {
      if (r < 0.04) o = makeRock(rng, x, y);
    } else if (s === S_SHALLOW) {
      if (r < 0.06) o = makeRock(rng, x, y);
    } else if (s === S_ASPHALT) {
      // gelegentlich eine Baustelle: Pylonenreihe quer über einen Fahrstreifen
      if (r < 0.03) {
        const a = rng() * TAU, n = 3 + Math.floor(rng() * 3);
        for (let q = 0; q < n; q++) addDyn('cone', x + Math.cos(a) * q * 16, y + Math.sin(a) * q * 16, true);
        continue;
      }
    }
    if (o && free(o.x, o.y, o.r)) S.push(o);
  }
  // Gebäude der Siedlungen gehören dem Chunk, in dem ihr Mittelpunkt liegt
  for (const st of c.setl) for (const b of settlementBuildings(st)) {
    if (b.x >= ox && b.x < ox + CS && b.y >= oy && b.y < oy + CS) S.push(b);
  }
  // Fußgänger auf Gehwegen, Plätzen und Wiesen im Ort, nicht auf der Fahrbahn und nicht in Gebäuden
  for (const st of c.setl) {
    const want = st.kind === 'city' ? 10 : st.kind === 'town' ? 6 : 3;
    for (let q = 0, placed = 0; q < want * 4 && placed < want; q++) {
      const x = ox + rng() * CS, y = oy + rng() * CS;
      if (setlQuery(x, y, [st]).f > 0.9 || !walkable(localSurf(c, x, y))) continue;
      if (S.some(o => o.w ? inRect(o, x, y, 8) : Math.hypot(o.x - x, o.y - y) < o.r + 6)) continue;
      const def = DYN.person;
      D.push({ t: 'person', person: true, x, y, r: def.r, m: def.m, vx: 0, vy: 0, a: rng() * TAU, va: 0,
               c: def.colors[Math.floor(rng() * def.colors.length)], hair: HAIR[Math.floor(rng() * HAIR.length)],
               walk: 16 + rng() * 12, timer: rng() * 3, phase: 0, down: 0, cross: 0 });
      placed++;
    }
  }
}

function makeTree(rng, x, y) {
  const r = 12 + rng() * 10;
  const autumn = autumnAt(x, y) && rng() < 0.85;
  const h = autumn ? 15 + rng() * 35 : 95 + rng() * 35, l = autumn ? 36 + rng() * 8 : 26 + rng() * 8;
  const blobs = [];
  const n = 5 + Math.floor(rng() * 2), a0 = rng() * TAU;
  for (let i = 0; i < n; i++) {
    const a = a0 + i / n * TAU + rng() * .4;
    blobs.push([Math.cos(a) * r * .42, Math.sin(a) * r * .42, r * (.5 + rng() * .15)]);
  }
  return { t: 'tree', x, y, r, blobs,
    c1: `hsl(${h},42%,${l}%)`, c2: `hsl(${h - 8},45%,${l + 9}%)`, c3: `hsl(${h - 15},50%,${l + 18}%)` };
}
function makeRock(rng, x, y, scale = 1) {
  const r = (7 + rng() * 9) * scale, pts = [];
  for (let i = 0; i < 8; i++) pts.push(.75 + rng() * .3);
  const l = 48 + rng() * 14;
  return { t: 'rock', x, y, r, pts, c1: `hsl(30,4%,${l}%)`, c2: `hsl(30,5%,${l + 12}%)` };
}
function tryHouse(c, rng, x, y) {
  const w = 50 + rng() * 34, h = 42 + rng() * 30;
  const pts = [[0, 0], [-w / 2, -h / 2], [w / 2, -h / 2], [-w / 2, h / 2], [w / 2, h / 2]];
  for (const [dx, dy] of pts) if (surfaceAt(x + dx, y + dy, c.segs) !== S_GRASS) return;
  const r = Math.hypot(w, h) / 2;
  const R = roadQuery(x, y, c.segs);
  if (R.seg && R.edge - R.seg.sh < r + 6) return;
  if (Math.hypot(x - spawn.x, y - spawn.y) < 250) return;
  for (const o of c.statics) if (Math.hypot(o.x - x, o.y - y) < o.r + r + 10) return;
  const roof = ROOFS[Math.floor(rng() * ROOFS.length)];
  c.statics.push({ t: 'house', x, y, w, h, r, c1: roof[0], c2: roof[1], chim: rng() });
}

const DYN = {
  cone:   { r: 5,  m: 0.05, colors: ['#ff7a1a'] },
  barrel: { r: 8,  m: 0.3,  colors: ['#c8352b', '#2f6db5', '#3d8a4a'] },
  crate:  { r: 9,  m: 0.35, colors: ['#a8783f'] },
  bale:   { r: 10, m: 0.4,  colors: ['#d9b85a'] },
  sheep:  { r: 7,  m: 0.15, colors: ['#f1eee6', '#e6e1d4', '#3a3633'], animal: true },
  cow:    { r: 11, m: 0.7,  colors: ['#f4f2ee', '#8a5a3a', '#2e2a28'], animal: true },
  person: { r: 5,  m: 0.08, colors: ['#d9473b', '#3b6fd9', '#e3b23c', '#3c9a5f', '#8e5bc4', '#f0efe8', '#2f343b', '#e07a2e'] },
};
const HAIR = ['#2b2118', '#5a3b22', '#c9a35a', '#8a3b1f', '#9a9a9a', '#151515'];

function chunkAt(x, y) {
  return chunks.get(ckey(Math.floor(x / CS), Math.floor(y / CS)));
}
function surfAtFast(x, y) {
  const cx = Math.floor(x / CS), cy = Math.floor(y / CS);
  const c = chunks.get(ckey(cx, cy));
  if (c && c.done) {
    const i = Math.floor((x - cx * CS) / CELL), j = Math.floor((y - cy * CS) / CELL);
    return c.surf[j * CN + i];
  }
  return surfaceAt(x, y);
}

function viewBounds(margin) {
  const z = cam.z;
  const hw = W / 2 / z + margin, hh = H / 2 / z + margin;
  return [cam.x - hw, cam.y - hh, cam.x + hw, cam.y + hh];
}

function ensureChunks() {
  const [x0, y0, x1, y1] = viewBounds(CS * 0.6);
  for (let cy = Math.floor(y0 / CS); cy <= Math.floor(y1 / CS); cy++) {
    for (let cx = Math.floor(x0 / CS); cx <= Math.floor(x1 / CS); cx++) {
      const k = ckey(cx, cy);
      let c = chunks.get(k);
      if (!c) { c = newChunk(cx, cy); chunks.set(k, c); }
      c.lastUsed = frameNo;
    }
  }
  if (chunks.size > MAX_CHUNKS) {
    const old = [...chunks.entries()].filter(([, c]) => c.lastUsed < frameNo - 30).sort((a, b) => a[1].lastUsed - b[1].lastUsed);
    for (let i = 0; i < old.length && chunks.size > MAX_CHUNKS; i++) chunks.delete(old[i][0]);
  }
}

function workChunks(budgetMs) {
  const t0 = performance.now();
  const todo = [];
  for (const c of chunks.values()) if (!c.done) todo.push(c);
  if (!todo.length) return;
  const d = c => Math.hypot((c.cx + .5) * CS - car.x, (c.cy + .5) * CS - car.y);
  todo.sort((a, b) => d(a) - d(b));
  for (const c of todo) {
    while (!c.done) {
      if (performance.now() - t0 > budgetMs) return;
      genRows(c, 8);
    }
  }
}
